        }

        // [롱스톤 멀티 세그먼트 암석 뱀 초기화]
        initOnixSegments() {
            this.segments = [];
            const numSegments = 11; // 머리 1개 + 몸통 9개 + 꼬리 끝 1개
            const segmentConfigs = [
                { radius: 44, drawR: 44, type: 'head' },
                { radius: 40, drawR: 40, type: 'body' },
                { radius: 38, drawR: 38, type: 'body' },
                { radius: 36, drawR: 36, type: 'body' },
                { radius: 34, drawR: 34, type: 'body' },
                { radius: 32, drawR: 32, type: 'body' },
                { radius: 30, drawR: 30, type: 'body' },
                { radius: 28, drawR: 28, type: 'body' },
                { radius: 25, drawR: 25, type: 'body' },
                { radius: 22, drawR: 22, type: 'body' },
                { radius: 18, drawR: 18, type: 'tail' }
            ];
            for (let i = 0; i < numSegments; i++) {
                const cfg = segmentConfigs[i];
                const vertices = [];
                const numPts = (cfg.type === 'head') ? 10 : 8;
                for (let p = 0; p < numPts; p++) {
                    const a = (p / numPts) * Math.PI * 2;
                    const rJitter = 1 + (Math.sin(p * 2.3 + i * 1.7) * 0.12) + (p % 2 === 0 ? 0.08 : -0.06);
                    vertices.push({
                        x: Math.cos(a) * cfg.drawR * rJitter,
                        y: Math.sin(a) * cfg.drawR * rJitter
                    });
                }
                this.segments.push({
                    x: this.x - i * 28,
                    y: this.y,
                    angle: this.aimAngle,
                    radius: cfg.radius,
                    drawR: cfg.drawR,
                    type: cfg.type,
                    index: i,
                    vertices: vertices
                });
            }
        }

        // [롱스톤 모든 돌 세그먼트 히트박스 판정 - 몸통 어느 곳에 맞아도 대미지 입음]
        isHitByCircle(cx, cy, cradius) {
            if (this.species === 'onix' && this.segments && this.segments.length > 0) {
                // 구멍파기 잠복 중에는 피격 면역
                if (this.state === 'burrowed') return false;
                for (const seg of this.segments) {
                    const d = Math.hypot(seg.x - cx, seg.y - cy);
                    if (d <= seg.radius + cradius) return true;
                }
            }
            return Math.hypot(this.x - cx, this.y - cy) <= this.radius + cradius;
        }

        // [롱스톤 세그먼트 위치 및 모션 업데이트 (Follow-the-leader Kinematics & Wave)]
        updateOnixSegments(opponent) {
            if (this.species !== 'onix') return;
            if (!this.segments || this.segments.length === 0) this.initOnixSegments();

            // 1. 머리 세그먼트(0번) 위치 바인딩
            let headX = this.x;
            let headY = this.y;
            let headAng = this.aimAngle;

            // 평타 박치기 모션 시 머리 당김/내려찍기 오프셋
            if (this.headbuttTimer > 0) {
                const prog = this.headbuttTimer / 16;
                const offset = (prog > 0.5) ? -Math.sin((prog - 0.5) * Math.PI * 2) * 32 : Math.sin(prog * Math.PI * 2) * 52;
                headX += Math.cos(this.aimAngle) * offset;
                headY += Math.sin(this.aimAngle) * offset;
            }

            this.segments[0].x = headX;
            this.segments[0].y = headY;
            this.segments[0].angle = headAng;

            // 2. 조이기(Bind) 시전 중: 유튜브 쇼츠 피카츄 조이기 명장면!
            // 롱스톤의 바위 몸통들이 피해자 주위를 1단, 2단, 3단 나선 원통 탑(Spiral Tower)으로 층층이 감아올리고
            // 롱스톤의 머리(0번)가 바로 위에서 피카츄를 매섭게 내려다보는 압도적 똬리 연출!
            if (this.state === 'binding' && this.boundVictim && this.boundVictim.isAlive) {
                const vic = this.boundVictim;
                this.bindAngle = (this.bindAngle || 0) + 0.08;

                // 조이기 으드득 펄스 (매 20프레임마다 똬리가 꽉 조여듦)
                const squeezePulse = Math.sin((this.bindTimer || 0) * 0.3) * 6;
                const baseCoilR = 48 + squeezePulse;

                // 머리(0번 세그먼트): 피카츄 바로 위에서 피카츄를 정면으로 내려다봄
                this.segments[0].x = vic.x;
                this.segments[0].y = vic.y - 52 - squeezePulse * 0.5;
                this.segments[0].angle = Math.PI / 2; // 아래를 응시

                // 몸통 세그먼트들: 피카츄를 층층이 감아올리는 나선 탑
                for (let i = 1; i < this.segments.length; i++) {
                    const seg = this.segments[i];
                    // 나선 회전 각도 및 층위 높이
                    const layer = Math.floor(i / 3.5); // 0, 1, 2층
                    const segAng = this.bindAngle + (i * 0.75);
                    const layerYOffset = (layer === 0 ? 16 : (layer === 1 ? 0 : -20));
                    const r = baseCoilR + (i % 3) * 5;

                    const targetX = vic.x + Math.cos(segAng) * r;
                    const targetY = vic.y + Math.sin(segAng) * (r * 0.65) + layerYOffset;

                    seg.x += (targetX - seg.x) * 0.42;
                    seg.y += (targetY - seg.y) * 0.42;
                    seg.angle = segAng + Math.PI / 2;
                }
                return;
            }

            // 3. 일반 이동 및 대기: 앞선 돌을 순서대로 따라오는 뱀 형태 Kinematics
            const spd = Math.hypot(this.vx, this.vy);
            const isMoving = spd > 0.3;

            for (let i = 1; i < this.segments.length; i++) {
                const prev = this.segments[i - 1];
                const curr = this.segments[i];

                const dx = curr.x - prev.x;
                const dy = curr.y - prev.y;
                let ang = Math.atan2(dy, dx);
                const targetDist = 28; // 마디 간격

                // 뱀처럼 구불거리는 파동 모션
                const waveAmp = isMoving ? 3.8 : 1.8;
                const waveFreq = isMoving ? 0.22 : 0.05;
                const wave = Math.sin((this.animTick || 0) * waveFreq - i * 0.65) * waveAmp;

                const perpAng = ang + Math.PI / 2;
                curr.x = prev.x + Math.cos(ang) * targetDist + Math.cos(perpAng) * wave;
                curr.y = prev.y + Math.sin(ang) * targetDist + Math.sin(perpAng) * wave;
                curr.angle = ang;
            }
        }

        // [구멍파기: 전광석화처럼 타겟 방향으로 꺾이면서 고속 돌진, 롱스톤 본체 은폐, 솟아오른 흙더미 렌더링, 오직 얼굴 돌에만 대미지]
        updateBurrow(opponent) {
            this.burrowTimer--;
            if (this.burrowHitCooldown > 0) this.burrowHitCooldown--;

            // 지하 잠복: 일반 공격 완전 면역 (지진에만 피격됨)
            this.invincibleTimer = 3;

            // 1. 전광석화처럼 타겟 방향으로 실시간 꺾임 (Steering / Direction Bending)
            const target = (this.isAI && this.aiFocusTarget && this.aiFocusTarget.isAlive) ? this.aiFocusTarget : opponent;
            const targetX = this.isAI ? (target ? target.x : this.x) : mouse.x;
            const targetY = this.isAI ? (target ? target.y : this.y) : mouse.y;
            const desiredAng = Math.atan2(targetY - this.y, targetX - this.x);

            let diff = desiredAng - this.aimAngle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;

            // 전광석화 스타일의 날카로운 궤적 꺾임 (각속도 0.16)
            this.aimAngle += diff * 0.16;

            const digSpeed = 16.5;
            this.burrowVx = Math.cos(this.aimAngle) * digSpeed;
            this.burrowVy = Math.sin(this.aimAngle) * digSpeed;
            this.vx = this.burrowVx;
            this.vy = this.burrowVy;
            this.x += this.vx;
            this.y += this.vy;

            // 경기장 벽 경계 체크
            this.x = Math.max(FIELD_MIN_X + 40, Math.min(FIELD_MAX_X - 40, this.x));
            this.y = Math.max(FIELD_MIN_Y + 40, Math.min(FIELD_MAX_Y - 40, this.y));

            // 세그먼트 위치 갱신 (몸통 세그먼트들이 꺾인 궤적을 뱀처럼 매끄럽게 따라옴)
            this.updateOnixSegments(opponent);

            // 2. 바닥 흙먼지와 지면 균열 파티클
            if (Math.random() < 0.7) {
                particles.push(new Particle(
                    this.x + (Math.random() - 0.5) * 36,
                    this.y + (Math.random() - 0.5) * 26,
                    -this.vx * 0.15 + (Math.random() - 0.5) * 2,
                    -this.vy * 0.15 - Math.random() * 3 - 1,
                    Math.random() < 0.5 ? '#795548' : '#8d6e63',
                    Math.random() * 8 + 4,
                    22,
                    'smoke'
                ));
            }
            if (this.burrowTimer % 6 === 0) {
                addGroundDecal(this.x, this.y, 36, 'crater');
            }

            // 3. 관통 충돌 판정: ★오직 얼굴 쪽(머리 돌, segments[0])에 닿은 적에게만 대미지 & 밀치기!★
            const headSeg = (this.segments && this.segments.length > 0) ? this.segments[0] : { x: this.x, y: this.y, radius: 42 };
            const targets = [opponent, ...(typeof scytherClones !== 'undefined' ? scytherClones : [])].filter(c => c && c.isAlive && c !== this);

            for (const t of targets) {
                const d = Math.hypot(t.x - headSeg.x, t.y - headSeg.y);
                if (d < headSeg.radius + t.radius + 12) {
                    if (this.burrowHitCooldown <= 0) {
                        const bumpAng = Math.atan2(t.y - headSeg.y, t.x - headSeg.x);
                        // 오직 머리 바위 충돌로 인한 48 피해 & 밀쳐짐
                        t.takeDamage(48, this, false, Math.cos(bumpAng) * 16, Math.sin(bumpAng) * 16);
                        if (typeof sfx !== 'undefined' && sfx.playRockSmash) sfx.playRockSmash();
                        triggerScreenShake(6);
                        this.burrowHitCooldown = 22;
                        showAlert('⛏️ 구멍파기 돌파 강타 (얼굴 바위 충돌)!');
                        for (let p = 0; p < 12; p++) {
                            const a = bumpAng + (Math.random() - 0.5) * 1.2;
                            const spd = Math.random() * 6 + 3;
                            particles.push(new Particle(headSeg.x, headSeg.y, Math.cos(a) * spd, Math.sin(a) * spd, '#8d6e63', 6, 18, 'spark'));
                        }
                    }
                }
            }

            // 4. 시간 종료 시 지면 솟구침
            if (this.burrowTimer <= 0) {
                this.emergeFromBurrow(opponent);
            }
        }

        emergeFromBurrow(opponent) {
            this.state = 'idle';
            this.invincibleTimer = 0;
            if (typeof sfx !== 'undefined') {
                if (sfx.playTackle) sfx.playTackle();
                if (sfx.playRockSmash) sfx.playRockSmash();
            }
            triggerScreenShake(15);
            addGroundDecal(this.x, this.y, 75, 'crater');
            addGroundFissure(this.x, this.y, 180, 5);
            showAlert('💥 롱스톤 땅속에서 솟구침 (DIG EMERGE)!');

            const splashRange = 185;
            const targets = [opponent, ...(typeof scytherClones !== 'undefined' ? scytherClones : [])].filter(c => c && c.isAlive && c !== this);
            for (const t of targets) {
                const d = Math.hypot(t.x - this.x, t.y - this.y);
                if (d <= splashRange + t.radius) {
                    const kbAng = Math.atan2(t.y - this.y, t.x - this.x);
                    t.takeDamage(95, this, true, Math.cos(kbAng) * 20, Math.sin(kbAng) * 20);
                }
            }
            for (let i = 0; i < 28; i++) {
                const a = Math.random() * Math.PI * 2;
                const spd = Math.random() * 9 + 4;
                particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd - 3, '#8d6e63', Math.random() * 9 + 4, 28));
            }
        }

        updateBinding(opponent) {
            if (!this.boundVictim || !this.boundVictim.isAlive) {
                this.releaseBind(false);
                return;
            }
            const victim = this.boundVictim;
            this.bindTimer--;

            this.vx = 0;
            this.vy = 0;
            victim.vx = 0;
            victim.vy = 0;
            victim.state = 'bound';

            // 애니 원작 피카츄 조이기: 롱스톤의 모든 몸통 돌들이 희생자를 둥글게 에워싸는 똬리 궤도 유지
            if (this.species === 'onix') {
                this.updateOnixSegments(opponent);
            }

            // 매 20틱(약 0.33초)마다 지속 피해 (DoT)
            if (this.bindTimer % 20 === 0) {
                victim.takeDamage(16, this, false, 0, 0, true);
                if (typeof sfx !== 'undefined' && sfx.playHit) sfx.playHit();
                triggerScreenShake(2);
                for (let i = 0; i < 4; i++) {
                    const a = Math.random() * Math.PI * 2;
                    particles.push(new Particle(
                        victim.x + Math.cos(a) * 20,
                        victim.y + Math.sin(a) * 20,
                        Math.cos(a) * 2, Math.sin(a) * 2,
                        '#b0bec5', Math.random() * 5 + 2, 16
                    ));
                }
            }

            // AI victim 인 경우 자동 탈출 시도
            if (victim.isAI) {
                const cfg = (typeof DIFFICULTY_SETTINGS !== 'undefined' && DIFFICULTY_SETTINGS[currentDifficulty]) || {};
                if (cfg.id !== 'sandbag') {
                    const escapeChance = (cfg.id === 'hell') ? 0.08 : ((cfg.id === 'hard') ? 0.05 : ((cfg.id === 'normal') ? 0.03 : 0.015));
                    if (Math.random() < escapeChance) {
                        this.qteHitsCurrent++;
                        if (this.qteHitsCurrent >= this.qteHitsNeeded) {
                            this.releaseBind(true);
                            return;
                        }
                    }
                }
            }

            if (this.bindTimer <= 0) {
                this.releaseBind(false);
            }
        }

        releaseBind(escapedByQte = false) {
            if (this.boundVictim) {
                this.boundVictim.boundBy = null;
                this.boundVictim.state = 'idle';
                if (escapedByQte) {
                    showAlert('💥 조이기 탈출 성공!');
                    if (typeof sfx !== 'undefined' && sfx.playTackle) sfx.playTackle();
                    const ang = Math.atan2(this.boundVictim.y - this.y, this.boundVictim.x - this.x);
                    this.boundVictim.vx = Math.cos(ang) * 8;
                    this.boundVictim.vy = Math.sin(ang) * 8;
                    triggerScreenShake(6);
                }
            }
            this.boundVictim = null;
            this.state = 'idle';
            this.qteKey = '';
            this.qteHitsCurrent = 0;
        }

        onQteHit(victim) {
            if (this.state !== 'binding' || this.boundVictim !== victim) return;
            this.qteHitsCurrent++;
            if (typeof sfx !== 'undefined' && sfx.playHit) sfx.playHit();
            triggerScreenShake(3);
            for (let i = 0; i < 5; i++) {
                const a = Math.random() * Math.PI * 2;
                particles.push(new Particle(victim.x, victim.y, Math.cos(a) * 4, Math.sin(a) * 4, '#ffeb3b', Math.random() * 6 + 3, 14, 'spark'));
            }
            if (this.qteHitsCurrent >= this.qteHitsNeeded) {
                this.releaseBind(true);
            }
        }

        plantBoneRushAnchor(x, y) {
            const cx = Math.max(FIELD_MIN_X + 25, Math.min(FIELD_MAX_X - 25, x));
            const cy = Math.max(FIELD_MIN_Y + 25, Math.min(FIELD_MAX_Y - 25, y));
            this.boneRushAnchor = {
                x: cx,
                y: cy,
                life: 300, // 5초
                maxLife: 300
            };
            sfx.playBoneRushToss();
            triggerScreenShake(4);
            addGroundDecal(cx, cy, 32, 'crater');
            for (let i = 0; i < 14; i++) {
                const spd = Math.random() * 4 + 1;
                const a = Math.random() * Math.PI * 2;
                particles.push(new Particle(cx, cy, Math.cos(a) * spd, Math.sin(a) * spd, '#00e5ff', Math.random() * 6 + 3, 16, 'spark'));
            }
            if (!this.isAI) showAlert('🦴 본러시 뼈다귀 박힘! F를 1번 더 눌러 순간이동 강타!');
        }

        // 적 AI가 분신들을 실제 플레이어와 똑같이 인식하고 타겟팅/공격하도록 대상을 선별
        getAITarget(opponent) {
            const validTargets = [opponent, ...scytherClones.filter(c => c.owner === opponent && c.isAlive)];
            if (!this.aiTargetTimer) this.aiTargetTimer = 0;
            this.aiTargetTimer--;

            if (!this.aiFocusTarget || !this.aiFocusTarget.isAlive || this.aiTargetTimer <= 0) {
                if (validTargets.length <= 1) {
                    this.aiFocusTarget = opponent;
                } else {
                    let candidates = [...validTargets];
                    candidates.sort((a, b) => Math.hypot(a.x - this.x, a.y - this.y) - Math.hypot(b.x - this.x, b.y - this.y));
                    // 분신과 본체 중 가장 가까운 대상(65%) 또는 근처 다른 분신(35%)에 어그로 집중
                    if (candidates.length >= 2 && Math.random() < 0.35) {
                        const idx = Math.min(candidates.length - 1, 1 + Math.floor(Math.random() * (candidates.length - 1)));
                        this.aiFocusTarget = candidates[idx];
                    } else {
                        this.aiFocusTarget = candidates[0];
                    }
                }
                this.aiTargetTimer = Math.floor(Math.random() * 45 + 30); // 약 0.5 ~ 1.25초 동안 타겟 집중 후 재탐색
            }
            return this.aiFocusTarget || opponent;
        }


        // [번치코 E스킬: 뛰어오르기 - 3초간 공중 무적 체공, 파란 원 표시 후 3초 뒤 내려찍기 급강하 140 에어본]
        updateBounce(opponent) {
            this.bounceTimer--;
            this.invincibleTimer = 3; // 공중 체공 동안 완전 무적

            // 공중 체공 중 방향키/WASD로 자유 이동 가능!
            if (this.bounceState === 'airborne') {
                if (this === p1) {
                    let moveX = 0; let moveY = 0;
                    if (keys['w'] || keys['ArrowUp']) moveY -= 1;
                    if (keys['s'] || keys['ArrowDown']) moveY += 1;
                    if (keys['a'] || keys['ArrowLeft']) moveX -= 1;
                    if (keys['d'] || keys['ArrowRight']) moveX += 1;
                    if (moveX !== 0 || moveY !== 0) {
                        const len = Math.hypot(moveX, moveY);
                        const airSpeed = 8.5; // 공중 기동 속도
                        this.bounceTargetX += (moveX / len) * airSpeed;
                        this.bounceTargetY += (moveY / len) * airSpeed;
                    }
                } else if (this.isAI) {
                    const aiTarget = this.getAITarget(opponent);
                    if (aiTarget) {
                        const dx = aiTarget.x - this.bounceTargetX;
                        const dy = aiTarget.y - this.bounceTargetY;
                        const dist = Math.hypot(dx, dy);
                        if (dist > 10) {
                            const airSpeed = 5.5;
                            this.bounceTargetX += (dx / dist) * Math.min(dist, airSpeed);
                            this.bounceTargetY += (dy / dist) * Math.min(dist, airSpeed);
                        }
                    }
                }

                // 경기장 내부로 제한
                this.bounceTargetX = Math.max(FIELD_MIN_X + 50, Math.min(FIELD_MAX_X - 50, this.bounceTargetX));
                this.bounceTargetY = Math.max(FIELD_MIN_Y + 50, Math.min(FIELD_MAX_Y - 50, this.bounceTargetY));
                this.x = this.bounceTargetX;
                this.y = this.bounceTargetY;
                this.vx = 0;
                this.vy = 0;

                // 비행 궤적 공중 스파크 파티클
                if (this.bounceTimer % 2 === 0) {
                    particles.push(new Particle(
                        this.bounceTargetX + (Math.random() - 0.5) * 35,
                        this.bounceTargetY + (Math.random() - 0.5) * 35,
                        (Math.random() - 0.5) * 2, -Math.random() * 2 - 1,
                        '#00e5ff', Math.random() * 5 + 3, 16, 'spark'
                    ));
                }
            }

            // 낙하 15프레임 전부터 급강하 돌입
            if (this.bounceTimer <= 15 && this.bounceState === 'airborne') {
                this.bounceState = 'falling';
                this.x = this.bounceTargetX;
                this.y = this.bounceTargetY;
            }

            // 3초(180프레임) 경과 시 지면 강타 폭발!
            if (this.bounceTimer <= 0) {
                this.bounceState = 'none';
                this.x = this.bounceTargetX;
                this.y = this.bounceTargetY;
                this.state = 'idle';

                triggerScreenShake(20);
                addGroundDecal(this.x, this.y, 65, 'crater');
                if (typeof sfx !== 'undefined') {
                    if (sfx.playExplosion) sfx.playExplosion();
                    if (sfx.playTackle) sfx.playTackle();
                }
                showAlert('💥 번치코 뛰어오르기 급강하 강타! (140 DMG & 에어본)! 💥');

                const hitR = 220;
                const targets = [opponent, ...(typeof scytherClones !== 'undefined' ? scytherClones : [])].filter(c => c && c.isAlive && c !== this);
                for (const t of targets) {
                    const d = Math.hypot(t.x - this.x, t.y - this.y);
                    if (d <= hitR + t.radius) {
                        const kbAng = Math.atan2(t.y - this.y, t.x - this.x);
                        t.takeDamage(140, this, true, Math.cos(kbAng) * 22, Math.sin(kbAng) * 22);
                        t.state = 'knockdown';
                        t.stateTimer = 28;
                    }
                }

                for (let i = 0; i < 35; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const spd = Math.random() * 10 + 3;
                    particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd - 4, Math.random() < 0.5 ? '#ff5722' : '#29b6f6', Math.random() * 9 + 4, 30, 'flame'));
                }
            }
        }

        // [번치코 R스킬: 인파이트 - 펀치 6연타 후 어퍼컷 띄우기, 시전 후 5초간 받는 대미지 1.5배 디버프]
        updateCloseCombat(opponent) {
            this.closeCombatTimer--;
            this.vx *= 0.4;
            this.vy *= 0.4;

            const target = (this.closeCombatTarget && this.closeCombatTarget.isAlive) ? this.closeCombatTarget : opponent;
            if (target && target.isAlive) {
                // 상대를 향해 바짝 붙음
                const ang = Math.atan2(target.y - this.y, target.x - this.x);
                this.aimAngle = ang;
                this.x += Math.cos(ang) * 2.5;
                this.y += Math.sin(ang) * 2.5;

                // 매 4프레임마다 연타 펀치 (총 6타)
                if (this.closeCombatTimer > 10 && this.closeCombatTimer % 4 === 0 && this.closeCombatHits < 6) {
                    this.closeCombatHits++;
                    target.takeDamage(16, this, false, Math.cos(ang) * 2, Math.sin(ang) * 2);
                    if (typeof sfx !== 'undefined' && sfx.playBulletPunch) sfx.playBulletPunch();
                    triggerScreenShake(3.5);

                    // 펀치 화염 잔상 파티클
                    const spread = (Math.random() - 0.5) * 25;
                    particles.push(new Particle(
                        target.x + Math.cos(ang + Math.PI/2) * spread,
                        target.y + Math.sin(ang + Math.PI/2) * spread,
                        Math.cos(ang) * 4, Math.sin(ang) * 4,
                        '#ff9100', 8, 12, 'spark'
                    ));
                }

                // 마지막 7타째 강력한 불꽃 어퍼컷 (10프레임 시점)
                if (this.closeCombatTimer === 8) {
                    this.closeCombatHits++;
                    target.takeDamage(85, this, true, Math.cos(ang) * 18, -20);
                    target.state = 'knockdown';
                    target.stateTimer = 35;
                    if (typeof sfx !== 'undefined' && sfx.playHit) sfx.playHit();
                    triggerScreenShake(14);
                    showAlert('🥊 번치코 인파이트 블레이즈 어퍼컷 강타!! 🥊');

                    for (let p = 0; p < 22; p++) {
                        const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.0;
                        const spd = Math.random() * 9 + 4;
                        particles.push(new Particle(target.x, target.y, Math.cos(a) * spd, Math.sin(a) * spd, '#ff3d00', 9, 22, 'flame'));
                    }
                }
            }

            if (this.closeCombatTimer <= 0) {
                this.state = 'idle';
                this.defenseDownTimer = 300; // 5초간 받는 피해 1.5배 디버프 적용!
                showAlert('⚠️ 인파이트 반동: 5초간 받는 대미지 1.5배 증가! ⚠️');
            }
        }

        // [번치코 F스킬: 플레어드라이브 - 전신 화염 불새 돌진, 160 대미지, 자신 45 반동, 상대 7초 화상 DoT]
        updateFlareBlitz(opponent) {
            this.flareBlitzTimer--;
            this.vx = this.flareBlitzVx;
            this.vy = this.flareBlitzVy;

            const prevX = this.x;
            const prevY = this.y;
            this.x += this.vx;
            this.y += this.vy;

            // 경기장 경계 체크
            if (this.x < FIELD_MIN_X) { this.x = FIELD_MIN_X; this.flareBlitzTimer = 0; }
            if (this.x > FIELD_MAX_X) { this.x = FIELD_MAX_X; this.flareBlitzTimer = 0; }
            if (this.y < FIELD_MIN_Y) { this.y = FIELD_MIN_Y; this.flareBlitzTimer = 0; }
            if (this.y > FIELD_MAX_Y) { this.y = FIELD_MAX_Y; this.flareBlitzTimer = 0; }

            // 돌진 궤적 거대 화염 파티클
            for (let i = 0; i < 4; i++) {
                particles.push(new Particle(
                    this.x + (Math.random() - 0.5) * 28,
                    this.y + (Math.random() - 0.5) * 28,
                    -this.vx * 0.2 + (Math.random() - 0.5) * 3,
                    -this.vy * 0.2 + (Math.random() - 0.5) * 3,
                    Math.random() < 0.6 ? '#ff1744' : '#ffeb3b',
                    Math.random() * 10 + 5,
                    20,
                    'flame'
                ));
            }

            // 충돌 판정 대상 (상대 플레이어, AI, 분신 모두 포함)
            const targets = [opponent, (this === p1 ? p2 : p1), ...(typeof scytherClones !== 'undefined' ? scytherClones : [])].filter((c, idx, arr) => c && c.isAlive && c !== this && arr.indexOf(c) === idx);
            for (const t of targets) {
                // 초고속 이동(22px/frame) 시 관통 방지를 위한 선분 투영 거리 체크 (Swept Collision)
                const segDx = this.x - prevX;
                const segDy = this.y - prevY;
                const segLenSq = segDx * segDx + segDy * segDy;
                let d = Math.hypot(t.x - this.x, t.y - this.y);
                if (segLenSq > 0) {
                    const u = Math.max(0, Math.min(1, ((t.x - prevX) * segDx + (t.y - prevY) * segDy) / segLenSq));
                    const projX = prevX + u * segDx;
                    const projY = prevY + u * segDy;
                    d = Math.hypot(t.x - projX, t.y - projY);
                }

                if (d <= this.radius + (t.radius || 30) + 35) {
                    // 적중 시 대폭발!
                    const kbAng = Math.atan2(t.y - this.y, t.x - this.x);
                    t.takeDamage(160, this, true, Math.cos(kbAng) * 24, Math.sin(kbAng) * 24);
                    t.applyBurn(this, 420, 12); // 상대 7초간 화상 부여

                    // 번치코 자신도 45 반동 피해!
                    this.takeDamage(45, this, false, -Math.cos(kbAng) * 6, -Math.sin(kbAng) * 6, true);

                    triggerScreenShake(22);
                    addGroundDecal(this.x, this.y, 65, 'scorch');
                    if (typeof sfx !== 'undefined' && sfx.playExplosion) sfx.playExplosion();
                    showAlert('🔥 플레어드라이브 대폭발 강타! (자신 반동 45, 상대 7초 화상!) 🔥');

                    for (let p = 0; p < 35; p++) {
                        const a = Math.random() * Math.PI * 2;
                        const spd = Math.random() * 11 + 3;
                        particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, '#ff3d00', Math.random() * 10 + 5, 28, 'flame'));
                    }

                    this.state = 'idle';
                    this.flareBlitzTimer = 0;
                    this.vx = 0;
                    this.vy = 0;
                    return;
                }
            }

            if (this.flareBlitzTimer <= 0) {
                this.state = 'idle';
                this.vx = 0;
                this.vy = 0;
            }
        }

        update(opponent) {
            if (!this.isAlive) return;
            this.animTick++;

            // 스톤에지 바위와의 충돌 판정 (길을 막는 장애물)
            if (typeof stoneRocks !== 'undefined') {
                for (const rock of stoneRocks) {
                    if (!rock || !rock.isAlive) continue;
                    const d = Math.hypot(this.x - rock.x, this.y - rock.y);
                    const minDist = this.radius + rock.radius;
                    if (d < minDist && d > 0.001) {
                        const push = minDist - d;
                        const nx = (this.x - rock.x) / d;
                        const ny = (this.y - rock.y) / d;
                        this.x += nx * push;
                        this.y += ny * push;
                        const dot = this.vx * nx + this.vy * ny;
                        if (dot < 0) {
                            this.vx -= dot * nx;
                            this.vy -= dot * ny;
                        }
                    }
                }
            }

            // 롱스톤 상태 제어
            if (this.state === 'burrowed') {
                this.updateBurrow(opponent);
                return;
            }

            // 롱스톤 지진 2타 ('탁 탁') 타이머 업데이트
            if (this.earthquakeStepTimer > 0) {
                this.earthquakeStepTimer--;
                if (this.earthquakeStepTimer === 0 && this.earthquakeStep === 1) {
                    // 2타 발동 ("탁!")
                    this.earthquakeStep = 2;
                    this.attackMotionTimer = 18;
                    if (typeof sfx !== 'undefined' && sfx.playEarthquake) sfx.playEarthquake();
                    triggerScreenShake(16);
                    addGroundFissure(this.x, this.y, 420, 7);
                    showAlert('🌋 지진 2타 강타 (탁-탁)!');
                    groundEffects.push(new EarthquakeShockwave(this.x, this.y, this, 420, 42, 85));
                }
            }

            // 롱스톤 세그먼트 위치 업데이트
            if (this.species === 'onix') {
                this.updateOnixSegments(opponent);
            }

            // 번치코 방어력 감소 디버프 (인파이트 후 5초) 타이머
            if (this.defenseDownTimer > 0) this.defenseDownTimer--;

            // 화상 상태이상 타이머 (7초 지속 DoT 피해)
            if (this.burnTimer > 0) {
                this.burnTimer--;
                if (this.burnTimer % 60 === 0 && this.isAlive) {
                    this.takeDamage(this.burnDmg || 12, this.burnAttacker || this, false, 0, 0, true);
                    if (typeof sfx !== 'undefined' && sfx.playHit) sfx.playHit();
                    damageTexts.push(new DamageText(this.x, this.y - 18, '🔥 화상 피해!', '#ff5722', false));
                }
                if (Math.random() < 0.45) {
                    particles.push(new Particle(
                        this.x + (Math.random() - 0.5) * 20,
                        this.y + (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 2, -Math.random() * 2 - 1,
                        '#ff5722', Math.random() * 6 + 3, 16, 'flame'
                    ));
                }
            }

            // 번치코 전용 상태 제어
            if (this.state === 'bounce_airborne' || this.bounceState === 'airborne' || this.bounceState === 'falling') {
                this.updateBounce(opponent);
                return;
            }
            if (this.state === 'close_combat') {
                this.updateCloseCombat(opponent);
                return;
            }
            if (this.state === 'flare_blitz') {
                this.updateFlareBlitz(opponent);
                return;
            }
            if (this.state === 'binding') {
                this.updateBinding(opponent);
                return;
            }
            if (this.state === 'bound' || this.boundBy) {
                this.vx = 0;
                this.vy = 0;
                return;
            }
            if (this.headbuttTimer > 0) {
                this.headbuttTimer--;
            }
            if (this.invincibleTimer > 0) this.invincibleTimer--;
            if (this.attackMotionTimer > 0) this.attackMotionTimer--;

            let currentBaseSpeed = this.baseSpeed;
            if (this.stunTimer > 0) {
                this.stunTimer--;
                this.vx *= 0.75;
                this.vy *= 0.75;
                this.state = 'stun';
                if (Math.random() < 0.6) {
                    particles.push(new Particle(
                        this.x + (Math.random() - 0.5) * 28,
                        this.y + (Math.random() - 0.5) * 28,
                        (Math.random() - 0.5) * 2,
                        (Math.random() - 0.5) * 2,
                        Math.random() < 0.6 ? '#ffd700' : '#ffffff',
                        Math.random() * 7 + 3,
                        16,
                        'spark'
                    ));
                }
            } else if (this.slowTimer > 0) {
                this.slowTimer--;
                currentBaseSpeed *= (1 - this.slowAmount);
                if (Math.random() < 0.3) {
                    particles.push(new Particle(this.x, this.y, 0, -1, '#80d8ff', 4, 15, 'circle'));
                }
            }

            for (const key in this.cooldowns) {
                if (this.cooldowns[key] > 0) {
                    this.cooldowns[key] = Math.max(0, this.cooldowns[key] - 1 / 60);
                }
            }

            // 루카리오: 5초간 본러시 버프 타이머
            if (this.boneRushBuffTimer > 0) {
                this.boneRushBuffTimer--;
                if (Math.random() < 0.5) {
                    particles.push(new Particle(
                        this.x + (Math.random() - 0.5) * 20,
                        this.y + (Math.random() - 0.5) * 20,
                        (Math.random() - 0.5) * 1.5,
                        -Math.random() * 2 - 1,
                        Math.random() < 0.6 ? '#00e5ff' : '#2979ff',
                        Math.random() * 5 + 3,
                        14,
                        'spark'
                    ));
                }
            }

            // 루카리오: 바닥에 박힌 뼈다귀 유지시간 관리
            if (this.boneRushAnchor) {
                this.boneRushAnchor.life--;
                if (Math.random() < 0.45) {
                    particles.push(new Particle(
                        this.boneRushAnchor.x + (Math.random() - 0.5) * 16,
                        this.boneRushAnchor.y + (Math.random() - 0.5) * 8,
                        0,
                        -Math.random() * 2 - 0.5,
                        '#00e5ff',
                        Math.random() * 6 + 3,
                        14,
                        'spark'
                    ));
                }
                if (this.boneRushAnchor.life <= 0) {
                    this.boneRushAnchor = null;
                    if (this.cooldowns.f <= 0) this.cooldowns.f = this.maxCooldowns.f;
                }
            }

            // 루카리오: 뼈다귀 부메랑 10발 순차 발사 큐 처리
            if (this.boneBoomerangQueue && this.boneBoomerangQueue.length > 0) {
                for (let i = this.boneBoomerangQueue.length - 1; i >= 0; i--) {
                    const item = this.boneBoomerangQueue[i];
                    item.delay--;
                    if (item.delay <= 0) {
                        this.boneBoomerangQueue.splice(i, 1);
                        const fireAngle = this.aimAngle + item.angleOffset;
                        const spd = 24;
                        projectiles.push(new Projectile({
                            x: this.x + Math.cos(fireAngle) * 32,
                            y: this.y + Math.sin(fireAngle) * 32,
                            vx: Math.cos(fireAngle) * spd,
                            vy: Math.sin(fireAngle) * spd,
                            speed: spd,
                            radius: 16,
                            damage: 14,
                            owner: this,
                            type: 'bone_boomerang',
                            life: 140,
                            piercing: true,
                            knockback: 4,
                            aimAngle: fireAngle
                        }));
                        sfx.playBoneBoomerang();
                    }
                }
            }

            if (this.state !== 'sprint' && this.stamina < this.maxStamina) {
                this.stamina = Math.min(this.maxStamina, this.stamina + 0.45);
            }

            // 샌드백 모드 적(p2): 모든 공격/스킬/자체 이동 완전 차단 및 피격 넉백만 감속 처리
            if (this !== p1 && currentDifficulty === 'sandbag') {
                if (this.state === 'stun' || this.stunTimer > 0) {
                    this.vx *= 0.8;
                    this.vy *= 0.8;
                    if (this.stunTimer <= 0) this.state = 'idle';
                } else if (this.state === 'hurt' || this.state === 'knockdown') {
                    this.vx *= 0.88;
                    this.vy *= 0.88;
                    this.stateTimer--;
                    if (this.stateTimer <= 0) this.state = 'idle';
                } else {
                    this.vx *= 0.6;
                    this.vy *= 0.6;
                    if (Math.abs(this.vx) < 0.05) this.vx = 0;
                    if (Math.abs(this.vy) < 0.05) this.vy = 0;
                    this.state = 'idle';
                }
            } else if (this.state === 'stun' || this.stunTimer > 0) {
                this.vx *= 0.8;
                this.vy *= 0.8;
                if (this.stunTimer <= 0) this.state = 'idle';

            } else if (this.state === 'hurt' || this.state === 'knockdown') {
                this.vx *= 0.92;
                this.vy *= 0.92;
                this.stateTimer--;
                if (this.stateTimer <= 0) this.state = 'idle';

            } else if (this.state === 'braking') {
                this.vx *= 0.84;
                this.vy *= 0.84;
                this.stateTimer--;
                if (Math.random() < 0.7) {
                    particles.push(new Particle(this.x, this.y + 15, (Math.random() - 0.5) * 3, -Math.random() * 2, '#cfd8dc', Math.random() * 9 + 4, 20, 'circle'));
                }
                if (this.stateTimer <= 0) this.state = 'idle';

            } else if (this.state === 'charging') {
                this.updateCharge(opponent);

            } else if (this.state === 'quick_attack') {
                this.updateQuickAttack(opponent);

            } else if (this.state === 'iron_tail') {
                this.updateIronTail(opponent);

            } else if (this.state === 'uturn_dash') {
                this.updateUTurnDash(opponent);

            } else if (this.state === 'double_team_motion') {
                this.updateDoubleTeamMotion(opponent);

            } else if (this.state === 'whirlpool') {
                this.updateWhirlpool(opponent);

            } else if (this.state === 'flamethrower') {
                this.updateFlamethrower(opponent);

            } else if (this.state === 'petal_blizzard') {
                this.updatePetalBlizzard(opponent);

            } else if (this.state === 'solarbeam_charge') {
                this.updateSolarBeamCharge(opponent);

            } else if (this.state === 'solarbeam_fire') {
                this.updateSolarBeamFire(opponent);

            } else {
                if (this === p1) {
                    this.updatePlayerMovement(currentBaseSpeed);
                } else if (this.isAI && currentDifficulty !== 'sandbag') {
                    const aiTarget = this.getAITarget(opponent);
                    this.updateAI(aiTarget, currentBaseSpeed);
                } else {
                    this.vx *= 0.6;
                    this.vy *= 0.6;
                    if (Math.abs(this.vx) < 0.05) this.vx = 0;
                    if (Math.abs(this.vy) < 0.05) this.vy = 0;
                    this.state = 'idle';
                }
            }

            this.x += this.vx;
            this.y += this.vy;

            // 대형 스타디움 이동 가능 경계 체크
            if (this.x < FIELD_MIN_X) { this.x = FIELD_MIN_X; this.vx *= -0.3; }
            if (this.x > FIELD_MAX_X) { this.x = FIELD_MAX_X; this.vx *= -0.3; }
            if (this.y < FIELD_MIN_Y) { this.y = FIELD_MIN_Y; this.vy *= -0.3; }
            if (this.y > FIELD_MAX_Y) { this.y = FIELD_MAX_Y; this.vy *= -0.3; }

            // 조준 방향 갱신
            if (this === p1) {
                if (this.state === 'solarbeam_charge' || this.state === 'solarbeam_fire') {
                    const targetAngle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
                    let diff = targetAngle - this.aimAngle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    const turnRate = (this.state === 'solarbeam_fire') ? 0.010 : 0.022;
                    this.aimAngle += diff * turnRate;
                    this.facingLeft = (Math.cos(this.aimAngle) < 0);
                } else {
                    this.aimAngle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
                    this.facingLeft = (mouse.x < this.x);
                }
            } else if (currentDifficulty === 'sandbag') {
                // 샌드백 적은 플레이어를 마주보며 멈춰있음
                if (opponent) {
                    this.aimAngle = Math.atan2(opponent.y - this.y, opponent.x - this.x);
                    this.facingLeft = (opponent.x < this.x);
                }
            } else {
                const targetObj = (this.aiFocusTarget && this.aiFocusTarget.isAlive) ? this.aiFocusTarget : opponent;
                if (targetObj) {
                    if (this.state === 'solarbeam_charge' || this.state === 'solarbeam_fire') {
                        const targetAngle = Math.atan2(targetObj.y - this.y, targetObj.x - this.x);
                        let diff = targetAngle - this.aimAngle;
                        while (diff < -Math.PI) diff += Math.PI * 2;
                        while (diff > Math.PI) diff -= Math.PI * 2;
                        const turnRate = (this.state === 'solarbeam_fire') ? 0.010 : 0.022;
                        this.aimAngle += diff * turnRate;
                        this.facingLeft = (Math.cos(this.aimAngle) < 0);
                    } else {
                        this.aimAngle = Math.atan2(targetObj.y - this.y, targetObj.x - this.x);
                        this.facingLeft = (targetObj.x < this.x);
                    }
                }
            }
        }

        updatePlayerMovement(speed) {
            let moveX = 0; let moveY = 0;
            if (keys['w']) moveY -= 1;
            if (keys['s']) moveY += 1;
            if (keys['a']) moveX -= 1;
            if (keys['d']) moveX += 1;

            const isMoving = (moveX !== 0 || moveY !== 0);

            // 달리기 토글 유지 판정 (1번 누르면 켜지고, 다시 누르면 꺼짐)
            let isSprinting = this.isSprintToggled && isMoving && (this.stamina > 3);

            if (isSprinting) {
                this.stamina = Math.max(0, this.stamina - 0.45);
                if (this.stamina <= 0) {
                    this.isSprintToggled = false;
                    showAlert('🚶 STAMINA DEPLETED!');
                    if (typeof updateSprintTag === 'function') updateSprintTag();
                }
            }

            const currentSpeed = isSprinting ? this.sprintSpeed : speed;

            if (isMoving) {
                const len = Math.hypot(moveX, moveY);
                this.vx = (moveX / len) * currentSpeed;
                this.vy = (moveY / len) * currentSpeed;
                this.state = isSprinting ? 'sprint' : 'run';
                this.walkFrame += isSprinting ? 0.32 : 0.22;

                if (isSprinting && Math.random() < 0.4) {
                    particles.push(new Particle(this.x, this.y + 15, -this.vx * 0.3, -Math.random() * 1.5, '#eceff1', 5, 14, 'circle'));
                }
            } else {
                this.vx *= 0.6;
                this.vy *= 0.6;
                this.state = 'idle';
            }
        }

        updateCharge(opponent) {
            let targetSteerAngle = this.chargeAngle;
            if (!this.isAI) {
                targetSteerAngle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
            } else {
                targetSteerAngle = Math.atan2(opponent.y - this.y, opponent.x - this.x);
            }

            let diff = targetSteerAngle - this.chargeAngle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            this.chargeAngle += diff * 0.06;

            this.vx = Math.cos(this.chargeAngle) * this.chargeSpeed;
            this.vy = Math.sin(this.chargeAngle) * this.chargeSpeed;
            this.chargeDistance += this.chargeSpeed;
            this.shellSpinAngle += 0.55;

            if (this.species === 'charmander') {
                particles.push(new Particle(this.x - Math.cos(this.chargeAngle) * 20, this.y - Math.sin(this.chargeAngle) * 20, -this.vx * 0.2, (Math.random() - 0.5) * 3, '#ff5722', Math.random() * 9 + 4, 18, 'flame'));
            } else {
                particles.push(new Particle(this.x - Math.cos(this.chargeAngle) * 20, this.y - Math.sin(this.chargeAngle) * 20, -this.vx * 0.2, (Math.random() - 0.5) * 3, '#00e5ff', Math.random() * 9 + 4, 18, 'circle'));
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                if (proj.type === 'bubble' && proj.owner !== this) {
                    const dist = Math.hypot(proj.x - this.x, proj.y - this.y);
                    if (dist <= this.radius + proj.radius) {
                        proj.popEffect();
                        proj.life = 0;
                        this.takeDamage(20, proj.owner, false, -this.vx * 0.3, -this.vy * 0.3);
                        this.applySlow(0.5, 90);
                        this.state = 'braking';
                        this.stateTimer = 25;
                        sfx.playBrake();
                        showAlert('BUBBLE TACKLE BLOCKED!');
                        return;
                    }
                }
            }

            const potentialTargets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
            let hitTarget = null;
            for (const t of potentialTargets) {
                if (Math.hypot(t.x - this.x, t.y - this.y) <= this.radius + t.radius) {
                    hitTarget = t;
                    break;
                }
            }
            if (hitTarget) {
                const kbX = Math.cos(this.chargeAngle) * 26;
                const kbY = Math.sin(this.chargeAngle) * 26;
                hitTarget.takeDamage(120, this, true, kbX, kbY);

                addGroundDecal((this.x + hitTarget.x) / 2, (this.y + hitTarget.y) / 2, 38, 'crater');
                triggerHitstop(10);
                triggerScreenShake(22);
                sfx.playHit();
                sfx.playTackle();
                showAlert('HEAVY IMPACT!');

                this.vx = -Math.cos(this.chargeAngle) * 4;
                this.vy = -Math.sin(this.chargeAngle) * 4;
                this.state = 'idle';
                return;
            }

            if (this.chargeDistance >= this.maxChargeDistance) {
                this.state = 'braking';
                this.stateTimer = 22;
                addGroundDecal(this.x, this.y, 24, 'skid');
                sfx.playBrake();
                showAlert('SKID BRAKE!');
            }
        }

        updateWhirlpool(opponent) {
            this.whirlpoolTimer--;
            this.shellSpinAngle += 0.88; // 등껍질 초고속 스핀
            this.vx *= 0.85;
            this.vy *= 0.85;

            const radius = 230;
            // 4개 등껍질 구멍에서 나선형으로 분사되는 고속 물줄기 파티클
            for (let i = 0; i < 4; i++) {
                const a = this.shellSpinAngle + (i * Math.PI / 2);
                const spd = 9.5;
                particles.push(new Particle(
                    this.x + Math.cos(a) * 22,
                    this.y + Math.sin(a) * 22,
                    Math.cos(a) * spd,
                    Math.sin(a) * spd,
                    Math.random() < 0.6 ? '#00e5ff' : '#ffffff',
                    Math.random() * 8 + 4,
                    22,
                    'circle'
                ));
            }

            const whirlpoolTargets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
            if (this.whirlpoolTimer % 10 === 0) {
                for (const tgt of whirlpoolTargets) {
                    const dist = Math.hypot(tgt.x - this.x, tgt.y - this.y);
                    if (dist <= radius + tgt.radius) {
                        const pullAngle = Math.atan2(this.y - tgt.y, this.x - tgt.x);
                        tgt.takeDamage(26, this, false, Math.cos(pullAngle) * 3.5, Math.sin(pullAngle) * 3.5);
                        triggerScreenShake(3.5);
                        sfx.playWater();
                    }
                }
            }

            if (this.whirlpoolTimer <= 0) {
                sfx.playWater();
                triggerScreenShake(14);
                addGroundDecal(this.x, this.y, 45, 'water');
                for (const tgt of whirlpoolTargets) {
                    const dist = Math.hypot(tgt.x - this.x, tgt.y - this.y);
                    if (dist <= radius + tgt.radius) {
                        const blastAngle = Math.atan2(tgt.y - this.y, tgt.x - this.x);
                        tgt.takeDamage(70, this, true, Math.cos(blastAngle) * 17, Math.sin(blastAngle) * 17);
                    }
                }
                this.state = 'idle';
            }
        }

        updateFlamethrower(opponent) {
            this.flameChannelTimer--;
            this.vx *= 0.55;
            this.vy *= 0.55;

            // 리자몽 스타일: 2프레임마다 굵은 화염 분사 (연속 화염 방사 빔)
            if (this.flameChannelTimer % 2 === 0) {
                const streamAngle = this.aimAngle + (Math.random() - 0.5) * 0.16;
                const spd = Math.random() * 6 + 21;

                projectiles.push(new Projectile({
                    x: this.x + Math.cos(this.aimAngle) * 35,
                    y: this.y + Math.sin(this.aimAngle) * 35,
                    vx: Math.cos(streamAngle) * spd,
                    vy: Math.sin(streamAngle) * spd,
                    speed: spd,
                    radius: 28,
                    damage: 14,
                    owner: this,
                    type: 'flamethrower',
                    life: 34,
                    piercing: true,
                    isBlockable: false,
                    knockback: 1.8
                }));

                // 총구 화염 및 불꽃 파티클
                if (Math.random() < 0.8) {
                    particles.push(new Particle(
                        this.x + Math.cos(this.aimAngle) * 38,
                        this.y + Math.sin(this.aimAngle) * 38,
                        Math.cos(streamAngle) * 6 + (Math.random() - 0.5) * 4,
                        Math.sin(streamAngle) * 6 + (Math.random() - 0.5) * 4,
                        Math.random() < 0.5 ? '#ffeb3b' : '#ff5722',
                        Math.random() * 8 + 4,
                        18,
                        'flame'
                    ));
                }
            }

            if (this.flameChannelTimer % 10 === 0) {
                sfx.playFire();
                triggerScreenShake(1.5);
            }

            if (this.flameChannelTimer <= 0) {
                this.state = 'idle';
            }
        }

        // --- 이상해씨 E스킬: 꽃보라 (전방위 360도 공격, 범위 220px) ---
        updatePetalBlizzard(opponent) {
            this.petalBlizzardTimer--;
            this.vx *= 0.88;
            this.vy *= 0.88;

            const radius = 220; // 꼬부기 물회오리와 동일한 반경 220px
            for (let i = 0; i < 6; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * radius;
                const petalColor = Math.random() < 0.4 ? '#ff80ab' : (Math.random() < 0.7 ? '#f48fb1' : '#b9f6ca');
                particles.push(new Particle(this.x + Math.cos(angle) * dist, this.y + Math.sin(angle) * dist, -Math.sin(angle) * 7.5, Math.cos(angle) * 7.5, petalColor, Math.random() * 8 + 4, 22, 'petal'));
            }

            // 매 10프레임마다 다단히트 피해
            const blizzardTargets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
            if (this.petalBlizzardTimer % 10 === 0) {
                for (const tgt of blizzardTargets) {
                    const dist = Math.hypot(tgt.x - this.x, tgt.y - this.y);
                    if (dist <= radius + tgt.radius) {
                        const knockAngle = Math.atan2(tgt.y - this.y, tgt.x - this.x);
                        tgt.takeDamage(24, this, false, Math.cos(knockAngle) * 5, Math.sin(knockAngle) * 5);
                        triggerScreenShake(3);
                        sfx.playEnergyBall();
                    }
                }
            }

            // 종료 시 피날레 꽃보라 방출
            if (this.petalBlizzardTimer <= 0) {
                triggerScreenShake(14);
                sfx.playEnergyBall();
                for (const tgt of blizzardTargets) {
                    const dist = Math.hypot(tgt.x - this.x, tgt.y - this.y);
                    if (dist <= radius + tgt.radius) {
                        const blastAngle = Math.atan2(tgt.y - this.y, tgt.x - this.x);
                        tgt.takeDamage(75, this, true, Math.cos(blastAngle) * 18, Math.sin(blastAngle) * 18);
                    }
                }
                this.state = 'idle';
            }
        }

        // --- 이상해씨 F스킬: 솔라빔 차징 (움직일 수 없고 끊기지 않음, 방향 조절 가능) ---
        updateSolarBeamCharge(opponent) {
            this.solarChargeTimer--;
            this.vx = 0;
            this.vy = 0;

            // 주변에서 꽃봉오리로 모여드는 태양 에너지 파티클
            for (let i = 0; i < 4; i++) {
                const a = Math.random() * Math.PI * 2;
                const dist = Math.random() * 120 + 40;
                const spd = dist / 15;
                particles.push(new Particle(this.x + Math.cos(a) * dist, this.y + Math.sin(a) * dist, -Math.cos(a) * spd, -Math.sin(a) * spd, Math.random() < 0.5 ? '#ffff00' : '#76ff03', Math.random() * 6 + 3, 16, 'circle'));
            }

            if (this.solarChargeTimer % 12 === 0) {
                triggerScreenShake(1.5);
            }

            // 차징 완료 -> 강력한 솔라빔 발사!
            if (this.solarChargeTimer <= 0) {
                this.state = 'solarbeam_fire';
                this.solarFireTimer = 32;
                sfx.playSolarBeam();
                triggerScreenShake(20);
                triggerHitstop(6);
                showAlert('☀️ SOLAR BEAM! ☀️');
            }
        }

        // --- 이상해씨 F스킬: 솔라빔 발사 (극태 레이저 광선) ---
        updateSolarBeamFire(opponent) {
            this.solarFireTimer--;
            this.vx = 0;
            this.vy = 0;

            const beamLength = 1300;
            const beamWidth = 65;

            // 빔 타격 판정 (직선 세그먼트 충돌 - 본체 및 분신)
            const beamTargets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
            if (this.solarFireTimer % 4 === 0) {
                const startX = this.x + Math.cos(this.aimAngle) * 20;
                const startY = this.y + Math.sin(this.aimAngle) * 20;
                const endX = startX + Math.cos(this.aimAngle) * beamLength;
                const endY = startY + Math.sin(this.aimAngle) * beamLength;

                const dx = endX - startX;
                const dy = endY - startY;
                const l2 = dx * dx + dy * dy;

                for (const tgt of beamTargets) {
                    let t = ((tgt.x - startX) * dx + (tgt.y - startY) * dy) / l2;
                    t = Math.max(0, Math.min(1, t));

                    const projX = startX + t * dx;
                    const projY = startY + t * dy;
                    const distToBeam = Math.hypot(tgt.x - projX, tgt.y - projY);

                    if (distToBeam <= beamWidth / 2 + tgt.radius) {
                        const kbX = Math.cos(this.aimAngle) * 7;
                        const kbY = Math.sin(this.aimAngle) * 7;
                        tgt.takeDamage(45, this, true, kbX, kbY);
                        triggerScreenShake(4);

                        for (let p = 0; p < 3; p++) {
                            particles.push(new Particle(tgt.x, tgt.y, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8, '#ffffff', 8, 20, 'star'));
                        }
                    }
                }
            }

            // 빔 이펙트 파티클
            for (let i = 0; i < 5; i++) {
                const dist = Math.random() * beamLength;
                const bx = this.x + Math.cos(this.aimAngle) * dist + (Math.random() - 0.5) * beamWidth;
                const by = this.y + Math.sin(this.aimAngle) * dist + (Math.random() - 0.5) * beamWidth;
                particles.push(new Particle(bx, by, Math.cos(this.aimAngle) * 12, Math.sin(this.aimAngle) * 12, '#ccff90', Math.random() * 8 + 4, 12, 'circle'));
            }

            if (this.solarFireTimer <= 0) {
                this.state = 'idle';
            }
        }

        // --- 피카츄 Q스킬: 전광석화 (극강의 방향전환과 속도로 돌진, 맞으면 밀쳐짐) ---
        updateQuickAttack(opponent) {
            let targetSteerAngle = this.chargeAngle;
            if (!this.isAI) {
                targetSteerAngle = Math.atan2(mouse.y - this.y, mouse.x - this.x);
            } else {
                const focusTarget = (this.aiFocusTarget && this.aiFocusTarget.isAlive) ? this.aiFocusTarget : opponent;
                targetSteerAngle = Math.atan2(focusTarget.y - this.y, focusTarget.x - this.x);
            }

            let diff = targetSteerAngle - this.chargeAngle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            this.chargeAngle += diff * 0.18;

            this.vx = Math.cos(this.chargeAngle) * this.chargeSpeed;
            this.vy = Math.sin(this.chargeAngle) * this.chargeSpeed;
            this.chargeDistance += this.chargeSpeed;

            // 전광석화 번개 스피드라인 & 스파크 잔상
            for (let i = 0; i < 2; i++) {
                const off = (Math.random() - 0.5) * 16;
                particles.push(new Particle(
                    this.x - Math.cos(this.chargeAngle) * 22 + Math.sin(this.chargeAngle) * off,
                    this.y - Math.sin(this.chargeAngle) * 22 - Math.cos(this.chargeAngle) * off,
                    -this.vx * 0.25,
                    -this.vy * 0.25,
                    Math.random() < 0.6 ? '#fff59d' : '#00e5ff',
                    Math.random() * 8 + 4,
                    16,
                    'spark'
                ));
            }

            // 적 충돌 판정 (본체 및 분신)
            const quickTargets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
            let hitTarget = null;
            for (const tgt of quickTargets) {
                if (Math.hypot(tgt.x - this.x, tgt.y - this.y) <= this.radius + tgt.radius) {
                    hitTarget = tgt;
                    break;
                }
            }
            if (hitTarget) {
                const kbX = Math.cos(this.chargeAngle) * 28;
                const kbY = Math.sin(this.chargeAngle) * 28;
                hitTarget.takeDamage(125, this, true, kbX, kbY);

                addGroundDecal((this.x + hitTarget.x) / 2, (this.y + hitTarget.y) / 2, 40, 'crater');
                addGroundDecal((this.x + hitTarget.x) / 2, (this.y + hitTarget.y) / 2, 32, 'electric');
                triggerHitstop(9);
                triggerScreenShake(22);
                sfx.playHit();
                sfx.playQuickAttack();
                showAlert('⚡ QUICK ATTACK HIT! ⚡');

                this.vx = -Math.cos(this.chargeAngle) * 5;
                this.vy = -Math.sin(this.chargeAngle) * 5;
                this.state = 'idle';
                return;
            }

            if (this.chargeDistance >= this.maxChargeDistance) {
                this.state = 'braking';
                this.stateTimer = 18;
                addGroundDecal(this.x, this.y, 26, 'skid');
                sfx.playBrake();
                showAlert('SKID BRAKE!');
            }
        }

        // --- 피카츄 E스킬: 아이언테일 (휘두르기 딜레이) ---
        updateIronTail(opponent) {
            this.ironTailTimer--;
            this.vx *= 0.75;
            this.vy *= 0.75;

            if (this.ironTailTimer <= 0) {
                this.state = 'idle';
            }
        }

        // --- 스라크 Q스킬: 유턴 (순간이동급 빠른 돌진, 적 타격 시 원래 자리로 복귀, 안 맞으면 그 자리로 이동) ---
        updateUTurnDash(opponent) {
            this.uTurnTimer++;
            this.vx = 0;
            this.vy = 0;

            // 잔상 스피드라인 및 분신 잔상 파티클
            for (let i = 0; i < 2; i++) {
                particles.push(new Particle(
                    this.x + (Math.random() - 0.5) * 16,
                    this.y + (Math.random() - 0.5) * 16,
                    -Math.cos(this.uTurnAngle) * 2,
                    -Math.sin(this.uTurnAngle) * 2,
                    Math.random() < 0.6 ? '#76ff03' : '#b2ff59',
                    Math.random() * 8 + 4,
                    14,
                    'spark'
                ));
            }

            const prevX = this.x;
            const prevY = this.y;
            const remaining = this.uTurnTotalDist - this.uTurnTraveled;
            const step = Math.min(this.uTurnSpeed, Math.max(0, remaining));
            this.uTurnTraveled += step;

            const tRatio = (this.uTurnTotalDist > 0) ? Math.min(1, this.uTurnTraveled / this.uTurnTotalDist) : 1;
            this.x = this.uTurnStartX + (this.uTurnTargetX - this.uTurnStartX) * tRatio;
            this.y = this.uTurnStartY + (this.uTurnTargetY - this.uTurnStartY) * tRatio;

            // 선분과 점 사이의 거리 계산 (초고속 대시 관통 터널링 방지)
            const distToSegment = (px, py, x1, y1, x2, y2) => {
                const dx = x2 - x1;
                const dy = y2 - y1;
                const lenSq = dx * dx + dy * dy;
                if (lenSq === 0) return Math.hypot(px - x1, py - y1);
                let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
                t = Math.max(0, Math.min(1, t));
                return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
            };

            // 적 충돌 검사 (opponent 및 적 분신들 - 선분 연속 충돌 및 관통 방지)
            const potentialTargets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
            let hitTarget = null;
            let closestHitDist = Infinity;
            for (const tgt of potentialTargets) {
                if (!tgt || !tgt.isAlive) continue;
                const segDist = distToSegment(tgt.x, tgt.y, prevX, prevY, this.x, this.y);
                const currDist = Math.hypot(tgt.x - this.x, tgt.y - this.y);
                const hitThreshold = this.radius + tgt.radius + 32;
                if (segDist <= hitThreshold || currDist <= hitThreshold) {
                    if (segDist < closestHitDist) {
                        closestHitDist = segDist;
                        hitTarget = tgt;
                    }
                }
            }

            if (hitTarget) {
                // "적이 맞으면 원래 자리로 돌아옴"
                hitTarget.takeDamage(115, this, true, Math.cos(this.uTurnAngle) * 18, Math.sin(this.uTurnAngle) * 18);
                spawnXScissorFX(hitTarget.x, hitTarget.y, this.uTurnAngle, 55);
                sfx.playHit();
                sfx.playSlash();
                triggerHitstop(6);
                triggerScreenShake(14);
                addGroundDecal(hitTarget.x, hitTarget.y, 35, 'crater');

                // 출발지와 피격 지점 순간이동 텔레포트 잔상
                for (let i = 0; i < 12; i++) {
                    const spd = Math.random() * 6 + 2;
                    const a = Math.random() * Math.PI * 2;
                    particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd, '#76ff03', 7, 16, 'spark'));
                    particles.push(new Particle(this.uTurnStartX, this.uTurnStartY, Math.cos(a) * spd, Math.sin(a) * spd, '#00e676', 7, 16, 'spark'));
                }

                // 원래 자리로 즉각 복귀!
                this.x = this.uTurnStartX;
                this.y = this.uTurnStartY;
                this.vx = 0;
                this.vy = 0;
                this.state = 'idle';
                showAlert('↩️ U-TURN HIT & RETURN! (원래 자리 복귀!) ↩️');
                return;
            }

            // 목적지 도달 시 (적에게 안 맞았거나 적이 없을 때): "타겟한 위치에 적이 없거나 안맞으면 그자리로 이동"
            if (this.uTurnTraveled >= this.uTurnTotalDist || this.uTurnTimer >= this.uTurnMaxTicks) {
                for (const tgt of potentialTargets) {
                    if (!tgt || !tgt.isAlive) continue;
                    if (Math.hypot(tgt.x - this.uTurnTargetX, tgt.y - this.uTurnTargetY) <= this.radius + tgt.radius + 32) {
                        hitTarget = tgt;
                        break;
                    }
                }
                if (hitTarget) {
                    hitTarget.takeDamage(115, this, true, Math.cos(this.uTurnAngle) * 18, Math.sin(this.uTurnAngle) * 18);
                    spawnXScissorFX(hitTarget.x, hitTarget.y, this.uTurnAngle, 55);
                    sfx.playHit();
                    sfx.playSlash();
                    triggerHitstop(6);
                    triggerScreenShake(14);
                    this.x = this.uTurnStartX;
                    this.y = this.uTurnStartY;
                    this.vx = 0;
                    this.vy = 0;
                    this.state = 'idle';
                    showAlert('↩️ U-TURN HIT & RETURN! (원래 자리 복귀!) ↩️');
                    return;
                }

                this.x = this.uTurnTargetX;
                this.y = this.uTurnTargetY;
                this.vx = 0;
                this.vy = 0;
                this.state = 'idle';
                showAlert('↩️ U-TURN (타겟 위치 도달) ↩️');
            }
        }

        // --- 스라크 F스킬: 그림자 분신술 (상대에게 날아가지 않고, 스라크가 서 있는 "그 자리에서" 초고속 잔상을 펼친 후 분신 5기 소환) ---
        updateDoubleTeamMotion(opponent) {
            this.doubleTeamTimer--;

            // 상대에게 날아가지 않고 "그 자리에서" 초고속 좌우 지그재그 회피 잔상 스텝!
            const zig = Math.sin(this.doubleTeamTimer * 1.8) * 16;
            this.vx = Math.cos(this.aimAngle + Math.PI / 2) * zig;
            this.vy = Math.sin(this.aimAngle + Math.PI / 2) * zig;

            // 스라크 본체가 있는 "그 자리" 주변을 둘러싸는 6개의 초고속 녹색 분신 잔상 파티클
            for (let i = 0; i < 6; i++) {
                const a = (this.doubleTeamTimer * 0.3) + (i * Math.PI * 2 / 6);
                const r = 45 + Math.sin(this.doubleTeamTimer * 0.2 + i) * 15;
                particles.push(new Particle(
                    this.x + Math.cos(a) * r,
                    this.y + Math.sin(a) * r,
                    (Math.random() - 0.5) * 3,
                    (Math.random() - 0.5) * 3,
                    Math.random() < 0.6 ? '#69f0ae' : '#ffffff',
                    Math.random() * 8 + 4,
                    12,
                    'spark'
                ));
            }

            if (this.doubleTeamTimer <= 0) {
                this.vx = 0;
                this.vy = 0;
                this.state = 'idle';
                if (typeof sfx !== 'undefined' && sfx.playClone) sfx.playClone();
                triggerScreenShake(8);

                // 스라크가 있던 바로 "그 자리" 주변 반경 110px에 분신 5개 소환!
                const numClones = 5;
                for (let i = 0; i < numClones; i++) {
                    const spawnAngle = (i * Math.PI * 2) / numClones + Math.random() * 0.15;
                    const spawnDist = 110;
                    const cx = Math.max(FIELD_MIN_X + 25, Math.min(FIELD_MAX_X - 25, this.x + Math.cos(spawnAngle) * spawnDist));
                    const cy = Math.max(FIELD_MIN_Y + 25, Math.min(FIELD_MAX_Y - 25, this.y + Math.sin(spawnAngle) * spawnDist));

                    scytherClones.push(new ScytherClone({
                        owner: this,
                        x: cx,
                        y: cy,
                        index: i
                    }));

                    for (let p = 0; p < 12; p++) {
                        const spd = Math.random() * 6 + 2;
                        const a = Math.random() * Math.PI * 2;
                        particles.push(new Particle(cx, cy, Math.cos(a) * spd, Math.sin(a) * spd, '#b9f6ca', Math.random() * 7 + 4, 20, 'spark'));
                    }
                }
                showAlert('👥 그림자 분신술 (제자리 5기 소환 완료!) 👥');
            }
        }

        useSkill(slot) {
            if (this.cooldowns[slot] > 0) return;
            // 경직 중이거나 차징 중에는 스킬 사용 불가
            if (this.stunTimer > 0 || this.state === 'stun' ||
                this.state === 'charging' || this.state === 'quick_attack' || this.state === 'iron_tail' || 
                this.state === 'uturn_dash' || this.state === 'double_team_motion' ||
                this.state === 'whirlpool' || this.state === 'flamethrower' || 
                this.state === 'petal_blizzard' || this.state === 'solarbeam_charge' || this.state === 'solarbeam_fire' || 
                this.state === 'knockdown') return;

            this.attackMotionTimer = 12;
            const opponent = (this === p1) ? p2 : p1;

            if (this.species === 'charmander') {
                if (slot === 'attack') {
                    this.cooldowns.attack = this.maxCooldowns.attack;
                    const angle = this.aimAngle;
                    const spd = 26;
                    projectiles.push(new Projectile({
                        x: this.x + Math.cos(angle) * 32,
                        y: this.y + Math.sin(angle) * 32,
                        vx: Math.cos(angle) * spd,
                        vy: Math.sin(angle) * spd,
                        speed: spd,
                        radius: 15,
                        damage: 45,
                        owner: this,
                        type: 'ember',
                        life: 65,
                        range: 430,
                        piercing: false,
                        knockback: 6
                    }));
                    sfx.playFire();

                } else if (slot === 'q') {
                    this.cooldowns.q = this.maxCooldowns.q;
                    this.state = 'charging';
                    this.chargeDistance = 0;
                    this.chargeAngle = this.aimAngle;
                    sfx.playTackle();
                    showAlert('CHARMANDER TACKLE!');

                } else if (slot === 'e') {
                    this.cooldowns.e = this.maxCooldowns.e;
                    const aiTarget = (this.isAI && this.aiFocusTarget && this.aiFocusTarget.isAlive) ? this.aiFocusTarget : opponent;
                    const targetX = this.isAI ? aiTarget.x : mouse.x;
                    const targetY = this.isAI ? aiTarget.y : mouse.y;
                    groundEffects.push(new GroundFlameField(targetX, targetY, this, 140, 300, 16));
                    sfx.playFire();
                    showAlert('FIRE SPIN TRAP!');

                } else if (slot === 'r') {
                    this.cooldowns.r = this.maxCooldowns.r;
                    const angle = this.aimAngle;
