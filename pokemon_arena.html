<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포켓몬 아레나 2D (Pokémon Arena 2D) - 피카츄 참전 & 대형 스타디움</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Press+Start+2P&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030508;
            font-family: 'Press Start 2P', 'Noto Sans KR', sans-serif;
            color: #fff;
        }

        #game-viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0c1420 0%, #020305 100%);
        }

        /* 1280 x 720 게임 뷰포트 (대형 3000 x 1900 맵의 카메라 화면) */
        #arena-container {
            position: relative;
            width: 1280px;
            height: 720px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95), 0 0 0 4px #1c2638;
            border: 4px solid #000;
            overflow: hidden;
            background: #080d15;
            image-rendering: pixelated;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* 오버레이 HUD 레이어 */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 18px;
            z-index: 10;
        }

        /* 상단 플레이어 & 상대 상태바 (레트로 포켓몬 도트 UI) */
        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            gap: 16px;
        }

        .poke-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0f1523;
            padding: 8px 14px;
            border: 3px solid #334460;
            box-shadow: 
                0 0 0 2px #0a0e17,
                0 6px 0 0 rgba(0, 0, 0, 0.8),
                inset 0 0 0 2px #1e293b;
            min-width: 380px;
            image-rendering: pixelated;
        }

        .poke-card.right {
            flex-direction: row-reverse;
            text-align: right;
        }

        .card-avatar {
            width: 58px;
            height: 58px;
            background: #141c2c;
            border: 3px solid #4a5d80;
            box-shadow: inset 0 0 0 2px #0c121d, 2px 2px 0 #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .card-avatar img {
            width: 52px;
            height: 52px;
            image-rendering: pixelated;
        }

        .card-info {
            flex-grow: 1;
        }

        .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .card-name {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            letter-spacing: 0px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 1px 1px 0 #000;
        }

        .level-badge {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #ffd700;
            background: #000;
            padding: 2px 5px;
            border: 2px solid #555;
            box-shadow: 1px 1px 0 #000;
        }

        .gender-male {
            color: #00e5ff;
            font-size: 11px;
        }

        .hp-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            letter-spacing: -0.5px;
        }

        /* 도트 스타일 HP 바 래퍼 */
        .hp-row-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .hp-label-badge {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            font-weight: 900;
            background: #e65100;
            color: #fff;
            padding: 2px 5px;
            border: 2px solid #000;
            box-shadow: 1px 1px 0 #000;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            text-shadow: 1px 1px 0 #000;
        }

        .hp-outer {
            flex-grow: 1;
            height: 16px;
            background: #000;
            border: 2px solid #334460;
            box-shadow: inset 0 0 0 1px #111;
            position: relative;
            overflow: hidden;
            padding: 1px;
        }

        .hp-inner {
            height: 100%;
            width: 100%;
            background-color: #00e676;
            background-image: repeating-linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.3) 0px,
                rgba(255, 255, 255, 0.3) 3px,
                transparent 3px,
                transparent 6px
            );
            border-right: 2px solid #000;
            transition: width 0.15s steps(20, end);
        }

        .hp-inner.yellow {
            background-color: #ffb300;
        }

        .hp-inner.red {
            background-color: #ff1744;
        }

        /* 도트 스태미나 바 */
        .stamina-outer {
            width: 100%;
            height: 7px;
            background: #000;
            border: 2px solid #222d3d;
            overflow: hidden;
            margin-top: 4px;
            padding: 1px;
        }

        .stamina-inner {
            height: 100%;
            width: 100%;
            background-color: #00e5ff;
            background-image: repeating-linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.35) 0px,
                rgba(255, 255, 255, 0.35) 2px,
                transparent 2px,
                transparent 4px
            );
            border-right: 2px solid #000;
            transition: width 0.05s steps(15, end);
        }

        /* 하단 HUD: 스킬은 왼쪽 밑, 컨트롤은 오른쪽 밑 */
        .bottom-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            pointer-events: none;
        }

        /* 왼쪽 밑 스킬 바 컨테이너 (도트 레트로 스타일) */
        .bottom-left-hud {
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: auto;
        }

        .skill-bar-header {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #ffd700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 2px 2px 0 #000;
            padding-left: 2px;
        }

        .skill-bar-corner {
            display: flex;
            gap: 6px;
            background: #0b1019;
            padding: 6px 10px;
            border: 3px solid #455a7e;
            box-shadow: 
                0 0 0 2px #000,
                0 6px 0 0 rgba(0,0,0,0.8),
                inset 0 0 0 2px #182335;
        }

        .skill-slot {
            width: 58px;
            height: 58px;
            background: #111724;
            border: 2px solid #2b3952;
            box-shadow: 2px 2px 0 #000;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.1s;
        }

        .skill-slot:hover {
            border-color: #ffd700;
            transform: translateY(-2px);
        }

        .skill-icon {
            font-size: 19px;
            margin-bottom: 2px;
            filter: drop-shadow(0 2px 0 #000);
        }

        .skill-name {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 9.5px;
            font-weight: 900;
            color: #ddd;
            text-align: center;
            line-height: 1.1;
        }

        .skill-key {
            position: absolute;
            top: 2px;
            left: 2px;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: #ffd700;
            background: #000;
            padding: 1px 3px;
            border: 1px solid #444;
        }

        .cooldown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.82);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: #ffeb3b;
            opacity: 0;
            pointer-events: none;
            text-shadow: 1px 1px 0 #000;
        }

        .cooldown-overlay.on-cd {
            opacity: 1;
        }

        /* 오른쪽 밑 조작 툴바 및 버튼 */
        .bottom-right-hud {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: auto;
        }

        .controls-info-box {
            display: flex;
            gap: 10px;
            background: #0b1019;
            padding: 6px 14px;
            border: 2px solid #2b3952;
            box-shadow: 2px 2px 0 #000;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #8899aa;
            align-items: center;
        }

        .controls-info-box span b {
            color: #00e5ff;
            background: #141c2c;
            padding: 2px 4px;
            border: 1px solid #334460;
        }

        .buttons-row {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background: #151e2e;
            color: #fff;
            border: 2px solid #3d4f6d;
            box-shadow: 2px 2px 0 #000;
            padding: 6px 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 8.5px;
            cursor: pointer;
            transition: 0.1s;
        }
        .btn-action:hover {
            background: #233149;
            border-color: #ffd700;
            transform: translateY(-2px);
            box-shadow: 2px 4px 0 #000;
        }

        .btn-restart-accent {
            background: #d84315 !important;
            color: #fff !important;
            border: 2px solid #ffab00 !important;
            box-shadow: 2px 2px 0 #000, 0 0 10px rgba(255, 111, 0, 0.4);
        }
        .btn-restart-accent:hover {
            background: #f4511e !important;
            box-shadow: 2px 4px 0 #000, 0 0 16px rgba(255, 171, 0, 0.8);
        }

        .btn-enemy-accent {
            background: #006064 !important;
            border-color: #00e5ff !important;
        }
        .btn-enemy-accent:hover {
            background: #00838f !important;
            border-color: #80d8ff !important;
        }

        .btn-train-accent {
            background: #4a148c !important;
            border-color: #b388ff !important;
            box-shadow: 2px 2px 0 #000, 0 0 10px rgba(179, 136, 255, 0.35);
        }
        .btn-train-accent:hover {
            background: #6a1b9a !important;
            border-color: #ea80fc !important;
            box-shadow: 2px 4px 0 #000, 0 0 16px rgba(234, 128, 252, 0.7);
        }

        /* 난이도 선택 툴바 */
        .difficulty-row {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 5px;
            background: rgba(10, 15, 25, 0.88);
            padding: 5px 8px;
            border: 2px solid #233148;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8), inset 0 0 0 1px #111a28;
        }
        .difficulty-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: #ffd700;
            margin-right: 2px;
            text-shadow: 1px 1px 0 #000;
        }
        .btn-diff {
            background: #111827;
            color: #94a3b8;
            border: 2px solid #283548;
            font-family: 'Press Start 2P', 'Noto Sans KR', sans-serif;
            font-size: 8px;
            font-weight: 700;
            padding: 5px 9px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 1px 2px 0 #000;
            outline: none;
        }
        .btn-diff:hover {
            background: #1e293b;
            color: #f8fafc;
            border-color: #475569;
            transform: translateY(-1px);
        }
        .btn-diff.active {
            color: #000;
            font-weight: 900;
            border-color: #fff;
            transform: translateY(-1px);
        }
        .btn-diff[data-diff="sandbag"].active {
            background: #9e9e9e;
            box-shadow: 0 0 10px rgba(158, 158, 158, 0.8);
        }
        .btn-diff[data-diff="easy"].active {
            background: #00e676;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.8);
        }
        .btn-diff[data-diff="normal"].active {
            background: #29b6f6;
            box-shadow: 0 0 10px rgba(41, 182, 246, 0.8);
        }
        .btn-diff[data-diff="hard"].active {
            background: #ffa726;
            box-shadow: 0 0 10px rgba(255, 167, 38, 0.8);
        }
        .btn-diff[data-diff="hell"].active {
            background: #ff1744;
            color: #fff;
            border-color: #ff8a80;
            box-shadow: 0 0 14px rgba(255, 23, 68, 0.9), 0 0 24px rgba(255, 82, 82, 0.6);
            animation: hellGlow 1.2s infinite alternate;
        }
        @keyframes hellGlow {
            from { box-shadow: 0 0 10px rgba(255, 23, 68, 0.7); }
            to { box-shadow: 0 0 20px rgba(255, 23, 68, 1), 0 0 32px rgba(255, 82, 82, 0.8); }
        }

        /* AI 강화 훈련소 모달 */
        #ai-training-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 900px;
            max-width: 94vw;
            max-height: 90vh;
            background: #080d17;
            border: 4px solid #7c4dff;
            box-shadow: 0 0 40px rgba(124, 77, 255, 0.45), 8px 8px 0 #000;
            padding: 22px 26px;
            z-index: 250;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            overflow-y: auto;
        }
        #ai-training-modal.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        .train-modal-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            border-bottom: 2px solid #233149;
            padding-bottom: 12px;
            position: relative;
        }
        .train-modal-icon {
            font-size: 32px;
            background: #141c2c;
            border: 2px solid #7c4dff;
            padding: 6px 10px;
        }
        .train-modal-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: #b388ff;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .train-modal-desc {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 12px;
            color: #90a4ae;
            line-height: 1.4;
        }
        .train-modal-desc b {
            color: #ffd700;
        }
        .btn-modal-close {
            position: absolute;
            top: 0;
            right: 0;
            background: #151e2e;
            border: 2px solid #555;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            padding: 6px 10px;
            cursor: pointer;
        }
        .btn-modal-close:hover {
            background: #ff1744;
            border-color: #ff5252;
        }
        .train-progress-section {
            background: #0f1724;
            border: 2px solid #28374d;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        .train-progress-header {
            display: flex;
            justify-content: space-between;
            font-family: 'Press Start 2P', monospace;
            font-size: 8.5px;
            color: #ffd700;
            margin-bottom: 8px;
        }
        .train-progress-outer {
            width: 100%;
            height: 16px;
            background: #000;
            border: 2px solid #334460;
            padding: 2px;
            overflow: hidden;
        }
        .train-progress-inner {
            height: 100%;
            background: linear-gradient(90deg, #7c4dff, #00e5ff, #00e676);
            transition: width 0.08s ease;
        }
        .train-metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .metric-card {
            background: #0f1624;
            border: 2px solid #233149;
            padding: 10px 8px;
            text-align: center;
        }
        .metric-card.highlight {
            border-color: #ffd700;
            background: #151f33;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
        }
        .metric-title {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #90a4ae;
            margin-bottom: 5px;
        }
        .metric-val {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: #fff;
            margin-bottom: 4px;
        }
        .metric-val.green {
            color: #00e676;
        }
        .metric-sub {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 10px;
            color: #78909c;
        }
        .train-table-box {
            background: #0f1724;
            border: 2px solid #233149;
            padding: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
        }
        .train-stats-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 11px;
            text-align: center;
        }
        .train-stats-table th {
            background: #141f30;
            color: #b0bec5;
            padding: 7px 6px;
            border: 1px solid #223046;
            font-size: 11px;
        }
        .train-stats-table td {
            padding: 6px 6px;
            border: 1px solid #1c2738;
            color: #e2e8f0;
        }
        .train-actions-row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            align-items: center;
        }
        .btn-train-run {
            background: #6200ea;
            color: #fff;
            border: 3px solid #b388ff;
            box-shadow: 3px 3px 0 #000;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            padding: 9px 16px;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-train-run:hover {
            background: #7c4dff;
            transform: scale(1.03);
            box-shadow: 0 0 16px rgba(179, 136, 255, 0.6);
        }
        .btn-train-toggle {
            background: #151e2e;
            color: #90a4ae;
            border: 2px solid #334460;
            font-family: 'Press Start 2P', monospace;
            font-size: 8.5px;
            padding: 8px 12px;
            cursor: pointer;
        }
        .btn-train-toggle.active {
            background: #004d40;
            color: #00e676;
            border-color: #00e676;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
        }
        .btn-train-close {
            background: #263238;
            color: #fff;
            border: 2px solid #455a64;
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 700;
            font-size: 12px;
            padding: 8px 14px;
            cursor: pointer;
        }
        .btn-train-close:hover {
            background: #37474f;
            border-color: #78909c;
        }

        #alert-box {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', monospace;
            font-size: 20px;
            color: #ffd700;
            text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s steps(4), transform 0.25s ease;
            z-index: 100;
            text-align: center;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 18px;
            border: 3px solid #ffd700;
            box-shadow: 4px 4px 0 #000;
        }

        /* 게임 오버 모달 (도트 스타일) */
        #game-over-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: #0b1019;
            border: 4px solid #ffd700;
            box-shadow: 8px 8px 0 #000, inset 0 0 0 3px #233149;
            padding: 30px 45px;
            text-align: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s steps(6);
        }

        #game-over-modal.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        #modal-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 22px;
            margin-bottom: 12px;
            text-shadow: 3px 3px 0 #000;
        }

        #modal-subtitle {
            font-family: 'Noto Sans KR', 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: #ccc;
            margin-bottom: 22px;
        }

        .btn-modal-restart {
            background: #e65100;
            color: #fff;
            border: 3px solid #ffeb3b;
            box-shadow: 4px 4px 0 #000;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            padding: 12px 28px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn-modal-restart:hover {
            transform: scale(1.05);
            background: #f4511e;
        }
    </style>
</head>
<body>
    <div id="game-viewport">
        <div id="arena-container">
            <canvas id="gameCanvas"></canvas>

            <div id="hud">
                <!-- 상단 도트 HP 바 -->
                <div class="top-hud">
                    <div class="poke-card" id="p1-card">

            gain.gain.setValueAtTime(0.45, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.38);

    const particles = [];

    class Particle {
        constructor(x, y, vx, vy, color, size, life, shape = 'circle') {
            this.x = x; this.y = y; this.vx = vx; this.vy = vy;
            this.color = color; this.size = size; this.initialSize = size;
            this.life = life; this.maxLife = life; this.shape = shape;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.2;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            this.rotation += this.rotSpeed;
            this.life--;
            this.size = this.initialSize * (this.life / this.maxLife);
        }
        draw(ctx) {
            const alpha = Math.max(0, this.life / this.maxLife);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = this.color;
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            if (this.shape === 'circle') {
                ctx.beginPath();
                ctx.arc(0, 0, Math.max(1, this.size), 0, Math.PI * 2);
                ctx.fill();
            } else if (this.shape === 'flame') {
                ctx.beginPath();
                ctx.moveTo(0, -this.size * 1.4);
                ctx.quadraticCurveTo(this.size, 0, 0, this.size);
                ctx.quadraticCurveTo(-this.size, 0, 0, -this.size * 1.4);
                ctx.fill();
            } else if (this.shape === 'star') {
                ctx.fillRect(-this.size, -this.size * 0.25, this.size * 2, this.size * 0.5);
                ctx.fillRect(-this.size * 0.25, -this.size, this.size * 0.5, this.size * 2);
            } else if (this.shape === 'petal') {
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 1.5, this.size * 0.7, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (this.shape === 'spark') {
                // 날카로운 다이아몬드/십자형 전기 스파크 파티클
                ctx.beginPath();
                ctx.moveTo(0, -this.size * 1.5);
                ctx.lineTo(this.size * 0.45, 0);
                ctx.lineTo(0, this.size * 1.5);
                ctx.lineTo(-this.size * 0.45, 0);
                ctx.closePath();
                ctx.fill();
            }
            ctx.restore();
        }
    }

    class DamageText {
        constructor(x, y, text, color = '#ffeb3b', isCrit = false) {
            this.x = x + (Math.random() - 0.5) * 20;

        draw(ctx) {
            const alpha = Math.max(0, this.life / this.maxLife);
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.font = `900 ${this.isCrit ? 18 : 13}px 'Press Start 2P', monospace`;
            ctx.fillStyle = this.color;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.textAlign = 'center';
            ctx.strokeText(this.text, this.x, this.y);
            ctx.fillText(this.text, this.x, this.y);
            ctx.restore();
        }
    }

    // --- 장판 효과 1: 불꽃회오리 (Fire Spin - 회전하는 3갈래 화염 소용돌이 기둥) ---
    class GroundFlameField {
        constructor(x, y, owner, radius = 150, duration = 320, damagePerTick = 18) {
            this.x = x; this.y = y; this.owner = owner;
            this.radius = radius; this.duration = duration;
            this.damagePerTick = damagePerTick;
            this.tickTimer = 0;
            this.spinAngle = 0;
            this.pulse = 0;
        }
        update(targets) {
            this.duration--;
            this.tickTimer++;
            this.spinAngle += 0.16; // 맹렬한 소용돌이 회전
            this.pulse += 0.1;

            // 나선형으로 회전하며 치솟는 화염 파티클
            for (let i = 0; i < 3; i++) {
                const a = this.spinAngle + (i * Math.PI * 2 / 3);
                const r = (Math.sin(this.tickTimer * 0.15 + i) * 0.4 + 0.6) * this.radius;
                const px = this.x + Math.cos(a) * r;
                const py = this.y + Math.sin(a) * r;
                particles.push(new Particle(
                    px, py,
                    -Math.sin(a) * 5.5,
                    Math.cos(a) * 5.5 - Math.random() * 4 - 2,
                    Math.random() < 0.6 ? '#ff3d00' : (Math.random() < 0.5 ? '#ffea00' : '#ffffff'),
                    Math.random() * 9 + 5,
                    22,
                    'flame'
                ));
            }

            // 소용돌이 중심 쪽으로 적 흡인 & 지속 DoT 피해
            for (const target of targets) {
                if (target !== this.owner && target.isAlive) {
                    const dist = Math.hypot(target.x - this.x, target.y - this.y);
                    if (dist <= this.radius + target.radius) {
                        // 회오리 중심 쪽으로 서서히 빨아들임
                        const pullAngle = Math.atan2(this.y - target.y, this.x - target.x);
                        target.x += Math.cos(pullAngle) * 1.2;
                        target.y += Math.sin(pullAngle) * 1.2;

                        if (this.tickTimer % 12 === 0) {
                            target.takeDamage(this.damagePerTick, this.owner, false, 0, 0, true);
                            triggerScreenShake(2.5);
                        }
                    }
                }
            }

            // 종료 시 대형 화염 소용돌이 폭발
            if (this.duration <= 0) {
                if (typeof sfx !== 'undefined' && sfx.playExplosion) sfx.playExplosion();
                triggerScreenShake(8);
                addGroundDecal(this.x, this.y, 50, 'scorch');
                for (let i = 0; i < 22; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const spd = Math.random() * 8 + 3;
                    particles.push(new Particle(this.x, this.y, Math.cos(a) * spd, Math.sin(a) * spd - 3, '#ff3d00', 8, 25, 'flame'));
                }
            }
        }
        draw(ctx) {
            const alpha = Math.min(1, this.duration / 35);
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = alpha * 0.9;

            // 1. 바닥 타오르는 마그마 코어
            const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, this.radius);
            grad.addColorStop(0, 'rgba(255, 255, 200, 0.95)');
            grad.addColorStop(0.3, 'rgba(255, 140, 0, 0.7)');
            grad.addColorStop(0.7, 'rgba(255, 20, 0, 0.4)');
            grad.addColorStop(1, 'rgba(180, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius * (0.95 + Math.sin(this.pulse) * 0.06), 0, Math.PI * 2);
            ctx.fill();

            // 2. 맹렬하게 회전하는 3갈래 화염 소용돌이 팔 (Fire Spin Spiral Arms)
            ctx.rotate(this.spinAngle);
            ctx.lineWidth = 9;
            ctx.lineCap = 'round';
            for (let i = 0; i < 3; i++) {
                const baseA = (i * Math.PI * 2) / 3;
                ctx.strokeStyle = (i % 2 === 0) ? 'rgba(255, 61, 0, 0.85)' : 'rgba(255, 234, 0, 0.9)';
                ctx.beginPath();
                for (let r = 8; r <= this.radius; r += 12) {
                    const curA = baseA + (r / this.radius) * 1.8;
                    const px = Math.cos(curA) * r;
                    const py = Math.sin(curA) * r;
                    if (r === 8) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }

            // 3. 중심부 불기둥 코어
            ctx.fillStyle = '#fff9c4';
            ctx.beginPath();
            ctx.arc(0, 0, 16 + Math.sin(this.pulse * 1.5) * 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }
    }

    // --- 장판 효과 2: 씨뿌리기 트랩 (이상해씨 Q스킬 - 적 피해 & 시전자 체력 흡수 힐링) ---
    class LeechSeedTrap {
        constructor(x, y, owner, radius = 135, duration = 360, damagePerTick = 20) {
            this.x = x; this.y = y; this.owner = owner;
            this.radius = radius; this.duration = duration;
            this.damagePerTick = damagePerTick;
            this.tickTimer = 0;
            this.pulse = 0;
        }
        update(targets) {
            this.duration--;
            this.tickTimer++;
            this.pulse += 0.08;

            if (Math.random() < 0.6) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * this.radius;
                particles.push(new Particle(this.x + Math.cos(angle) * dist, this.y + Math.sin(angle) * dist, 0, -Math.random() * 2 - 0.5, '#76ff03', Math.random() * 6 + 3, 24, 'circle'));
            }

            // 매 18프레임마다 흡수 데미지 및 체력 회복
            if (this.tickTimer % 18 === 0) {
                for (const target of targets) {
                    if (target !== this.owner && target.isAlive) {
                        const dist = Math.hypot(target.x - this.x, target.y - this.y);
                        if (dist <= this.radius + target.radius) {
                            target.takeDamage(this.damagePerTick, this.owner, false, 0, 0, true);
                            
                            // 입힌 피해의 25%만큼 시전자 체력 회복! (25%로 추가 너프)
                            if (this.owner.isAlive) {
                                const healAmount = this.damagePerTick * 0.25; // 25% 흡수로 너프
                                const prevHp = this.owner.hp;
                                this.owner.hp = Math.min(this.owner.maxHp, this.owner.hp + healAmount);
                                const healed = Math.round(this.owner.hp - prevHp);
                                if (healed > 0) {
                                    damageTexts.push(new DamageText(this.owner.x, this.owner.y - 20, `+${healed}`, '#00e676', false));
                                }

                                // 적에서 시전자로 날아가는 생명력 흡수 파티클
                                for (let p = 0; p < 4; p++) {
                                    const sx = target.x + (Math.random() - 0.5) * 20;
                                    const sy = target.y + (Math.random() - 0.5) * 20;
                                    const angleToOwner = Math.atan2(this.owner.y - sy, this.owner.x - sx);
                                    const spd = Math.random() * 4 + 7;
                                    particles.push(new Particle(sx, sy, Math.cos(angleToOwner) * spd, Math.sin(angleToOwner) * spd, '#69f0ae', 7, 26, 'circle'));
                                }
                            }
                            sfx.playLeechSeed();
                            triggerScreenShake(2);
                        }
                    }
                }
            }
        }
        draw(ctx) {
            const alpha = Math.min(1, this.duration / 40);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = alpha * 0.85;

            // 바닥 녹색 흡수 오라 링
            const grad = ctx.createRadialGradient(this.x, this.y, 10, this.x, this.y, this.radius);
            grad.addColorStop(0, 'rgba(118, 255, 3, 0.7)');
            grad.addColorStop(0.5, 'rgba(0, 230, 118, 0.35)');
            grad.addColorStop(1, 'rgba(0, 200, 83, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + Math.sin(this.pulse) * 5, 0, Math.PI * 2);
            ctx.fill();

            // 외곽 테두리 덩굴 링
            ctx.strokeStyle = '#76ff03';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // 중앙 거대 씨앗
            ctx.fillStyle = '#64dd17';
            ctx.beginPath();
            ctx.ellipse(this.x, this.y, 14, 22, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1b5e20';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.restore();
        }
    }

    // --- 장판 효과 3: 독 장판 (이상해씨 R스킬 - 오물폭탄 폭발 후 지속 피해 & 슬로우) ---
    class PoisonField {
        constructor(x, y, owner, radius = 145, duration = 360, damagePerTick = 18) {
            this.x = x; this.y = y; this.owner = owner;
            this.radius = radius; this.duration = duration;
            this.damagePerTick = damagePerTick;
            this.tickTimer = 0;
            this.pulse = 0;
        }
        update(targets) {
            this.duration--;
            this.tickTimer++;
            this.pulse += 0.08;

            if (Math.random() < 0.6) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * this.radius;
                particles.push(new Particle(this.x + Math.cos(angle) * dist, this.y + Math.sin(angle) * dist, (Math.random() - 0.5) * 1.5, -Math.random() * 2 - 1, Math.random() < 0.5 ? '#e040fb' : '#7c4dff', Math.random() * 8 + 3, 26, 'circle'));
            }

            for (const target of targets) {
                if (target !== this.owner && target.isAlive) {
                    const dist = Math.hypot(target.x - this.x, target.y - this.y);
                    if (dist <= this.radius + target.radius) {
                        // 독 장판 내부 적에게 슬로우 대폭 버프! (기존 12% -> 45% 강력 슬로우로 맹독 웅덩이 효과 강화)
                        target.applySlow(0.45, 25);

                        // 매 15프레임마다 독 피해
                        if (this.tickTimer % 15 === 0) {
                            target.takeDamage(this.damagePerTick, this.owner, false, 0, 0, true);
                            triggerScreenShake(1.5);
                        }
                    }
                }
            }
        }
        draw(ctx) {
            const alpha = Math.min(1, this.duration / 40);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = alpha * 0.85;

            // 독극물 보라색 늪
            const grad = ctx.createRadialGradient(this.x, this.y, 10, this.x, this.y, this.radius);
            grad.addColorStop(0, 'rgba(224, 64, 251, 0.75)');
            grad.addColorStop(0.55, 'rgba(124, 77, 255, 0.45)');
            grad.addColorStop(1, 'rgba(74, 20, 140, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius + Math.sin(this.pulse) * 6, 0, Math.PI * 2);
            ctx.fill();

            // 부글거리는 외곽 링
            ctx.strokeStyle = '#e040fb';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }
    }

    // --- 장판 효과 4: 번개 자기장 구슬 및 영역 (피카츄 F스킬 '번개' 리메이크) ---
    class ThunderDomeField {
        constructor(x, y, owner, radius = 240, duration = 450, damagePerTick = 55) {
            this.x = x; this.y = y; this.owner = owner;
            this.radius = radius; this.duration = duration;
            this.damagePerTick = damagePerTick; // 35프레임당 55 데미지 (초당 94.3 DPS 완벽 유지)
            this.tickTimer = 0;
            this.pulse = 0;
            this.bolts = []; // 중앙 구슬로부터 적에게 꽂히는 벼락들
        }
        update(targets) {
            this.duration--;
            this.tickTimer++;
            this.pulse += 0.12;

            // 구슬 주변 및 영역 내 파란 전기 스파크 파티클
            if (Math.random() < 0.8) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (this.radius * 0.95);
                const col = Math.random() < 0.4 ? '#ffffff' : (Math.random() < 0.7 ? '#00e5ff' : '#2979ff');
                particles.push(new Particle(
                    this.x + Math.cos(angle) * dist,
                    this.y + Math.sin(angle) * dist,
                    (Math.random() - 0.5) * 3,
                    (Math.random() - 0.5) * 3,
                    col,
                    Math.random() * 8 + 3,
                    22,
                    'spark'
                ));
            }

            // 번개 볼트 수명 갱신
            for (let i = this.bolts.length - 1; i >= 0; i--) {
                this.bolts[i].life--;
                if (this.bolts[i].life <= 0) this.bolts.splice(i, 1);
            }

            // 범위 내 적 타격: 딜을 올리고 타격 간격을 35프레임으로 늘려 DPS 완벽 유지!
            for (const target of targets) {
                if (target !== this.owner && target.isAlive) {
                    const dist = Math.hypot(target.x - this.x, target.y - this.y);
                    if (dist <= this.radius + target.radius) {
                        target.applySlow(0.50, 25);

                        // 매 35프레임마다 중앙 구슬로부터 번개가 떨어짐!
                        if (this.tickTimer % 35 === 0) {
                            const segments = [];
                            const boltSteps = 8;
                            for (let s = 0; s <= boltSteps; s++) {
                                const prog = s / boltSteps;
                                const bx = this.x + (target.x - this.x) * prog + (s > 0 && s < boltSteps ? (Math.random() - 0.5) * 36 : 0);
                                const by = this.y + (target.y - this.y) * prog + (s > 0 && s < boltSteps ? (Math.random() - 0.5) * 36 : 0);
                                segments.push({ x: bx, y: by });
                            }

                            this.bolts.push({
                                segments,
                                strikeX: target.x,
                                strikeY: target.y,
                                life: 12,
                                maxLife: 12,
                                width: 5.5
                            });

                            target.takeDamage(this.damagePerTick, this.owner, false, 0, 0, true);
                            sfx.playThunderbolt();
                            triggerScreenShake(6);
                            addGroundDecal(target.x, target.y, 35, 'electric');

                            for (let i = 0; i < 8; i++) {
                                const spd = Math.random() * 6 + 2;
                                const a = Math.random() * Math.PI * 2;
                                particles.push(new Particle(target.x, target.y, Math.cos(a) * spd, Math.sin(a) * spd, Math.random() < 0.5 ? '#ffffff' : '#00e5ff', 6, 16, 'spark'));
                            }
                        }
                    }
                }
            }
        }
        draw(ctx) {
            const alpha = Math.min(1, this.duration / 40);
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = alpha * 0.9;

            // 1. 내부 은은한 반투명 전기장 아우라
            const grad = ctx.createRadialGradient(this.x, this.y, 20, this.x, this.y, this.radius);
            grad.addColorStop(0, 'rgba(0, 229, 255, 0.22)');
            grad.addColorStop(0.5, 'rgba(41, 121, 255, 0.10)');
            grad.addColorStop(0.85, 'rgba(0, 180, 255, 0.04)');
            grad.addColorStop(1, 'rgba(0, 145, 234, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();

            // 2. 파란 곡선 범위 외곽선 (청백색 네온 파동 곡선)
            const steps = 72;

            // 제1 파란 곡선 (메인 네온 사이언 파동 곡선)
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 3.6;
            ctx.beginPath();
            for (let i = 0; i <= steps; i++) {
                const a = (i * Math.PI * 2) / steps;
                const wave = Math.sin(a * 9 + this.pulse * 3) * 8 + Math.cos(a * 5 - this.pulse * 2) * 5;
                const r = this.radius + wave;
                const px = this.x + Math.cos(a) * r;
                const py = this.y + Math.sin(a) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();

            // 제2 파란 곡선 (딥 일렉트릭 블루 파동 곡선)
            ctx.strokeStyle = '#2979ff';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            for (let i = 0; i <= steps; i++) {
                const a = (i * Math.PI * 2) / steps;
                const wave = Math.cos(a * 11 - this.pulse * 3.5) * 6;
                const r = (this.radius - 8) + wave;
                const px = this.x + Math.cos(a) * r;
                const py = this.y + Math.sin(a) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();

            // 제3 파란 점선 하이라이트 링
            ctx.strokeStyle = 'rgba(128, 216, 255, 0.85)';
            ctx.lineWidth = 1.6;
            ctx.setLineDash([14, 16]);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // 3. 구슬로부터 적에게 내리꽂히는 번개 렌더링
            for (const bolt of this.bolts) {
                const bAlpha = bolt.life / bolt.maxLife;
                ctx.save();
                ctx.globalAlpha = bAlpha;

                // 외곽 사이언 글로우
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = bolt.width + 6;
                ctx.beginPath();
                for (let j = 0; j < bolt.segments.length; j++) {
                    const pt = bolt.segments[j];
                    if (j === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                }
                ctx.stroke();

                // 중심 순백색 벼락 본체
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = bolt.width;
                ctx.beginPath();
                for (let j = 0; j < bolt.segments.length; j++) {
                    const pt = bolt.segments[j];
                    if (j === 0) ctx.moveTo(pt.x, pt.y);
                    else ctx.lineTo(pt.x, pt.y);
                }
                ctx.stroke();

                // 피격점 전격 폭발 링
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(bolt.strikeX, bolt.strikeY, 14 * bAlpha, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.restore();
            }

            // 4. 스킬 중간의 전기 구슬 (중앙 발광체 코어)
            const orbPulse = Math.sin(this.pulse * 3) * 3;
            const orbGrad = ctx.createRadialGradient(this.x, this.y, 4, this.x, this.y, 38 + orbPulse);
            orbGrad.addColorStop(0, '#ffffff');
            orbGrad.addColorStop(0.35, '#80d8ff');
            orbGrad.addColorStop(0.7, '#00b0ff');
            orbGrad.addColorStop(1, 'rgba(0, 176, 255, 0)');
            ctx.fillStyle = orbGrad;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 40 + orbPulse, 0, Math.PI * 2);
            ctx.fill();

            // 중심 순백 플라즈마 구체
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 18, 0, Math.PI * 2);
            ctx.fill();

            // 구슬 주위 회전 전기 아크 링
            ctx.strokeStyle = '#00e5ff';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(this.x, this.y, 26 + Math.sin(this.pulse * 4) * 3, 0, Math.PI * 2);
            ctx.stroke();

            // 구슬 표면 미니 번개 아크 4개
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.2;
            for (let i = 0; i < 4; i++) {
                const arcAngle = (i * Math.PI / 2) + this.pulse * 3;
                const r1 = 14;
                const r2 = 30 + Math.sin(this.pulse * 5 + i) * 6;
                ctx.beginPath();
                ctx.moveTo(this.x + Math.cos(arcAngle) * r1, this.y + Math.sin(arcAngle) * r1);
                ctx.lineTo(this.x + Math.cos(arcAngle + 0.5) * r2, this.y + Math.sin(arcAngle + 0.5) * r2);
                ctx.stroke();
            }

            ctx.restore();
        }
    }

    // --- 지형 파괴 및 스킬 흔적 데칼 시스템 ---
    const groundDecals = [];

    // 지면 갈라짐(Ground Fissure) 균열 생성 헬퍼
    function addGroundFissure(x, y, maxRadius = 320, branches = 6) {
        if (!window.groundFissures) window.groundFissures = [];
        const lines = [];
        for (let b = 0; b < branches; b++) {
            const baseAng = (b / branches) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
            const branchLen = maxRadius * (0.65 + Math.random() * 0.35);
            const pts = [{ x: 0, y: 0 }];
            let curD = 0;
            let curA = baseAng;
            while (curD < branchLen) {
                curD += Math.random() * 32 + 20;
                curA += (Math.random() - 0.5) * 0.6;
                pts.push({
                    x: Math.cos(curA) * curD,
                    y: Math.sin(curA) * curD
                });
            }
            lines.push(pts);
        }
        window.groundFissures.push({
            x, y, lines,
            life: 450, maxLife: 450,
            radius: maxRadius
        });
        if (window.groundFissures.length > 15) window.groundFissures.shift();
    }

    function addGroundDecal(x, y, radius, type) {
        if (groundDecals.length > 40) groundDecals.shift();
        groundDecals.push({
            x, y, radius, type,
            life: 600, maxLife: 600,
            rotation: Math.random() * Math.PI * 2
        });
    }

    function updateGroundDecals() {
        for (let i = groundDecals.length - 1; i >= 0; i--) {
            const d = groundDecals[i];
            d.life--;
            if (d.life <= 0) groundDecals.splice(i, 1);
        }
    }

    function drawGroundDecals(ctx) {
        const camL = camera.x - 80;
        const camR = camera.x + VIEW_WIDTH + 80;
        const camT = camera.y - 80;
        const camB = camera.y + VIEW_HEIGHT + 80;

        for (const d of groundDecals) {
            if (d.x + d.radius < camL || d.x - d.radius > camR || d.y + d.radius < camT || d.y - d.radius > camB) {
                continue;
            }
            const alpha = Math.min(1, d.life / 60) * 0.75;
            ctx.save();
            ctx.translate(d.x, d.y);
            ctx.rotate(d.rotation);
            ctx.globalAlpha = alpha;

            if (d.type === 'scorch') {
                const grad = ctx.createRadialGradient(0, 0, d.radius * 0.2, 0, 0, d.radius);
                grad.addColorStop(0, '#100602');
                grad.addColorStop(0.7, '#241005');
                grad.addColorStop(1, 'rgba(36, 16, 5, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, d.radius, 0, Math.PI * 2);
                ctx.fill();
            } else if (d.type === 'water') {
                const grad = ctx.createRadialGradient(0, 0, d.radius * 0.1, 0, 0, d.radius);
                grad.addColorStop(0, 'rgba(0, 180, 240, 0.4)');
                grad.addColorStop(0.7, 'rgba(0, 140, 220, 0.25)');
                grad.addColorStop(1, 'rgba(0, 100, 200, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(0, 0, d.radius, d.radius * 0.65, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (d.type === 'crater') {
                ctx.fillStyle = '#18120c';
                ctx.beginPath();
                ctx.arc(0, 0, d.radius * 0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#2d2116';
                ctx.lineWidth = 3;
                for (let i = 0; i < 5; i++) {
                    const a = (i * Math.PI * 2) / 5 + 0.2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(a) * d.radius, Math.sin(a) * d.radius);
                    ctx.stroke();
                }
            } else if (d.type === 'skid') {
                ctx.fillStyle = 'rgba(20, 15, 10, 0.55)';
                ctx.fillRect(-d.radius, -4, d.radius * 2, 8);
            } else if (d.type === 'sludge') {
                ctx.fillStyle = 'rgba(74, 20, 140, 0.6)';
                ctx.beginPath();
                ctx.arc(0, 0, d.radius, 0, Math.PI * 2);
                ctx.fill();
            } else if (d.type === 'electric') {
                // 전기 그을음 및 방전 크랙 데칼
                const grad = ctx.createRadialGradient(0, 0, d.radius * 0.1, 0, 0, d.radius);
                grad.addColorStop(0, '#1c1a06');
                grad.addColorStop(0.65, '#2e2600');
                grad.addColorStop(1, 'rgba(46, 38, 0, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, d.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 235, 59, 0.45)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 5; i++) {
                    const a = (i * Math.PI * 2) / 5;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(a) * d.radius * 0.5, Math.sin(a) * d.radius * 0.5);
                    ctx.lineTo(Math.cos(a + 0.3) * d.radius * 0.9, Math.sin(a + 0.3) * d.radius * 0.9);
                    ctx.stroke();
                }
            }

            ctx.restore();
        }
    }

    const stoneRocks = [];

    // [스톤에지 바위 장애물 클래스 - 체력 100, 길을 막음, 서로 가운데로 모여 사선으로 솟아남, 파괴 시 주변 대미지/넉백]
    class StoneEdgeRock {
        constructor(x, y, owner, tiltAngle = 0, tiltAmount = 0.35) {
            this.x = x;
            this.y = y;
            this.owner = owner;
            this.hp = 100;
            this.maxHp = 100;
            this.radius = 28;
            this.isAlive = true;
            this.spawnScale = 0;
            this.lifeTimer = 900;
            this.tiltAngle = tiltAngle; // 중심을 향해 사선으로 기울어지는 각도
            this.tiltAmount = tiltAmount;
            this.points = [];
            const numPts = 8;
            for (let i = 0; i < numPts; i++) {
                const ang = (i / numPts) * Math.PI * 2;
                const r = this.radius * (0.8 + ((i % 3 === 0) ? 0.35 : -0.15) + (Math.sin(i * 1.7) * 0.15));
                this.points.push({ x: Math.cos(ang) * r, y: Math.sin(ang) * r });
            }
            if (typeof sfx !== 'undefined' && sfx.playRockSmash) sfx.playRockSmash();
        }
        takeDamage(dmg, attacker) {
            if (!this.isAlive) return;
            this.hp -= dmg;
            damageTexts.push(new DamageText(this.x, this.y - 15, `-${Math.round(dmg)}`, '#b0bec5', false));
            if (typeof sfx !== 'undefined' && sfx.playHit) sfx.playHit();
            for (let i = 0; i < 4; i++) {
                const a = Math.random() * Math.PI * 2;
                particles.push(new Particle(this.x, this.y, Math.cos(a) * 3, Math.sin(a) * 3, '#90a4ae', Math.random() * 5 + 3, 16));
            }
            if (this.hp <= 0) {
                this.destroy(attacker);
            }
        }
        destroy(attacker) {
            if (!this.isAlive) return;
            this.isAlive = false;
            if (typeof sfx !== 'undefined' && sfx.playRockSmash) sfx.playRockSmash();
            triggerScreenShake(8);
            addGroundDecal(this.x, this.y, 45, 'crater');
            showAlert('💥 스톤에지 바위 파괴 폭발!');
            const splashR = 140;
            const targets = (typeof p1 !== 'undefined' && typeof p2 !== 'undefined') ?
                [p1, p2, ...(typeof scytherClones !== 'undefined' ? scytherClones : [])].filter(c => c && c.isAlive) : [];
            for (const tgt of targets) {
                const d = Math.hypot(tgt.x - this.x, tgt.y - this.y);
                if (d <= splashR + tgt.radius) {
                    const kbAng = Math.atan2(tgt.y - this.y, tgt.x - this.x);
                    tgt.takeDamage(65, this.owner, true, Math.cos(kbAng) * 16, Math.sin(kbAng) * 16);
                }
            }
            for (let i = 0; i < 22; i++) {
                const a = Math.random() * Math.PI * 2;
                const spd = Math.random() * 8 + 2;
                particles.push(new Particle(
                    this.x, this.y,
                    Math.cos(a) * spd, Math.sin(a) * spd - 2,
                    Math.random() < 0.5 ? '#78909c' : '#b0bec5',
                    Math.random() * 7 + 4,
                    30,
                    'spark'
                ));
            }
        }
        update() {
            if (this.spawnScale < 1) this.spawnScale = Math.min(1, this.spawnScale + 0.15);
            this.lifeTimer--;
            if (this.lifeTimer <= 0 && this.isAlive) {
                this.destroy(this.owner);
            }
        }
        draw(ctx) {
            if (!this.isAlive) return;
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.scale(this.spawnScale, this.spawnScale);

            // 지면 그림자
            ctx.fillStyle = 'rgba(0, 0, 0, 0.48)';
            ctx.beginPath();
            ctx.ellipse(0, 16, this.radius * 1.15, this.radius * 0.45, 0, 0, Math.PI * 2);
            ctx.fill();

            // 가운데를 향한 사선 틸트 회전
            if (this.tiltAmount !== 0) {
                ctx.rotate(this.tiltAngle * 0.25);
            }

            // 바위 외곽선 및 본체 (사선 기둥 실루엣)
            ctx.fillStyle = '#607d8b';
            ctx.strokeStyle = '#263238';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            for (let i = 0; i < this.points.length; i++) {
                const pt = this.points[i];
                // 중심 쪽으로 약간 기운 사선 오프셋 반영
                const tiltX = (pt.y < 0) ? Math.cos(this.tiltAngle) * (this.tiltAmount * 18) : 0;
                const tiltY = (pt.y < 0) ? Math.sin(this.tiltAngle) * (this.tiltAmount * 18) : 0;
                if (i === 0) ctx.moveTo(pt.x + tiltX, pt.y + tiltY);
                else ctx.lineTo(pt.x + tiltX, pt.y + tiltY);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 날카로운 암석 능선 및 하이라이트
            ctx.fillStyle = '#90a4ae';
            ctx.beginPath();
            ctx.moveTo(this.points[0].x, this.points[0].y);
            ctx.lineTo(this.points[2].x, this.points[2].y);
            ctx.lineTo(0, -10);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#37474f';
            ctx.beginPath();
            ctx.moveTo(this.points[4].x, this.points[4].y);
            ctx.lineTo(this.points[6].x, this.points[6].y);
            ctx.lineTo(0, -10);
            ctx.closePath();
            ctx.fill();
            if (this.hp < this.maxHp) {
                const bw = 36;
                const bh = 5;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(-bw / 2, -this.radius - 14, bw, bh);
                ctx.fillStyle = (this.hp > 40) ? '#00e676' : '#ff1744';
                ctx.fillRect(-bw / 2, -this.radius - 14, (this.hp / this.maxHp) * bw, bh);
            }
            ctx.restore();
        }
    }

    // [지진 전방위 충격파 - 구멍파기 대상 2배 대미지]
    class EarthquakeShockwave {
        constructor(x, y, owner, maxRadius = 400, duration = 42, damage = 95) {
            this.x = x;
            this.y = y;
            this.owner = owner;
            this.maxRadius = maxRadius;
            this.duration = duration;
            this.maxDuration = duration;
            this.damage = damage;
            this.hitTargets = new Set();
        }
        update(arenaTargets) {
            this.duration--;
            const progress = 1 - (this.duration / this.maxDuration);
            const currentR = this.maxRadius * progress;
            for (const tgt of arenaTargets) {
                if (!tgt || !tgt.isAlive || tgt === this.owner || this.hitTargets.has(tgt)) continue;
                const dist = Math.hypot(tgt.x - this.x, tgt.y - this.y);
                if (dist <= currentR + tgt.radius && dist >= currentR - 70) {
                    this.hitTargets.add(tgt);
                    const isBurrowed = (tgt.state === 'burrowed');
                    const dmg = isBurrowed ? (this.damage * 2) : this.damage;
                    if (isBurrowed) {
                        tgt.state = 'knockdown';
                        tgt.stateTimer = 35;
                        tgt.burrowTimer = 0;
                        tgt.invincibleTimer = 0;
                        showAlert('⚡ [지진 특효!] 땅속의 구멍파기 상대를 강타! (2배 피해!)');
                    }
                    const kbAng = Math.atan2(tgt.y - this.y, tgt.x - this.x);
                    tgt.takeDamage(dmg, this.owner, true, Math.cos(kbAng) * (isBurrowed ? 22 : 14), Math.sin(kbAng) * (isBurrowed ? 22 : 14));
                }
            }
            if (Math.random() < 0.6) {
                const a = Math.random() * Math.PI * 2;
                const r = currentR * (0.8 + Math.random() * 0.2);
                particles.push(new Particle(
                    this.x + Math.cos(a) * r,
                    this.y + Math.sin(a) * r,
                    Math.cos(a) * 3, Math.sin(a) * 3 - 2,
                    Math.random() < 0.5 ? '#8d6e63' : '#b0bec5',
                    Math.random() * 8 + 4,
                    22,
                    'spark'
                ));
            }
        }
        draw(ctx) {
            const progress = 1 - (this.duration / this.maxDuration);
            const currentR = this.maxRadius * progress;
            const alpha = Math.max(0, 1 - progress);
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.strokeStyle = `rgba(187, 134, 91, ${alpha * 0.9})`;
            ctx.lineWidth = 8 * (1 - progress * 0.5);
            ctx.beginPath();
            ctx.arc(0, 0, currentR, 0, Math.PI * 2);
            ctx.stroke();
            ctx.strokeStyle = `rgba(255, 236, 179, ${alpha * 0.7})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, currentR - 8, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = `rgba(141, 110, 99, ${alpha * 0.2})`;
            ctx.beginPath();
            ctx.arc(0, 0, currentR, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }

    // [포켓몬별 조이기(R: Bind) 전용 감싸기 모션 렌더링]
    function drawBindVictimMotion(ctx, onix, victim) {
        if (!victim || !victim.isAlive) return;
        const time = onix.animTick || 0;
        const sp = victim.species;
        ctx.save();
        ctx.translate(victim.x, victim.y);
        const rockBase = '#78909c';
        const rockDark = '#37474f';
        if (sp === 'pikachu') {
            const wobble = Math.sin(time * 0.3) * 3;
            for (let ring = 0; ring < 3; ring++) {
                const r = 24 - ring * 5 + wobble;
                const offY = (ring - 1) * 8;
                ctx.fillStyle = rockBase;
                ctx.strokeStyle = rockDark;
                ctx.lineWidth = 3;
                for (let i = 0; i < 4; i++) {
                    const ang = (i / 4) * Math.PI * 2 + time * 0.08 + ring * 0.7;
                    ctx.beginPath();
                    ctx.arc(Math.cos(ang) * r, Math.sin(ang) * r * 0.5 + offY, 7 - ring, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
            }
            if (Math.random() < 0.6) {
                ctx.strokeStyle = '#ffd700';

                ctx.beginPath();
                ctx.moveTo(12, -4); ctx.lineTo(20, -10 + Math.random() * 6);

                ctx.stroke();
            }
        } else if (sp === 'charmander') {
            const pulse = Math.sin(time * 0.25) * 2;
            ctx.fillStyle = rockBase;
            ctx.strokeStyle = rockDark;
            ctx.lineWidth = 3.5;
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.arc(i * 14, 0 + pulse, 9, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
            }
            for (let j = -1; j <= 1; j++) {
                ctx.beginPath();
                ctx.arc(0, j * 15 - 5 + pulse, 8, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
            }
            ctx.fillStyle = '#ff5722';
            ctx.beginPath();
            ctx.arc(22, 10, 6 + Math.random() * 4, 0, Math.PI * 2);
            ctx.fill();
        } else if (sp === 'squirtle') {
            ctx.fillStyle = rockBase;
            ctx.strokeStyle = rockDark;
            ctx.lineWidth = 3.5;
            for (let i = 0; i < 6; i++) {
                const ang = (i / 6) * Math.PI * 2 + time * 0.05;
                const r = 26 + Math.sin(time * 0.2 + i) * 3;
                ctx.beginPath();
                ctx.arc(Math.cos(ang) * r, Math.sin(ang) * (r * 0.6), 9, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
            }
            if (Math.random() < 0.5) {
                ctx.fillStyle = '#00e5ff';
                ctx.beginPath();
                ctx.arc((Math.random() - 0.5) * 30, (Math.random() - 0.5) * 20, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        } else if (sp === 'bulbasaur') {
            ctx.fillStyle = rockBase;
            ctx.strokeStyle = rockDark;
            ctx.lineWidth = 3.5;
            for (let i = -2; i <= 2; i++) {
                ctx.beginPath();
                ctx.arc(i * 11, i * 7, 8, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
            }
            for (let i = -2; i <= 2; i++) {
                ctx.beginPath();
                ctx.arc(i * 11, -i * 7, 8, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
            }
            if (Math.random() < 0.5) {
                ctx.fillStyle = '#76ff03';
                ctx.fillRect((Math.random() - 0.5) * 32, -24 + (Math.random() - 0.5) * 8, 4, 4);
            }
        } else if (sp === 'scyther') {
            ctx.fillStyle = rockBase;
            ctx.strokeStyle = rockDark;
            ctx.lineWidth = 3.5;
            for (let i = -2; i <= 2; i++) {
                ctx.beginPath();
                ctx.arc(i * 12, i * 8, 8, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
            }
            ctx.beginPath(); ctx.arc(-24, -10, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(24, -10, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(-16, -28, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(16, -28, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 6, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.beginPath();
            ctx.arc(-24, -10, 14, 0, Math.PI);
            ctx.arc(24, -10, 14, 0, Math.PI);
            ctx.stroke();
        } else if (sp === 'lucario') {
            ctx.fillStyle = rockBase;
            ctx.strokeStyle = rockDark;
            ctx.lineWidth = 4;
            for (let i = 0; i < 7; i++) {
                const ang = (i / 7) * Math.PI * 2 + time * 0.04;
                const r = 28 + Math.sin(time * 0.2 + i) * 2;
                ctx.beginPath();
                ctx.arc(Math.cos(ang) * r, Math.sin(ang) * (r * 0.7) - 6, 10, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
            }
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.7)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(0, -10, 32 + Math.sin(time * 0.3) * 4, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            ctx.fillStyle = rockBase;
            ctx.strokeStyle = rockDark;
            ctx.lineWidth = 3.5;
            for (let i = 0; i < 6; i++) {
                const ang = (i / 6) * Math.PI * 2 + time * 0.05;
                ctx.beginPath();
                ctx.arc(Math.cos(ang) * 26, Math.sin(ang) * 16, 9, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
            }
        }
        ctx.restore();
    }

    // [QTE 탈출 HUD 화면]
    function drawQteHud(ctx) {
        if (typeof p1 === 'undefined' || !p1) return;
        if (p1.isAlive && p1.boundBy) {
            const onix = p1.boundBy;
            const curHits = onix.qteHitsCurrent || 0;
            const needHits = onix.qteHitsNeeded || 5;
            const key = (onix.qteKey || 'SPACE').toUpperCase();
            ctx.save();
            const cx = VIEW_WIDTH / 2;
            const cy = 200;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
            ctx.strokeStyle = '#ff1744';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.roundRect(cx - 240, cy - 65, 480, 130, 12);
            ctx.fill();
            ctx.stroke();
            ctx.font = '13px "Press Start 2P", monospace';
            ctx.fillStyle = '#ff5252';
            ctx.textAlign = 'center';
            ctx.fillText('⚠️ 롱스톤 [조이기] 속박!', cx, cy - 32);
            ctx.font = '13px "Noto Sans KR", sans-serif';
