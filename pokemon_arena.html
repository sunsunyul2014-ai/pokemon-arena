        if (btnP2) btnP2.innerText = `🔄 적 교체 (${p2.name})`;
    }

    // HUD DOM 엘리먼트 캐싱 (초당 수천 번의 DOM 탐색 방지)
    const hudDom = {
        p1HpFill: document.getElementById('p1-hp-fill'),
        p1HpText: document.getElementById('p1-hp-text'),
        p1StaminaFill: document.getElementById('p1-stamina-fill'),
        p2HpFill: document.getElementById('p2-hp-fill'),
        p2HpText: document.getElementById('p2-hp-text'),
        p2StaminaFill: document.getElementById('p2-stamina-fill'),
        iconAttack: document.getElementById('icon-attack'),
        nameAttack: document.getElementById('name-attack'),
        iconE: document.getElementById('icon-e'),
        nameE: document.getElementById('name-e'),
        iconF: document.getElementById('icon-f'),
        nameF: document.getElementById('name-f'),
        cd: {
            attack: document.getElementById('cd-attack'),
            q: document.getElementById('cd-q'),
            e: document.getElementById('cd-e'),
            r: document.getElementById('cd-r'),
            f: document.getElementById('cd-f')
        }
    };

    function renderHUD() {
        const p1Pct = (p1.hp / p1.maxHp) * 100;
        if (hudDom.p1HpFill) {
            hudDom.p1HpFill.style.width = `${p1Pct}%`;
            hudDom.p1HpFill.className = `hp-inner ${p1Pct < 25 ? 'red' : (p1Pct < 55 ? 'yellow' : '')}`;
        }
        if (hudDom.p1HpText) hudDom.p1HpText.innerText = `${Math.ceil(p1.hp)} / ${p1.maxHp}`;
        if (hudDom.p1StaminaFill) hudDom.p1StaminaFill.style.width = `${(p1.stamina / p1.maxStamina) * 100}%`;

        const p2Pct = (p2.hp / p2.maxHp) * 100;
        if (hudDom.p2HpFill) {
            hudDom.p2HpFill.style.width = `${p2Pct}%`;
            hudDom.p2HpFill.className = `hp-inner ${p2Pct < 25 ? 'red' : (p2Pct < 55 ? 'yellow' : '')}`;
        }
        if (hudDom.p2HpText) hudDom.p2HpText.innerText = `${Math.ceil(p2.hp)} / ${p2.maxHp}`;
        if (hudDom.p2StaminaFill) hudDom.p2StaminaFill.style.width = `${(p2.stamina / p2.maxStamina) * 100}%`;

        // 루카리오 실시간 스킬 슬롯 명칭 갱신
        if (p1.species === 'lucario') {
            const isBuffed = (p1.boneRushBuffTimer > 0);
            const hasAnchor = !!p1.boneRushAnchor;
            if (hudDom.iconAttack) hudDom.iconAttack.innerText = isBuffed ? '🦴' : '🥊';
            if (hudDom.nameAttack) hudDom.nameAttack.innerText = isBuffed ? '본러시 강타' : '불릿펀치';
            if (hudDom.iconE) hudDom.iconE.innerText = isBuffed ? '💥' : '⚡';
            if (hudDom.nameE) hudDom.nameE.innerText = isBuffed ? '강화 신속' : '신속';
            if (hudDom.iconF) hudDom.iconF.innerText = hasAnchor ? '📍' : '🦴';
            if (hudDom.nameF) hudDom.nameF.innerText = hasAnchor ? '순간이동 강타' : '본러시';
        }

        const slots = ['attack', 'q', 'e', 'r', 'f'];
        for (const slot of slots) {
            const cdEl = hudDom.cd[slot];
            if (!cdEl) continue;
            // 루카리오 본러시 뼈다귀가 박혀있는 동안에는 F키 즉시 2타 시전 가능
            if (p1.species === 'lucario' && slot === 'f' && p1.boneRushAnchor) {
                cdEl.classList.remove('on-cd');
                cdEl.innerText = '';
                continue;
            }
            const cd = p1.cooldowns[slot];
            if (cd > 0) {
                cdEl.innerText = cd.toFixed(1);
                cdEl.classList.add('on-cd');
            } else {
                cdEl.classList.remove('on-cd');
            }
        }
    }

    function gameLoop() {
        requestAnimationFrame(gameLoop);

        // 배속(1x, 2x, 5x, 10x) 처리
        for (let step = 0; step < gameSpeed; step++) {
            if (hitstopTimer > 0) {
                hitstopTimer--;
                break;
            }

            p1.update(p2);
            p2.update(p1);

            for (let i = scytherClones.length - 1; i >= 0; i--) {
                const clone = scytherClones[i];
                clone.update();
                if (!clone.isAlive) scytherClones.splice(i, 1);
            }

            camera.update(p1);

            updateGroundDecals();

            const arenaTargets = [p1, p2, ...scytherClones];

            for (let i = stoneRocks.length - 1; i >= 0; i--) {
                const sr = stoneRocks[i];
                sr.update();
                if (!sr.isAlive) stoneRocks.splice(i, 1);
            }

            for (let i = groundEffects.length - 1; i >= 0; i--) {
                const gf = groundEffects[i];
                gf.update(arenaTargets);
                if (gf.duration <= 0) groundEffects.splice(i, 1);
            }

            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                proj.update(arenaTargets, projectiles);
                if (proj.life <= 0) projectiles.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.update();
                if (pt.life <= 0) particles.splice(i, 1);
            }

            for (let i = damageTexts.length - 1; i >= 0; i--) {
                const dt = damageTexts[i];
                dt.update();
                if (dt.life <= 0) damageTexts.splice(i, 1);
            }

            // 파티클 & 데미지 텍스트 상한선 관리 (극심한 난전 중 프레임 드랍 원천 차단)
            if (particles.length > 200) {
                particles.splice(0, particles.length - 200);
            }
            if (damageTexts.length > 35) {
                damageTexts.splice(0, damageTexts.length - 35);
            }
        }

        mouse.x = screenMouse.x + camera.x;
        mouse.y = screenMouse.y + camera.y;

        let shakeOffsetX = 0;
        let shakeOffsetY = 0;
        if (cameraShake.intensity > 0) {
            shakeOffsetX = (Math.random() - 0.5) * cameraShake.intensity;
            shakeOffsetY = (Math.random() - 0.5) * cameraShake.intensity;
            cameraShake.intensity *= 0.88;
            if (cameraShake.intensity < 0.2) cameraShake.intensity = 0;
        }

        renderHUD();

        ctx.clearRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);

        // 뷰포트 컬링 바운드 계산
        const camL = camera.x - 70;
        const camR = camera.x + VIEW_WIDTH + 70;
        const camT = camera.y - 70;
        const camB = camera.y + VIEW_HEIGHT + 70;

        // === 월드 공간 렌더링 ===
        ctx.save();
        ctx.translate(-camera.x + shakeOffsetX, -camera.y + shakeOffsetY);

        // 1. 경기장 (단 1회 drawImage 복사)
        drawPokemonStadium(ctx);

        // 2. 바닥 장판 (화면 뷰포트 내 장판만 렌더링)
        for (const gf of groundEffects) {
            if (gf.x + 200 >= camL && gf.x - 200 <= camR && gf.y + 200 >= camT && gf.y - 200 <= camB) {
                gf.draw(ctx);
            }
        }

        // 3. 투사체 (화면 뷰포트 내 투사체만 렌더링)
        for (const proj of projectiles) {
            if (proj.x >= camL - 40 && proj.x <= camR + 40 && proj.y >= camT - 40 && proj.y <= camB + 40) {
                proj.draw(ctx);
            }
        }

        // 3.5. 스톤에지 바위 오브젝트 렌더링
        for (const rock of stoneRocks) rock.draw(ctx);

        // 번치코 뛰어오르기 시 바닥 파란색 원형 낙하 인디케이터 렌더링
        const fighters = [p1, p2].filter(p => p && p.isAlive && p.species === 'blaziken');
        for (const f of fighters) {
            if (f.bounceState === 'airborne' || f.bounceState === 'falling') {
                const prog = 1 - (f.bounceTimer / 180);
                const r = 220;
                ctx.save();
                ctx.translate(f.bounceTargetX, f.bounceTargetY);

                // 파란색 경고 원 영역
                ctx.fillStyle = `rgba(33, 150, 243, ${0.18 + Math.sin(f.animTick * 0.15) * 0.08})`;
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fill();

                // 외곽 파란색 링
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.stroke();

                // 차오르는 내부 타이머 링
                ctx.strokeStyle = '#ff1744';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(0, 0, r * prog, 0, Math.PI * 2);
                ctx.stroke();

                // 텍스트 인디케이터
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 6;
                ctx.fillText(`⚡ 낙하 경고! ${(f.bounceTimer / 60).toFixed(1)}s`, 0, -r - 12);
                ctx.restore();
            }
        }

        // 4. 캐릭터 및 분신 (Y좌표 정렬)
        const renderList = [p1, p2, ...scytherClones].sort((a, b) => a.y - b.y);
        for (const char of renderList) char.draw(ctx);

        // 5. 파티클 (화면 뷰포트 내 파티클만 렌더링)
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (const pt of particles) {
            if (pt.x >= camL && pt.x <= camR && pt.y >= camT && pt.y <= camB) {
                pt.draw(ctx);
            }
        }
        ctx.restore();

        // 6. 데미지 텍스트 (화면 뷰포트 내 텍스트만 렌더링)
        for (const dt of damageTexts) {
            if (dt.x >= camL && dt.x <= camR && dt.y >= camT && dt.y <= camB) {
                dt.draw(ctx);
            }
        }

        // 7. 조준선
        if (p1 && p1.isAlive) {
            ctx.save();
            const crosshairCol = (p1.species === 'charmander') ? 'rgba(255, 112, 67, 0.9)' : (p1.species === 'squirtle' ? 'rgba(0, 229, 255, 0.9)' : (p1.species === 'bulbasaur' ? 'rgba(0, 230, 118, 0.9)' : (p1.species === 'scyther' ? 'rgba(118, 255, 3, 0.95)' : (p1.species === 'lucario' ? 'rgba(41, 121, 255, 0.95)' : 'rgba(255, 215, 0, 0.95)'))));
            ctx.strokeStyle = crosshairCol;
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 14, 0, Math.PI * 2);
            ctx.moveTo(mouse.x - 20, mouse.y); ctx.lineTo(mouse.x - 7, mouse.y);
            ctx.moveTo(mouse.x + 7, mouse.y); ctx.lineTo(mouse.x + 20, mouse.y);
            ctx.moveTo(mouse.x, mouse.y - 20); ctx.lineTo(mouse.x, mouse.y - 7);
            ctx.moveTo(mouse.x, mouse.y + 7); ctx.lineTo(mouse.x, mouse.y + 20);
            ctx.stroke();

            ctx.strokeStyle = (p1.species === 'charmander') ? 'rgba(255, 87, 34, 0.25)' : (p1.species === 'squirtle' ? 'rgba(0, 229, 255, 0.25)' : (p1.species === 'bulbasaur' ? 'rgba(0, 230, 118, 0.25)' : (p1.species === 'scyther' ? 'rgba(118, 255, 3, 0.3)' : (p1.species === 'lucario' ? 'rgba(41, 121, 255, 0.25)' : 'rgba(255, 215, 0, 0.3)'))));
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 6]);
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.stroke();
            ctx.restore();
        }

        ctx.restore();

        // 8. 화면 밖 적 화살표 인디케이터
        drawOffscreenIndicator(ctx, p2);

        // 9. 미니맵 레이더
        drawMiniMap(ctx);

        // 10. 조이기 탈출 QTE 오버레이
        drawQteHud(ctx);
    }

    // 버튼 이벤트 리스너 등록
    document.getElementById('btn-switch-char').addEventListener('click', switchHero);
    document.getElementById('btn-switch-enemy').addEventListener('click', switchEnemyHero);
    document.getElementById('btn-reset').addEventListener('click', () => initBattle());
    document.getElementById('btn-modal-restart').addEventListener('click', () => initBattle());

    // 난이도 버튼 이벤트 (샌드백, 쉬움, 보통, 어려움, 지옥)
    document.querySelectorAll('.btn-diff').forEach(btn => {
        btn.addEventListener('click', () => {
            const diff = btn.getAttribute('data-diff');
            setDifficulty(diff);
        });
    });

    // 스킬 슬롯 직접 클릭
    ['attack', 'q', 'e', 'r', 'f'].forEach(slot => {
        const el = document.getElementById(`slot-${slot}`);
        if (el) {
            el.style.cursor = 'pointer';
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                sfx.init();
                if (p1 && p1.isAlive) p1.useSkill(slot);
            });
        }
    });

    initBattle();
    setDifficulty('hell');
    requestAnimationFrame(gameLoop);
    </script>
