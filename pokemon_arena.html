                } else if (this.cooldowns.attack <= 0 && dist <= 165 && Math.random() < 0.12 * sm) {
                    this.useSkill('attack');
                }
                        } else if (this.species === 'blaziken') {
                // 번치코 AI 행동 패턴 (근접 인파이트, 무릎차기 급습, 플레어드라이브 돌진, 뛰어오르기)
                if (dist <= 135 && this.cooldowns.r <= 0 && Math.random() < 0.18 * sm) {
                    this.useSkill('r'); // 인파이트 연격
                } else if (dist >= 160 && dist <= 380 && this.cooldowns.q <= 0 && Math.random() < 0.12 * sm) {
                    this.useSkill('q'); // 무릎차기 순간이동 급습
                } else if (dist >= 250 && dist <= 650 && this.cooldowns.f <= 0 && Math.random() < 0.08 * sm) {
                    this.useSkill('f'); // 플레어드라이브 화염 돌진
                } else if (dist >= 220 && dist <= 550 && this.cooldowns.e <= 0 && Math.random() < 0.06 * sm) {
                    this.useSkill('e'); // 뛰어오르기
                } else if (dist <= 140 && this.cooldowns.attack <= 0 && Math.random() < 0.16 * sm) {
                    this.useSkill('attack'); // 블레이즈킥 연타
                }
} else if (this.species === 'onix') {
                const oppIsBurrowed = (target.state === 'burrowed');
                if (oppIsBurrowed && this.cooldowns.e <= 0) {
                    this.useSkill('e');
                } else if (dist <= 140 && this.cooldowns.r <= 0 && target.sizeCategory !== 'large' && Math.random() < 0.16 * sm) {
                    this.useSkill('r');
                } else if (dist <= 130 && this.cooldowns.attack <= 0 && Math.random() < 0.15 * sm) {
                    this.useSkill('attack');
                } else if (dist <= 350 && this.cooldowns.e <= 0 && Math.random() < 0.06 * sm) {
                    this.useSkill('e');
                } else if (dist >= 180 && dist <= 700 && this.cooldowns.q <= 0 && Math.random() < 0.05 * sm) {
                    this.useSkill('q');
                } else if (dist >= 160 && dist <= 650 && this.cooldowns.f <= 0 && Math.random() < 0.04 * sm) {
                    this.useSkill('f');
                } else if (dist <= 150 && this.cooldowns.attack <= 0 && Math.random() < 0.12 * sm) {
                    this.useSkill('attack');
                }
            } else {
                if (dist > 280 && this.cooldowns.r <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('r');
                } else if (dist < 340 && this.cooldowns.f <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('f');
                } else if (dist < 280 && this.cooldowns.e <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('e');
                } else if (dist >= 200 && dist <= 600 && this.cooldowns.q <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('q');
                } else if (this.cooldowns.attack <= 0 && Math.random() < 0.06 * sm) {
                    this.useSkill('attack');
                }
            }
        }

        // [롱스톤 전용 고퀄리티 멀티 세그먼트 암석 뱀 렌더러]
        drawOnixSnake(ctx) {
            if (!this.segments || this.segments.length === 0) this.initOnixSegments();

            // 1. 구멍파기(Burrowed) 상태 렌더링: 영상 초반처럼 웅장한 아치형 다이빙 및 바다뱀 융기 궤적
            if (this.state === 'burrowed') {
                this.drawBurrowedOnix(ctx);
                return;
            }

            // 2. 바닥 지면 그림자 (각 세그먼트 돌마다 입체 타원 그림자)
            for (let i = this.segments.length - 1; i >= 0; i--) {
                const seg = this.segments[i];
                ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
                ctx.beginPath();
                ctx.ellipse(seg.x, seg.y + seg.radius * 0.55, seg.radius * 1.05, seg.radius * 0.42, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // 3. 세그먼트 간 암석 관절 연결부 (Connecting Joints)
            ctx.strokeStyle = '#8e9aab';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.beginPath();
            for (let i = 0; i < this.segments.length; i++) {
                const seg = this.segments[i];
                if (i === 0) ctx.moveTo(seg.x, seg.y);
                else ctx.lineTo(seg.x, seg.y);
            }
            ctx.stroke();

            // 4. 몸통 돌 및 꼬리 렌더링 (뒤에서부터 앞으로 그려 겹침 순서 유지)
            for (let i = this.segments.length - 1; i >= 1; i--) {
                const seg = this.segments[i];
                this.drawSingleRockSegment(ctx, seg, i);
            }

            // 5. 머리 돌(Head Segment 0) 렌더링 (가장 크고 입체적인 디테일)
            this.drawOnixHeadSegment(ctx, this.segments[0]);
        }

        // [구멍파기 렌더링: 롱스톤 본체는 완전히 숨기고, 그 대신 땅이 불룩하게 솟아오른 거대한 흙더미 능선(Raised Earth Mound)으로 렌더링]
        drawBurrowedOnix(ctx) {
            const head = this.segments[0];

            // 1. 꼬리부터 머리까지 연결되는 불룩하게 솟아오른 거대한 흙더미(Raised Earth Mound) 융기 궤적
            for (let i = this.segments.length - 1; i >= 1; i--) {
                const seg = this.segments[i];
                const rW = seg.radius * 1.35;
                const rH = seg.radius * 0.85;

                // (1) 지면 그림자
                ctx.fillStyle = 'rgba(38, 24, 18, 0.45)';
                ctx.beginPath();
                ctx.ellipse(seg.x, seg.y + 6, rW * 1.1, rH * 0.7, seg.angle, 0, Math.PI * 2);
                ctx.fill();

                // (2) 솟아오른 흙 언덕 베이스 (진한 갈색)
                ctx.fillStyle = '#5d4037';
                ctx.strokeStyle = '#3e2723';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.ellipse(seg.x, seg.y, rW, rH, seg.angle, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // (3) 불룩 솟아오른 토사 둔덕 중앙부 (밝은 갈색 융기)
                ctx.fillStyle = '#795548';
                ctx.beginPath();
                ctx.ellipse(seg.x, seg.y - 4, rW * 0.75, rH * 0.6, seg.angle, 0, Math.PI * 2);
                ctx.fill();

                // (4) 솟아오른 지면 능선 크랙 & 하이라이트
                ctx.strokeStyle = '#a1887f';
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(seg.x - Math.cos(seg.angle) * (rW * 0.6), seg.y - Math.sin(seg.angle) * (rW * 0.6) - 4);
                ctx.lineTo(seg.x + Math.cos(seg.angle) * (rW * 0.6), seg.y + Math.sin(seg.angle) * (rW * 0.6) - 4);
                ctx.stroke();

                // 갈라진 흙 크랙 선
                ctx.strokeStyle = '#3e2723';
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.moveTo(seg.x, seg.y - 6);
                ctx.lineTo(seg.x + Math.cos(seg.angle + Math.PI/2) * (rH * 0.5), seg.y + Math.sin(seg.angle + Math.PI/2) * (rH * 0.5) - 6);
                ctx.stroke();
            }

            // 2. ★선단(얼굴/머리, segments[0]): 지면을 파헤치며 솟아오른 거대한 흙더미 선단 & 솟아난 암석 뿔 (대미지 판정 부위)★
            ctx.save();
            ctx.translate(head.x, head.y);
            ctx.rotate(head.angle);

            // 선단 거대 융기 흙더미
            ctx.fillStyle = '#4e342e';
            ctx.strokeStyle = '#271c19';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(0, 0, 50, 32, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#6d4c41';
            ctx.beginPath();
            ctx.ellipse(4, -4, 42, 24, 0, 0, Math.PI * 2);
            ctx.fill();

            // 지면을 가르며 튀어나온 날카로운 암석 뿔 선단 (흙먼지를 뚫고 전진)
            ctx.fillStyle = '#78909c';
            ctx.strokeStyle = '#263238';
            ctx.lineWidth = 3.8;
            ctx.beginPath();
            ctx.moveTo(34, 0); // 뿔 선단
            ctx.lineTo(-8, -24);
            ctx.lineTo(-24, 0);
            ctx.lineTo(-8, 24);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 뿔 입체 능선
            ctx.fillStyle = '#cfd8dc';
            ctx.beginPath();
            ctx.moveTo(34, 0);
            ctx.lineTo(-8, -24);
            ctx.lineTo(-4, 0);
            ctx.closePath();
            ctx.fill();

            // 사나운 안광 (흙먼지 사이로 번뜩임)
            ctx.fillStyle = '#ffeb3b';
            ctx.beginPath();
            ctx.arc(2, -9, 4, 0, Math.PI * 2);
            ctx.arc(2, 9, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ff1744';
            ctx.beginPath();
            ctx.arc(2, -9, 2, 0, Math.PI * 2);
            ctx.arc(2, 9, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // [단일 암석 몸통 세그먼트 렌더러]
        drawSingleRockSegment(ctx, seg, index) {
            ctx.save();
            ctx.translate(seg.x, seg.y);
            const r = seg.drawR;

            // 실제 포켓몬 롱스톤: 밝은 회색 둥근 돌구슬
            // 메인 돌구슬 (밝은 블루그레이)
            const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.05, 0, 0, r);
            grad.addColorStop(0, '#dde3e8');
            grad.addColorStop(0.4, '#b8bec7');
            grad.addColorStop(1, '#8e9aab');
            ctx.fillStyle = grad;
            ctx.strokeStyle = '#7a8899';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 상단 하이라이트 (왼쪽 위 빛 반사)
            const hl = ctx.createRadialGradient(-r * 0.35, -r * 0.35, 0, -r * 0.2, -r * 0.2, r * 0.65);
            hl.addColorStop(0, 'rgba(255,255,255,0.65)');
            hl.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = hl;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // [롱스톤 머리 돌 세그먼트 렌더러 (얼굴, 뿔, 사나운 바위 눈, 단단한 턱선)]
        drawOnixHeadSegment(ctx, head) {
            ctx.save();
            ctx.translate(head.x, head.y);
            const r = head.drawR;

            // 실제 포켓몬 롱스톤 머리: 크고 둥근 밝은 회색 돌
            // 메인 머리 구체
            const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.05, 0, 0, r);
            grad.addColorStop(0, '#e0e5ea');
            grad.addColorStop(0.4, '#b8bec7');
            grad.addColorStop(1, '#8a96a8');
            ctx.fillStyle = grad;
            ctx.strokeStyle = '#7a8899';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 상단 하이라이트
            const hl = ctx.createRadialGradient(-r * 0.35, -r * 0.4, 0, -r * 0.2, -r * 0.25, r * 0.7);
            hl.addColorStop(0, 'rgba(255,255,255,0.7)');
            hl.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = hl;
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();

            // 머리 위 뿔 (실제 롱스톤처럼 뾰족하고 짧은 뿔)
            ctx.fillStyle = '#6b7a8a';
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-8, -r * 0.6);
            ctx.lineTo(0, -r * 1.55);
            ctx.lineTo(8, -r * 0.6);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            // 뿔 하이라이트
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.moveTo(0, -r * 1.55);
            ctx.lineTo(8, -r * 0.6);
            ctx.lineTo(0, -r * 0.9);
            ctx.closePath();
            ctx.fill();

            // 눈 (검정 동그란 눈, 포켓몬 스타일)
            const eyeY = -r * 0.1;
            const eyeX = r * 0.35;
            // 왼쪽 눈
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(-eyeX, eyeY, r * 0.18, 0, Math.PI * 2);
            ctx.fill();
            // 오른쪽 눈
            ctx.beginPath();
            ctx.arc(eyeX, eyeY, r * 0.18, 0, Math.PI * 2);
            ctx.fill();
            // 눈 하이라이트 (흰 반짝임)
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.beginPath();
            ctx.arc(-eyeX + r * 0.07, eyeY - r * 0.07, r * 0.07, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(eyeX + r * 0.07, eyeY - r * 0.07, r * 0.07, 0, Math.PI * 2);
            ctx.fill();

            // 입 (작고 귀여운 선)
            ctx.strokeStyle = '#5a6475';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, r * 0.25, r * 0.22, 0.1, Math.PI - 0.1);
            ctx.stroke();

            // 피격 플래시
            if (this.state === 'hurt' || this.stunTimer > 0) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        // [꼬부기 물회오리/돌진 시 등껍질 속으로 들어가 고속 회전하는 모션 렌더러]
        drawSquirtleShellSpin(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.shellSpinAngle);

            // 지면 그림자
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.beginPath();
            ctx.ellipse(0, 14, 30, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // 단단한 갈색 등껍질 외형
            ctx.fillStyle = '#8d6e63';
            ctx.strokeStyle = '#4e342e';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(0, 0, 26, 22, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 등껍질 하얀 림 (Rim)
            ctx.strokeStyle = '#fff8e1';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(0, 0, 23, 19, 0, 0, Math.PI * 2);
            ctx.stroke();

            // 거북이 등껍질 6각형 문양
            ctx.strokeStyle = '#4e342e';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            for (let a = 0; a < 6; a++) {
                const ang = (a * Math.PI) / 3;
                const px = Math.cos(ang) * 11;
                const py = Math.sin(ang) * 9;
                if (a === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();

            // 4개 구멍에서 나선형으로 뿜어져 나오는 회전 물줄기 (물회오리 시)
            if (this.state === 'whirlpool') {
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.92)';
                ctx.lineWidth = 4.5;
                ctx.lineCap = 'round';
                for (let i = 0; i < 4; i++) {
                    const a = (i * Math.PI) / 2;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a) * 22, Math.sin(a) * 22);
                    ctx.lineTo(Math.cos(a + 0.5) * 44, Math.sin(a + 0.5) * 44);
                    ctx.stroke();
                }
            }

            ctx.restore();
        }

        draw(ctx) {
            // [롱스톤 전용 고퀄리티 멀티 세그먼트 암석 뱀 렌더러]
            if (this.species === 'onix') {
                this.drawOnixSnake(ctx);
                return;
            }

            // [꼬부기 물회오리 / 돌진 시 등껍질 속으로 들어가 회전하는 모션]
            if (this.species === 'squirtle' && (this.state === 'whirlpool' || this.state === 'charging')) {
                this.drawSquirtleShellSpin(ctx);
                return;
            }

            ctx.save();
            ctx.translate(this.x, this.y);

            // 그림자
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath();
            ctx.ellipse(0, 24, 28, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            let drawX = 0;
            let drawY = 0;
            let rot = 0;

            if (this.attackMotionTimer > 0) {
                const lungeProgress = this.attackMotionTimer / 12;
                drawX += Math.cos(this.aimAngle) * 14 * lungeProgress;
                drawY += Math.sin(this.aimAngle) * 14 * lungeProgress;
            }

            if (this.headbuttTimer > 0) {
                const prog = this.headbuttTimer / 16;
                const offset = (prog > 0.5) ? -Math.sin((prog - 0.5) * Math.PI * 2) * 24 : Math.sin(prog * Math.PI * 2) * 35;
                drawX += Math.cos(this.aimAngle) * offset;
                drawY += Math.sin(this.aimAngle) * offset;
            }

            if (this.state === 'hurt') {
                drawX += (Math.random() - 0.5) * 8;
                rot = (Math.random() - 0.5) * 0.3;
            } else if (this.state === 'stun' || this.stunTimer > 0) {
                drawX += (Math.random() - 0.5) * 6;
                rot = (Math.random() - 0.5) * 0.15;
            } else if (this.state === 'knockdown') {
                rot = (this.animTick * 0.4);
            } else if (this.state === 'braking') {
                rot = (this.facingLeft ? 0.35 : -0.35);
            }

            const sheet = spriteSheets[this.species];
            const isSheetReady = sheet && sheet.complete && sheet.naturalWidth > 0;

            const isBulba = (this.species === 'bulbasaur');
            const isPika = (this.species === 'pikachu');
            const isScyther = (this.species === 'scyther');
            const isLucario = (this.species === 'lucario');
            const isOnix = (this.species === 'onix');
            const isBlaziken = (this.species === 'blaziken');

            // 번치코 뛰어오르기 공중 체공 중에는 지상 본체를 숨김
            if (isBlaziken && this.bounceState === 'airborne') {
                ctx.restore();
                return;
            }

            const fw = isBulba ? 40 : (isScyther ? 40 : (isOnix ? 88 : 32));
            const fh = (isBulba || isPika) ? 40 : ((isScyther || isLucario) ? 48 : (isBlaziken ? 56 : (isOnix ? 112 : 32)));
            const maxCols = isBulba ? 6 : (isOnix ? 4 : 4);
            const destW = isBulba ? 96 : (isScyther ? 110 : (isLucario ? 92 : (isBlaziken ? 96 : (isOnix ? 180 : 84))));
            const destH = isBulba ? 96 : (isPika ? 105 : (isScyther ? 132 : (isLucario ? 130 : (isBlaziken ? 140 : (isOnix ? 230 : 84)))));
            const destOffX = -destW / 2;
            let destOffY = isBulba ? -50 : (isPika ? -54 : (isScyther ? -64 : (isLucario ? -62 : (isBlaziken ? -68 : (isOnix ? -110 : -46)))));
            if (isOnix && this.state === 'burrowed') {
                destOffY += 80;
            }

            let angle = this.aimAngle;
            if (angle < 0) angle += Math.PI * 2;
            const slice = Math.PI / 4;
            const sector = Math.floor((angle + slice / 2) / slice) % 8;
            const sectorToRow = [2, 1, 0, 7, 6, 5, 4, 3];
            const row = sectorToRow[sector];

            let col = 0;
            if (this.state === 'run' || this.state === 'sprint') {
                col = Math.floor(this.walkFrame) % maxCols;
            } else {
                col = 0;
            }

            if (this.species === 'squirtle' && (this.state === 'charging' || this.state === 'whirlpool')) {
                if (this.state === 'whirlpool') {
                    ctx.save();
                    ctx.translate(drawX, drawY);
                    ctx.globalCompositeOperation = 'lighter';
                    const wpGrad = ctx.createRadialGradient(0, 0, 30, 0, 0, 220);
                    wpGrad.addColorStop(0, 'rgba(0, 229, 255, 0.45)');
                    wpGrad.addColorStop(0.65, 'rgba(0, 180, 240, 0.2)');
                    wpGrad.addColorStop(1, 'rgba(0, 140, 255, 0)');
                    ctx.fillStyle = wpGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, 220, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = 'rgba(0, 229, 255, 0.65)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, 220, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(this.shellSpinAngle);

                ctx.fillStyle = '#8d6e63';
                ctx.beginPath();
                ctx.arc(0, 0, 24, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3.5;
                ctx.stroke();

                ctx.strokeStyle = '#4e342e';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.moveTo(-14, 0); ctx.lineTo(14, 0);
                ctx.moveTo(0, -14); ctx.lineTo(0, 14);
                ctx.stroke();
                ctx.restore();

            } else if (this.species === 'charmander' && this.state === 'charging') {
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(this.chargeAngle * (this.facingLeft ? -0.25 : 0.25));

                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                } else {
                    this.drawFallbackPixel(ctx);
                }
                ctx.restore();

            } else if (this.species === 'bulbasaur' && this.state === 'petal_blizzard') {
                // 꽃보라 시전 중 전방위 회전 이펙트
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.globalCompositeOperation = 'lighter';
                const pGrad = ctx.createRadialGradient(0, 0, 20, 0, 0, 220);
                pGrad.addColorStop(0, 'rgba(255, 128, 171, 0.55)');
                pGrad.addColorStop(0.7, 'rgba(244, 143, 177, 0.2)');
                pGrad.addColorStop(1, 'rgba(244, 143, 177, 0)');
                ctx.fillStyle = pGrad;
                ctx.beginPath();
                ctx.arc(0, 0, 220, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 128, 171, 0.7)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 220, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();

                ctx.save();
                ctx.translate(drawX, drawY);
                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                } else {
                    this.drawFallbackPixel(ctx);
                }
                ctx.restore();

            } else if (this.species === 'bulbasaur' && (this.state === 'solarbeam_charge' || this.state === 'solarbeam_fire')) {
                // 솔라빔 차징 및 발사 오라
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.globalCompositeOperation = 'lighter';

                const auraRadius = (this.state === 'solarbeam_charge') ? (25 + Math.sin(this.animTick * 0.3) * 8) : 48;
                const auraGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, auraRadius);
                auraGrad.addColorStop(0, '#ffffff');
                auraGrad.addColorStop(0.5, '#ffff00');
                auraGrad.addColorStop(1, 'rgba(118, 255, 3, 0)');
                ctx.fillStyle = auraGrad;
                ctx.beginPath();
                ctx.arc(0, 0, auraRadius, 0, Math.PI * 2);
                ctx.fill();

                // 조준 가이드 레이저 선 (차징 중에 방향 표시)
                if (this.state === 'solarbeam_charge') {
                    ctx.strokeStyle = 'rgba(255, 255, 0, 0.65)';
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash([8, 8]);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(this.aimAngle) * 800, Math.sin(this.aimAngle) * 800);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                ctx.restore();

                // 발사 중 전방 거대 솔라빔 드로잉
                if (this.state === 'solarbeam_fire') {
                    ctx.save();
                    ctx.translate(drawX, drawY);
                    ctx.rotate(this.aimAngle);
                    ctx.globalCompositeOperation = 'lighter';

                    const beamLen = 1300;
                    const bWidth = 65;
                    const beamGrad = ctx.createLinearGradient(0, -bWidth / 2, 0, bWidth / 2);
                    beamGrad.addColorStop(0, 'rgba(118, 255, 3, 0)');
                    beamGrad.addColorStop(0.2, '#ffff00');
                    beamGrad.addColorStop(0.5, '#ffffff');
                    beamGrad.addColorStop(0.8, '#ffff00');
                    beamGrad.addColorStop(1, 'rgba(118, 255, 3, 0)');
                    ctx.fillStyle = beamGrad;
                    ctx.fillRect(10, -bWidth / 2, beamLen, bWidth);

                    // 중심 코어 레이저
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(10, -bWidth * 0.2, beamLen, bWidth * 0.4);

                    ctx.restore();
                }

                ctx.save();
                ctx.translate(drawX, drawY);
                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                } else {
                    this.drawFallbackPixel(ctx);
                }
                ctx.restore();

            } else if (this.species === 'pikachu' && this.state === 'quick_attack') {
                // 전광석화 돌진 아우라 및 스피드라인
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(this.chargeAngle * (this.facingLeft ? -0.2 : 0.2));

                ctx.globalCompositeOperation = 'lighter';
                const qGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, 52);
                qGrad.addColorStop(0, '#ffffff');
                qGrad.addColorStop(0.4, '#fff59d');
                qGrad.addColorStop(0.8, 'rgba(0, 229, 255, 0.4)');
                qGrad.addColorStop(1, 'rgba(0, 229, 255, 0)');
                ctx.fillStyle = qGrad;
                ctx.beginPath();
                ctx.arc(0, 0, 52, 0, Math.PI * 2);
                ctx.fill();

                ctx.globalCompositeOperation = 'source-over';
                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                } else {
                    this.drawFallbackPixel(ctx);
                }
                ctx.restore();

            } else if (this.species === 'pikachu' && this.state === 'iron_tail') {
                // 아이언테일 넓은 부채꼴 메탈릭 슬래시 이펙트
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(this.aimAngle);

                const sweepRadius = 195;
                const sweepAngle = Math.PI * 0.78; // 140도

                ctx.globalCompositeOperation = 'lighter';
                const tailGrad = ctx.createRadialGradient(0, 0, 20, 0, 0, sweepRadius);
                tailGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
                tailGrad.addColorStop(0.4, 'rgba(207, 216, 220, 0.6)');
                tailGrad.addColorStop(0.75, 'rgba(255, 235, 59, 0.45)');
                tailGrad.addColorStop(1, 'rgba(255, 235, 59, 0)');

                ctx.fillStyle = tailGrad;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, sweepRadius, -sweepAngle / 2, sweepAngle / 2);
                ctx.closePath();
                ctx.fill();

                // 메탈릭 슬래시 테두리 호
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, sweepRadius, -sweepAngle / 2, sweepAngle / 2);
                ctx.stroke();

                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, sweepRadius - 8, -sweepAngle / 2, sweepAngle / 2);
                ctx.stroke();

                ctx.restore();

                // 본체 회전 모션
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(rot + (this.ironTailTimer / 16) * Math.PI * 2 * (this.facingLeft ? -1 : 1));
                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                } else {
                    this.drawFallbackPixel(ctx);
                }
                ctx.restore();

            } else if (isBlaziken && this.state === 'close_combat') {
                // ★ 번치코 인파이트(Close Combat) 초고속 불꽃 난타 & 블레이즈 승룡권 어퍼컷 ★
                const isUppercut = (this.closeCombatTimer <= 10);
                const punchProgress = (38 - this.closeCombatTimer);

                // 1. 고속 타격 잔상 (애프터이미지 실루엣 2중 렌더링)
                const afterImageOffset = isUppercut ? -12 : (Math.sin(punchProgress * 2.2) * 16);
                ctx.save();
                ctx.translate(drawX + Math.cos(this.aimAngle + 0.3) * afterImageOffset * 0.6, drawY + Math.sin(this.aimAngle + 0.3) * afterImageOffset * 0.6);
                ctx.globalAlpha = 0.35;
                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                }
                ctx.restore();

                ctx.save();
                ctx.translate(drawX + Math.cos(this.aimAngle - 0.3) * afterImageOffset * 0.6, drawY + Math.sin(this.aimAngle - 0.3) * afterImageOffset * 0.6);
                ctx.globalAlpha = 0.35;
                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                }
                ctx.restore();

                // 2. 본체 타격 렌더링
                ctx.save();
                ctx.translate(drawX, drawY);
                const lungeOffset = isUppercut ? 14 : (Math.sin(punchProgress * 2.0) * 8);
                ctx.translate(Math.cos(this.aimAngle) * lungeOffset, Math.sin(this.aimAngle) * lungeOffset);
                ctx.rotate(rot + (isUppercut ? -0.15 : (Math.sin(punchProgress * 1.5) * 0.08)));

                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                } else {
                    this.drawFallbackPixel(ctx);
                }
                ctx.restore();

                // 3. 전방 화염 난타 이펙트 (폭발적인 불꽃 펀치 타격섬광 & 스피드 슬래시)
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(this.aimAngle);
                ctx.globalCompositeOperation = 'lighter';

                if (isUppercut) {
                    // 피니시: 지면을 가르고 솟구치는 거대 블레이즈 승룡권 화염 기둥
                    const upProg = Math.min(1, (10 - this.closeCombatTimer) / 10);
                    const beamGrad = ctx.createLinearGradient(0, 0, 90, -70);
                    beamGrad.addColorStop(0, 'rgba(255, 23, 68, 0.3)');
                    beamGrad.addColorStop(0.4, '#ff9100');
                    beamGrad.addColorStop(0.7, '#ffff00');
                    beamGrad.addColorStop(1, '#ffffff');
                    ctx.fillStyle = beamGrad;
                    ctx.beginPath();
                    ctx.moveTo(10, 25);
                    ctx.lineTo(85 * upProg + 10, -55 * upProg);
                    ctx.lineTo(55 * upProg, -85 * upProg);
                    ctx.lineTo(-5, -15);
                    ctx.closePath();
                    ctx.fill();

                    // 거대 승룡 화염 폭발 구체
                    const burstGrad = ctx.createRadialGradient(50 * upProg, -50 * upProg, 5, 50 * upProg, -50 * upProg, 48);
                    burstGrad.addColorStop(0, '#ffffff');
                    burstGrad.addColorStop(0.4, '#ffeb3b');
                    burstGrad.addColorStop(0.8, 'rgba(255, 87, 34, 0.6)');
                    burstGrad.addColorStop(1, 'rgba(255, 23, 68, 0)');
                    ctx.fillStyle = burstGrad;
                    ctx.beginPath();
                    ctx.arc(50 * upProg, -50 * upProg, 48, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // 초고속 양손 펀치 화염 폭발 버스트 6연타
                    const punchPhase = (punchProgress % 4) / 4;
                    const fistDistance = 35 + punchPhase * 35;
                    const fistSpread = (punchProgress % 2 === 0 ? 12 : -12);

                    const fGrad = ctx.createRadialGradient(fistDistance, fistSpread, 2, fistDistance, fistSpread, 28);
                    fGrad.addColorStop(0, '#ffffff');
                    fGrad.addColorStop(0.35, '#ffeb3b');
                    fGrad.addColorStop(0.7, '#ff5722');
                    fGrad.addColorStop(1, 'rgba(255, 23, 68, 0)');
                    ctx.fillStyle = fGrad;
                    ctx.beginPath();
                    ctx.arc(fistDistance, fistSpread, 28, 0, Math.PI * 2);
                    ctx.fill();

                    // 타격 스피드 슬래시 라인
                    ctx.strokeStyle = '#fff59d';
                    ctx.lineWidth = 3.5;
                    ctx.beginPath();
                    ctx.moveTo(10, fistSpread * 0.5);
                    ctx.lineTo(fistDistance + 18, fistSpread);
                    ctx.stroke();
                }
                ctx.restore();
            } else {
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(rot);

                if (this.state === 'hurt' && Math.floor(this.animTick / 3) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                if (isSheetReady) {
                    ctx.drawImage(sheet, col * fw, row * fh, fw, fh, destOffX, destOffY, destW, destH);
                } else {
                    this.drawFallbackPixel(ctx);
                }

                ctx.restore();
            }

            // 경직 (스턴) 상태 시각 효과
            if (this.stunTimer > 0 || this.state === 'stun') {
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.arc(0, 0, this.radius + 6, 0, Math.PI * 2);
                ctx.stroke();

                ctx.font = '8px "Press Start 2P", monospace';
                ctx.fillStyle = '#ffd700';
                ctx.textAlign = 'center';
                ctx.fillText('⚡ STUN (경직) ⚡', 0, -this.radius - 24);
                ctx.restore();
            }

            if (this.species === 'charmander') {
                const tailX = (this.facingLeft ? 22 : -22) + this.x;
                const tailY = 8 + this.y;
                particles.push(new Particle(tailX, tailY, (Math.random() - 0.5) * 1.5, -Math.random() * 2 - 1, Math.random() < 0.6 ? '#ff3d00' : '#ffea00', Math.random() * 5 + 3, 14, 'flame'));
            } else if (this.species === 'pikachu' && Math.random() < 0.3) {
                // 피카츄 볼 전기 주머니 스파크 방출
                const cheekX = (this.facingLeft ? -10 : 10) + this.x + (Math.random() - 0.5) * 8;
                const cheekY = -6 + this.y + (Math.random() - 0.5) * 6;
                particles.push(new Particle(cheekX, cheekY, (Math.random() - 0.5) * 1.5, -Math.random() * 1.5, Math.random() < 0.6 ? '#ffea00' : '#00e5ff', Math.random() * 4 + 2, 12, 'spark'));
            }

            // 루카리오: 바닥에 박힌 뼈다귀 앵커 렌더링
            if (this.boneRushAnchor) {
                const anc = this.boneRushAnchor;
                ctx.save();
                ctx.translate(anc.x, anc.y);
                ctx.globalCompositeOperation = 'lighter';

                const pulseR = 24 + Math.sin(this.animTick * 0.15) * 6;
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, pulseR, 0, Math.PI * 2);
                ctx.stroke();

                ctx.rotate(-Math.PI / 4);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.roundRect(-22, -4, 44, 8, 4);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-22, -5, 5, 0, Math.PI * 2);
                ctx.arc(-22, 5, 5, 0, Math.PI * 2);
                ctx.arc(22, -5, 5, 0, Math.PI * 2);
                ctx.arc(22, 5, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            // 루카리오: 본러시 버프 손에 든 푸른 뼈다귀 무기 렌더링 (5초간 평타/신속 강화)
            if (this.species === 'lucario' && this.boneRushBuffTimer > 0) {
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(this.aimAngle);
                ctx.globalCompositeOperation = 'lighter';

                const boneLen = 42;
                ctx.fillStyle = '#e0f7fa';
                ctx.beginPath();
                ctx.roundRect(14, -boneLen / 2, 7, boneLen, 3);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(17, -boneLen / 2, 5, 0, Math.PI * 2);
                ctx.arc(17, boneLen / 2, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                const bGrad = ctx.createRadialGradient(17, 0, 4, 17, 0, 32);
                bGrad.addColorStop(0, 'rgba(0, 229, 255, 0.6)');
                bGrad.addColorStop(1, 'rgba(41, 121, 255, 0)');
                ctx.fillStyle = bGrad;
                ctx.beginPath();
                ctx.arc(17, 0, 32, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // 롱스톤에게 조이기를 당하고 있을 때 전용 포켓몬별 감싸기 모션 렌더링
            if (this.boundBy && this.boundBy.isAlive) {
                drawBindVictimMotion(ctx, this.boundBy, this);
            }

            // 롱스톤 구멍파기 중일 때 지면 흙더미/잠복 홀 렌더링
            if (this.species === 'onix' && this.state === 'burrowed') {
                ctx.save();
                ctx.translate(drawX, drawY + 22);
                ctx.fillStyle = '#3e2723';
                ctx.beginPath();
                ctx.ellipse(0, 0, 52, 22, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#8d6e63';
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.restore();
            }

            ctx.restore();
        }

        drawFallbackPixel(ctx) {
            if (this.species === 'charmander') {
                ctx.fillStyle = '#ff7043';
                ctx.fillRect(-20, -30, 40, 50);
                ctx.fillStyle = '#fff59d';
                ctx.fillRect(-10, -10, 20, 25);
            } else if (this.species === 'squirtle') {
                ctx.fillStyle = '#81d4fa';
                ctx.fillRect(-20, -30, 40, 50);
                ctx.fillStyle = '#ffe082';
                ctx.fillRect(-12, -12, 24, 26);
            } else if (this.species === 'bulbasaur') {
                ctx.fillStyle = '#4db6ac';
                ctx.fillRect(-22, -26, 44, 46);
                ctx.fillStyle = '#2e7d32'; // 등 꽃봉오리
                ctx.fillRect(-14, -36, 28, 16);
                ctx.fillStyle = '#d32f2f'; // 붉은 눈
                ctx.fillRect(-12, -16, 6, 8);
                ctx.fillRect(6, -16, 6, 8);
            } else if (this.species === 'pikachu') {
                // 피카츄 귀여운 도트 폴백 그래픽
                ctx.fillStyle = '#ffd600';
                ctx.fillRect(-18, -26, 36, 46);
                // 양쪽 뾰족한 귀
                ctx.beginPath();
                ctx.moveTo(-16, -26); ctx.lineTo(-24, -48); ctx.lineTo(-8, -26);
                ctx.moveTo(16, -26); ctx.lineTo(24, -48); ctx.lineTo(8, -26);
                ctx.fill();
                // 귀 끝 검정
                ctx.fillStyle = '#212121';
                ctx.beginPath();
                ctx.moveTo(-18, -38); ctx.lineTo(-24, -48); ctx.lineTo(-12, -38);
                ctx.moveTo(18, -38); ctx.lineTo(24, -48); ctx.lineTo(12, -38);
                ctx.fill();
                // 눈
                ctx.fillStyle = '#212121';
                ctx.fillRect(-12, -18, 6, 7);
                ctx.fillRect(6, -18, 6, 7);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-11, -17, 2, 2);
                ctx.fillRect(7, -17, 2, 2);
                // 빨간 볼 (전기 주머니)
                ctx.fillStyle = '#f44336';
                ctx.fillRect(-16, -10, 6, 6);
                ctx.fillRect(10, -10, 6, 6);
                // 번개 모양 꼬리
                ctx.fillStyle = '#ffd600';
                ctx.strokeStyle = '#ffd600';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(14, 6); ctx.lineTo(26, -4); ctx.lineTo(22, 2); ctx.lineTo(34, -8);
                ctx.stroke();
            } else if (this.species === 'scyther') {
                // 스라크 사마귀 픽셀 도트
                ctx.fillStyle = '#66bb6a';
                ctx.fillRect(-16, -30, 32, 48);
                // 복부
                ctx.fillStyle = '#c8e6c9';
                ctx.fillRect(-10, -10, 20, 24);
                // 머리 & 뿔
                ctx.fillStyle = '#43a047';
                ctx.beginPath();
                ctx.moveTo(-14, -30); ctx.lineTo(0, -48); ctx.lineTo(14, -30);
                ctx.fill();
                // 등 날개 (반투명 곤충 날개)
                ctx.fillStyle = 'rgba(224, 247, 250, 0.7)';
                ctx.beginPath();
                ctx.ellipse(-18, -16, 18, 6, -Math.PI / 4, 0, Math.PI * 2);
                ctx.ellipse(18, -16, 18, 6, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
                // 양손 낫 (Dual scythes)
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(-22, -6, 18, -Math.PI / 2, Math.PI / 3);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(22, -6, 18, Math.PI * 0.65, Math.PI * 1.5);
                ctx.stroke();
            } else if (this.species === 'lucario') {
                // 루카리오 자칼 파이터 도트 폴백
                ctx.fillStyle = '#1e88e5';
                ctx.fillRect(-16, -30, 32, 48);
                // 가슴 크림색 털
                ctx.fillStyle = '#fff9c4';
                ctx.fillRect(-10, -22, 20, 18);
                // 가슴 가시
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(0, -22); ctx.lineTo(6, -16); ctx.lineTo(-6, -16);
                ctx.fill();
                // 검은 마스크 및 귀
                ctx.fillStyle = '#212121';
                ctx.fillRect(-14, -38, 28, 14);
                ctx.beginPath();
                ctx.moveTo(-14, -38); ctx.lineTo(-18, -54); ctx.lineTo(-8, -38);
                ctx.moveTo(14, -38); ctx.lineTo(18, -54); ctx.lineTo(8, -38);
                ctx.fill();
                // 붉은 눈
                ctx.fillStyle = '#d50000';
                ctx.fillRect(-9, -32, 4, 5);
                ctx.fillRect(5, -32, 4, 5);

                if (this.boneRushBuffTimer > 0) {
                    ctx.strokeStyle = '#00e5ff';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(18, -12); ctx.lineTo(28, 16);
                    ctx.stroke();
                }
            } else if (this.species === 'onix') {
                // 롱스톤 거대 바위 뱀 폴백 도트 렌더러
                ctx.fillStyle = '#78909c';
                ctx.strokeStyle = '#37474f';
                ctx.lineWidth = 3;
                for (let i = 5; i >= 0; i--) {
                    const r = 24 - i * 2.8;
                    const offX = -Math.cos(this.aimAngle) * (i * 22);
                    const offY = -Math.sin(this.aimAngle) * (i * 22) - 10;
                    ctx.beginPath();
                    ctx.arc(offX, offY, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
                ctx.fillStyle = '#90a4ae';
                ctx.beginPath();
                ctx.arc(0, -14, 28, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(-10, -32); ctx.lineTo(0, -56); ctx.lineTo(10, -32);
                ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-12, -22, 6, 4);
                ctx.fillRect(6, -22, 6, 4);
                ctx.fillStyle = '#212121';
                ctx.fillRect(-10, -21, 3, 3);
                ctx.fillRect(8, -21, 3, 3);
            }
        }
    }

    // --- 초대형 포켓몬 리그 공식 스타디움 오프스크린 캔버스 캐싱 (GPU 하드웨어 가속 60fps) ---
    let stadiumBgCanvas = null;

    function renderStadiumToOffscreen() {
        stadiumBgCanvas = document.createElement('canvas');
        stadiumBgCanvas.width = WORLD_WIDTH;
        stadiumBgCanvas.height = WORLD_HEIGHT;
        const bCtx = stadiumBgCanvas.getContext('2d');

        // 1. 경기장 바깥 어두운 관람석 베이스
        bCtx.fillStyle = '#080d15';
        bCtx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

        // 2. 상단 및 측면 관람석
        const bleacherRows = [
            { y: 0, h: 36, color: '#0f1624' },
            { y: 36, h: 36, color: '#162134' },
            { y: 72, h: 36, color: '#1e2c45' },
            { y: 108, h: 34, color: '#273856' }
        ];
        for (const row of bleacherRows) {
            bCtx.fillStyle = row.color;
            bCtx.fillRect(0, row.y, WORLD_WIDTH, row.h);
        }

        // 응원하는 열광적인 관중 픽셀 도트
        const crowdColors = ['#ff5252', '#448aff', '#ffd740', '#69f0ae', '#e040fb', '#ffffff', '#ffab40', '#00e5ff'];
        for (let x = 20; x < WORLD_WIDTH - 20; x += 16) {
            for (let r = 0; r < 4; r++) {
                const seed = (x * 17 + r * 31) % crowdColors.length;
                bCtx.fillStyle = crowdColors[seed];
                bCtx.fillRect(x, 6 + r * 32, 7, 7);
                bCtx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                bCtx.fillRect(x + 1, 14 + r * 32, 5, 8);
            }
        }

        // 3. 스타디움 외곽 석조 방벽 테두리
        bCtx.fillStyle = '#222c3d';
        bCtx.fillRect(130, 142, WORLD_WIDTH - 260, WORLD_HEIGHT - 284);
        bCtx.strokeStyle = '#41526d';
        bCtx.lineWidth = 8;
        bCtx.strokeRect(130, 142, WORLD_WIDTH - 260, WORLD_HEIGHT - 284);

        // 상단 방벽 공식 챔피언십 엠블럼 띠
        bCtx.fillStyle = '#18212f';
        bCtx.fillRect(130, 142, WORLD_WIDTH - 260, 26);
        bCtx.fillStyle = '#fbc02d';
        bCtx.font = '900 13px "Press Start 2P", monospace';
        bCtx.textAlign = 'center';
        bCtx.fillText('★ POKÉMON LEAGUE OFFICIAL CHAMPIONSHIP ARENA ★', CENTER_X, 160);

        // 4. 내부 흙/모래 트랙 띠
        bCtx.fillStyle = '#b3823e';
        bCtx.fillRect(165, 172, WORLD_WIDTH - 330, WORLD_HEIGHT - 344);
        bCtx.strokeStyle = '#8d6326';
        bCtx.lineWidth = 5;
        bCtx.strokeRect(165, 172, WORLD_WIDTH - 330, WORLD_HEIGHT - 344);

        // 5. 메인 천연 잔디 배틀 피치
        const pitchX = PITCH_X;
        const pitchY = PITCH_Y;
        const pitchW = PITCH_W;
        const pitchH = PITCH_H;

        const grassGrad = bCtx.createRadialGradient(CENTER_X, CENTER_Y, 150, CENTER_X, CENTER_Y, 1400);
        grassGrad.addColorStop(0, '#388e3c');
        grassGrad.addColorStop(0.65, '#2e7d32');
        grassGrad.addColorStop(1, '#1b5e20');
        bCtx.fillStyle = grassGrad;
        bCtx.fillRect(pitchX, pitchY, pitchW, pitchH);

        // 잔디 스트라이프 패턴
        bCtx.save();
        bCtx.beginPath();
        bCtx.rect(pitchX, pitchY, pitchW, pitchH);
        bCtx.clip();
        bCtx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        for (let x = pitchX; x < pitchX + pitchW; x += 100) {
            bCtx.fillRect(x, pitchY, 50, pitchH);
        }
        bCtx.restore();

        // 6. 공식 규격 코트 흰색 라인
        bCtx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
        bCtx.lineWidth = 4;
        bCtx.strokeRect(pitchX + 40, pitchY + 40, pitchW - 80, pitchH - 80);

        // 중앙 분할선
        bCtx.beginPath();
        bCtx.moveTo(CENTER_X, pitchY + 40);
        bCtx.lineTo(CENTER_X, pitchY + pitchH - 40);
        bCtx.stroke();

        // 중앙 대형 서클
        bCtx.beginPath();
        bCtx.arc(CENTER_X, CENTER_Y, 200, 0, Math.PI * 2);
        bCtx.stroke();

        // 7. 트레이너 스타트 박스 (1P 레드 / 2P 블루)
        bCtx.fillStyle = 'rgba(244, 67, 54, 0.22)';
        bCtx.strokeStyle = 'rgba(244, 67, 54, 0.85)';
        bCtx.lineWidth = 3;
        bCtx.fillRect(pitchX + 60, CENTER_Y - 120, 140, 240);
        bCtx.strokeRect(pitchX + 60, CENTER_Y - 120, 140, 240);
        bCtx.fillStyle = '#ff8a80';
        bCtx.font = '900 16px "Press Start 2P", monospace';
        bCtx.textAlign = 'center';
        bCtx.fillText('1P', pitchX + 130, CENTER_Y + 8);

        bCtx.fillStyle = 'rgba(33, 150, 243, 0.22)';
        bCtx.strokeStyle = 'rgba(33, 150, 243, 0.85)';
        bCtx.lineWidth = 3;
        bCtx.fillRect(pitchX + pitchW - 200, CENTER_Y - 120, 140, 240);
        bCtx.strokeRect(pitchX + pitchW - 200, CENTER_Y - 120, 140, 240);
        bCtx.fillStyle = '#82b1ff';
        bCtx.font = '900 16px "Press Start 2P", monospace';
        bCtx.textAlign = 'center';
        bCtx.fillText('2P', pitchX + pitchW - 130, CENTER_Y + 8);

        // 8. 중앙 몬스터볼 문양
        bCtx.save();
        const pbRadius = 130;
        bCtx.beginPath();
        bCtx.arc(CENTER_X, CENTER_Y, pbRadius, Math.PI, 0);
        bCtx.fillStyle = '#d32f2f';
        bCtx.fill();

        bCtx.beginPath();
        bCtx.arc(CENTER_X, CENTER_Y, pbRadius * 0.72, Math.PI * 1.1, Math.PI * 1.45);
        bCtx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        bCtx.lineWidth = 8;
        bCtx.stroke();

        bCtx.beginPath();
        bCtx.arc(CENTER_X, CENTER_Y, pbRadius, 0, Math.PI);
        bCtx.fillStyle = '#ffffff';
        bCtx.fill();

        bCtx.fillStyle = '#1e272e';
        bCtx.fillRect(CENTER_X - pbRadius, CENTER_Y - 12, pbRadius * 2, 24);

        bCtx.strokeStyle = '#1e272e';
        bCtx.lineWidth = 8;
        bCtx.beginPath();
        bCtx.arc(CENTER_X, CENTER_Y, pbRadius, 0, Math.PI * 2);
        bCtx.stroke();

        bCtx.beginPath();
        bCtx.arc(CENTER_X, CENTER_Y, 38, 0, Math.PI * 2);
        bCtx.fillStyle = '#f5f6fa';
        bCtx.fill();
        bCtx.strokeStyle = '#1e272e';
        bCtx.lineWidth = 7;
        bCtx.stroke();

        bCtx.beginPath();
        bCtx.arc(CENTER_X, CENTER_Y, 18, 0, Math.PI * 2);
        bCtx.fillStyle = '#eceff1';
        bCtx.fill();
        bCtx.strokeStyle = '#90a4ae';
        bCtx.lineWidth = 3;
        bCtx.stroke();
        bCtx.restore();

        // 9. 코너 4개소 스타디움 조명 빛줄기 (사전 베이킹)
        bCtx.save();
        bCtx.globalCompositeOperation = 'lighter';
        const corners = [
            { x: pitchX, y: pitchY },
            { x: pitchX + pitchW, y: pitchY },
            { x: pitchX, y: pitchY + pitchH },
            { x: pitchX + pitchW, y: pitchY + pitchH }
        ];
        for (const c of corners) {
            const grad = bCtx.createRadialGradient(c.x, c.y, 40, c.x, c.y, 650);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.18)');
            grad.addColorStop(0.5, 'rgba(255, 245, 200, 0.05)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            bCtx.fillStyle = grad;
            bCtx.beginPath();
            bCtx.arc(c.x, c.y, 650, 0, Math.PI * 2);
            bCtx.fill();
        }
        bCtx.restore();
    }

    function drawPokemonStadium(ctx) {
        if (!stadiumBgCanvas) renderStadiumToOffscreen();
        // 사전 렌더링된 스타디움 캔버스를 단 1회 drawImage로 초고속 복사!
        ctx.drawImage(stadiumBgCanvas, 0, 0);

        // 지형 데칼만 동적으로 렌더링
        drawGroundDecals(ctx);
    }

    // --- 화면 밖 적 방향 화살표 인디케이터 (오프스크린 인디케이터) ---
    function drawOffscreenIndicator(ctx, target) {
        if (!target || !target.isAlive) return;

        const sx = target.x - camera.x;
        const sy = target.y - camera.y;

        const marginInside = 50;
        if (sx >= marginInside && sx <= VIEW_WIDTH - marginInside &&
            sy >= marginInside && sy <= VIEW_HEIGHT - marginInside) {
            return;
        }

        const cx = VIEW_WIDTH / 2;
        const cy = VIEW_HEIGHT / 2;
        const angle = Math.atan2(sy - cy, sx - cx);

        const padX = 45;
        const padYTop = 85;
        const padYBottom = 70;
        const minX = padX;
        const maxX = VIEW_WIDTH - padX;
        const minY = padYTop;
        const maxY = VIEW_HEIGHT - padYBottom;

        let ix, iy;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);

        if (cos > 0) {
            ix = maxX;
            iy = cy + (maxX - cx) * Math.tan(angle);
        } else {
            ix = minX;
            iy = cy + (minX - cx) * Math.tan(angle);
        }

        if (iy < minY) {
            iy = minY;
            ix = cx + (minY - cy) / Math.tan(angle);
        } else if (iy > maxY) {
            iy = maxY;
            ix = cx + (maxY - cy) / Math.tan(angle);
        }

        const dist = Math.hypot(target.x - p1.x, target.y - p1.y);
        const distMeter = Math.round(dist / 20);

        const colorMain = (target.species === 'charmander') ? '#ff5722' : (target.species === 'squirtle' ? '#00e5ff' : (target.species === 'bulbasaur' ? '#00e676' : '#ffd700'));

        ctx.save();
        ctx.translate(ix, iy);

        const pulse = 1 + Math.sin(Date.now() * 0.009) * 0.14;

        // 1. 도트 화살표
        ctx.save();
        ctx.rotate(angle);
        ctx.scale(pulse, pulse);

        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.moveTo(22, 0);
        ctx.lineTo(-14, -18);
        ctx.lineTo(-6, 0);
        ctx.lineTo(-14, 18);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = colorMain;
        ctx.beginPath();
        ctx.moveTo(17, 0);
        ctx.lineTo(-10, -13);
        ctx.lineTo(-4, 0);
        ctx.lineTo(-10, 13);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        // 2. 적 정보 도트 배지
        const badgeDist = 42;
        const badgeX = -Math.cos(angle) * badgeDist;
        const badgeY = -Math.sin(angle) * badgeDist;

        ctx.save();
        ctx.translate(badgeX, badgeY);

        const boxW = 88;
        const boxH = 36;
        ctx.fillStyle = 'rgba(11, 16, 25, 0.94)';
        ctx.fillRect(-boxW / 2, -boxH / 2, boxW, boxH);
        ctx.strokeStyle = colorMain;
        ctx.lineWidth = 2.5;
        ctx.strokeRect(-boxW / 2, -boxH / 2, boxW, boxH);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-boxW / 2 - 2, -boxH / 2 - 2, 4, 4);
        ctx.fillRect(boxW / 2 - 2, -boxH / 2 - 2, 4, 4);
        ctx.fillRect(-boxW / 2 - 2, boxH / 2 - 2, 4, 4);
        ctx.fillRect(boxW / 2 - 2, boxH / 2 - 2, 4, 4);

        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillStyle = colorMain;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(target.name, 0, -6);

        ctx.font = '7.5px "Press Start 2P", monospace';
        ctx.fillStyle = '#ffd700';
        ctx.fillText(`${distMeter}m ◀`, 0, 8);

        ctx.restore();
        ctx.restore();
    }

    // --- 전체 경기장 도트 미니맵 레이더 HUD ---
    function drawMiniMap(ctx) {
        ctx.save();
        const mapW = 140;
        const mapH = 88;
        const mapX = VIEW_WIDTH - mapW - 16;
        const mapY = 82;

        ctx.fillStyle = 'rgba(11, 16, 25, 0.88)';
        ctx.fillRect(mapX, mapY, mapW, mapH);
        ctx.strokeStyle = '#334460';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(mapX, mapY, mapW, mapH);

        ctx.fillStyle = '#ffd700';
        ctx.font = '7px "Press Start 2P", monospace';
        ctx.textAlign = 'left';
        ctx.fillText('RADAR', mapX + 6, mapY + 12);

        const scaleX = (mapW - 14) / WORLD_WIDTH;
        const scaleY = (mapH - 20) / WORLD_HEIGHT;
        const offsetX = mapX + 7;
        const offsetY = mapY + 14;

        ctx.fillStyle = '#2e7d32';
        ctx.fillRect(offsetX + PITCH_X * scaleX, offsetY + PITCH_Y * scaleY, PITCH_W * scaleX, PITCH_H * scaleY);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1;
        ctx.strokeRect(offsetX + PITCH_X * scaleX, offsetY + PITCH_Y * scaleY, PITCH_W * scaleX, PITCH_H * scaleY);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.beginPath();
        ctx.arc(offsetX + CENTER_X * scaleX, offsetY + CENTER_Y * scaleY, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(offsetX + camera.x * scaleX, offsetY + camera.y * scaleY, VIEW_WIDTH * scaleX, VIEW_HEIGHT * scaleY);

        if (p1 && p1.isAlive) {
            ctx.fillStyle = '#00e676';
            ctx.fillRect(offsetX + p1.x * scaleX - 2.5, offsetY + p1.y * scaleY - 2.5, 5, 5);
        }

        if (p2 && p2.isAlive) {
            const blink = Math.floor(Date.now() / 180) % 2 === 0;
            ctx.fillStyle = blink ? '#ff1744' : '#ffd700';
            ctx.fillRect(offsetX + p2.x * scaleX - 3, offsetY + p2.y * scaleY - 3, 6, 6);
        }

        ctx.restore();
    }

    function chooseHeroForAI(oppHero, epsilon = 0.2) {
        if (Math.random() < epsilon) {
            return heroList[Math.floor(Math.random() * heroList.length)];
        }
        let bestHero = heroList[0];
        let bestVal = -Infinity;
        for (const hero of heroList) {
            const val = oppHero ? aiBrain.qSelect[hero][oppHero] : Object.values(aiBrain.qSelect[hero]).reduce((a, b) => a + b, 0) / 4;
            if (val > bestVal) {
                bestVal = val;
                bestHero = hero;
            }
        }
        return bestHero;
    }

    // 초고속 헤드리스 단일 매치 시뮬레이션
    function simulateHeadlessMatch(hero1, hero2) {
        let f1 = {
            species: hero1, hp: 1000, x: 900, y: 950,
            cooldowns: { attack: 0, q: 0, e: 0, r: 0, f: 0 },
            stunTimer: 0
        };
        let f2 = {
            species: hero2, hp: 1000, x: 2100, y: 950,
            cooldowns: { attack: 0, q: 0, e: 0, r: 0, f: 0 },
            stunTimer: 0
        };
        const projs = [];
        const maxTicks = 1000;

        for (let t = 0; t < maxTicks; t++) {
            if (f1.hp <= 0 || f2.hp <= 0) break;

            for (const k in f1.cooldowns) if (f1.cooldowns[k] > 0) f1.cooldowns[k] -= 1/60;
            for (const k in f2.cooldowns) if (f2.cooldowns[k] > 0) f2.cooldowns[k] -= 1/60;
            if (f1.stunTimer > 0) f1.stunTimer--;
            if (f2.stunTimer > 0) f2.stunTimer--;

            const dist = Math.hypot(f2.x - f1.x, f2.y - f1.y);
            const angToF2 = Math.atan2(f2.y - f1.y, f2.x - f1.x);
            const angToF1 = Math.atan2(f1.y - f2.y, f1.x - f2.x);

            // F1 이동
            if (f1.stunTimer <= 0) {
                const opt1 = aiBrain.tactics[f1.species].optimalRange;
                let move1 = angToF2;
                if (dist < opt1 - 40) move1 += Math.PI;
                else if (dist > opt1 + 60) move1 = angToF2;
                else move1 += (Math.PI / 2) * (Math.sin(t * 0.05) > 0 ? 1 : -1);
                f1.x = Math.max(300, Math.min(2700, f1.x + Math.cos(move1) * 5.4));
                f1.y = Math.max(300, Math.min(1600, f1.y + Math.sin(move1) * 5.4));
            }
            // F2 이동
            if (f2.stunTimer <= 0) {
                const opt2 = aiBrain.tactics[f2.species].optimalRange;
                let move2 = angToF1;
                if (dist < opt2 - 40) move2 += Math.PI;
                else if (dist > opt2 + 60) move2 = angToF1;
                else move2 += (Math.PI / 2) * (Math.sin(t * 0.05 + 1) > 0 ? 1 : -1);
                f2.x = Math.max(300, Math.min(2700, f2.x + Math.cos(move2) * 5.4));
                f2.y = Math.max(300, Math.min(1600, f2.y + Math.sin(move2) * 5.4));
            }

            // F1 / F2 스킬 시전
            if (f1.stunTimer <= 0) simCastSkills(f1, f2, dist, angToF2, projs);
            if (f2.stunTimer <= 0) simCastSkills(f2, f1, dist, angToF1, projs);

            // 투사체 이동 및 충돌
            for (let i = projs.length - 1; i >= 0; i--) {
                const p = projs[i];
                p.life--;
                p.x += p.vx;
                p.y += p.vy;

                const target = (p.owner === f1) ? f2 : f1;
                if (Math.hypot(target.x - p.x, target.y - p.y) <= p.radius + 28) {
                    // 학습된 회피 기동 (Dodge / Evasion)
                    const targetTactic = aiBrain.tactics[target.species];
                    const dodgeProb = (targetTactic ? targetTactic.dodgeChance : 0.4) * 0.68;
                    if (Math.random() < dodgeProb) {
                        // 회피 기동 성공: 비관통 투사체는 빗나가 소멸
                        if (!p.piercing) {
                            projs.splice(i, 1);
                            continue;
                        }
                    }

                    target.hp = Math.max(0, target.hp - p.damage);
                    if (p.stun > 0) target.stunTimer = Math.max(target.stunTimer, p.stun);
                    if (p.healRate > 0 && p.owner.hp > 0) {
                        p.owner.hp = Math.min(1000, p.owner.hp + p.damage * p.healRate);
                    }
                    if (!p.piercing) {
                        projs.splice(i, 1);
                        continue;
                    }
                }
                if (p.life <= 0) projs.splice(i, 1);
            }
        }

        let winner = f1.hp > f2.hp ? f1 : f2;
        let loser = f1.hp > f2.hp ? f2 : f1;
        let winnerHp = Math.max(0, winner.hp);

        // 점수 공식: 지면 0점, 이겼을 때 체력이 1000이면 100점, 체력 10 깎일 때마다 -1점
        const lostHp = Math.max(0, 1000 - winnerHp);
        const score = Math.max(0, 100 - Math.floor(lostHp / 10));

        return {
            winnerSpecies: winner.species,
            loserSpecies: loser.species,
            winnerHp: winnerHp,
            score: score
        };
    }

    function simCastSkills(attacker, target, dist, aimAngle, projs) {
        const s = attacker.species;
        if (s === 'charmander') {
            if (dist < 320 && attacker.cooldowns.f <= 0) {
                attacker.cooldowns.f = 11.0;
                target.hp = Math.max(0, target.hp - 96);
            } else if (dist >= 200 && dist <= 550 && attacker.cooldowns.q <= 0) {
                attacker.cooldowns.q = 5.5;
                target.hp = Math.max(0, target.hp - 120);
            } else if (dist >= 220 && dist <= 600 && attacker.cooldowns.r <= 0) {
                attacker.cooldowns.r = 8.5;
                projs.push({ x: attacker.x, y: attacker.y, vx: Math.cos(aimAngle)*17, vy: Math.sin(aimAngle)*17, radius: 28, damage: 90, owner: attacker, life: 60, piercing: false });
            } else if (attacker.cooldowns.attack <= 0) {
                attacker.cooldowns.attack = 0.32;
                projs.push({ x: attacker.x, y: attacker.y, vx: Math.cos(aimAngle)*26, vy: Math.sin(aimAngle)*26, radius: 15, damage: 45, owner: attacker, life: 35, piercing: false });

        } else if (s === 'squirtle') {

                projs.push({ x: attacker.x, y: attacker.y, vx: Math.cos(aimAngle)*34, vy: Math.sin(aimAngle)*34, radius: 34, damage: 200, owner: attacker, life: 40, piercing: true });
            } else if (dist < 220 && attacker.cooldowns.e <= 0) {

        } else if (s === 'pikachu') {
            if (dist >= 160 && dist <= 750 && attacker.cooldowns.f <= 0) {

                projs.push({ x: attacker.x, y: attacker.y, vx: Math.cos(aimAngle)*3.6, vy: Math.sin(aimAngle)*3.6, radius: 145, damage: 65, stun: 16, owner: attacker, life: 200, piercing: true });
            } else if (dist < 195 && attacker.cooldowns.e <= 0) {

            } else if (attacker.cooldowns.attack <= 0) {

                projs.push({ x: attacker.x, y: attacker.y, vx: Math.cos(aimAngle)*24, vy: Math.sin(aimAngle)*24, radius: 16, damage: 70, owner: attacker, life: 40, piercing: true });
            } else if (dist >= 180 && attacker.cooldowns.q <= 0) {

                projs.push({ x: attacker.x, y: attacker.y, vx: Math.cos(aimAngle)*21, vy: Math.sin(aimAngle)*21, radius: 22, damage: 88, owner: attacker, life: 35, piercing: false });
            } else if (attacker.cooldowns.attack <= 0) {

    let isTrainingInProgress = false;

    function run1000TrainingSessions() {
        if (isTrainingInProgress) return;
        isTrainingInProgress = true;

        const totalEpisodes = 1000;
        let currentEpisode = 0;
        const batchSize = 50;

        const progressFill = document.getElementById('train-progress-fill');
        const counterText = document.getElementById('train-counter-text');
        const statusText = document.getElementById('train-status-text');
        const runBtn = document.getElementById('btn-run-1000');
        runBtn.disabled = true;
        runBtn.innerText = '⏳ 훈련 연산 진행 중...';

        for (const h of heroList) {
            aiBrain.stats[h] = { picks: 0, wins: 0, scoreSum: 0 };
            aiBrain.tactics[h].dodgeChance = (h === 'scyther') ? 0.48 : ((h === 'lucario') ? 0.45 : ((h === 'pikachu') ? 0.42 : 0.38));
        }
        let initialScores = [];
        let finalScores = [];

        function processBatch() {
            const endBatch = Math.min(totalEpisodes, currentEpisode + batchSize);

            for (; currentEpisode < endBatch; currentEpisode++) {
                const epsilon = Math.max(0.05, 0.90 - (currentEpisode / 700));

                const heroA = chooseHeroForAI(null, epsilon);
                const heroB = chooseHeroForAI(heroA, epsilon);

                aiBrain.stats[heroA].picks++;
                aiBrain.stats[heroB].picks++;

                const res = simulateHeadlessMatch(heroA, heroB);

                aiBrain.stats[res.winnerSpecies].wins++;
                aiBrain.stats[res.winnerSpecies].scoreSum += res.score;

                if (currentEpisode < 100) initialScores.push(res.score);
                if (currentEpisode >= 900) finalScores.push(res.score);

                const alpha = 0.18;
                aiBrain.qSelect[res.winnerSpecies][res.loserSpecies] += alpha * (res.score - aiBrain.qSelect[res.winnerSpecies][res.loserSpecies]);
                aiBrain.qSelect[res.loserSpecies][res.winnerSpecies] += alpha * (0 - aiBrain.qSelect[res.loserSpecies][res.winnerSpecies]);

                // 승리 포켓몬의 전술 및 회피 기동 강화 (점수 극대화 유도)
                const tactic = aiBrain.tactics[res.winnerSpecies];
                tactic.dodgeChance = Math.min(0.88, tactic.dodgeChance + 0.0006);
            }

            const pct = Math.round((currentEpisode / totalEpisodes) * 100);
            if (progressFill) progressFill.style.width = `${pct}%`;
            if (counterText) counterText.innerText = `${currentEpisode} / ${totalEpisodes} (${pct}%)`;
            if (statusText) statusText.innerText = `훈련 진행 중: 에피소드 ${currentEpisode}회 완료...`;

            if (currentEpisode < totalEpisodes) {
                setTimeout(processBatch, 15);
            } else {
                aiBrain.isTrained = true;
                aiBrain.totalBattles += 1000;
                trainedAiActive = true;
                isTrainingInProgress = false;

                const initAvg = Math.max(1, Math.round(initialScores.reduce((a, b) => a + b, 0) / Math.max(1, initialScores.length)));
                const finalAvg = Math.round(finalScores.reduce((a, b) => a + b, 0) / Math.max(1, finalScores.length));
                aiBrain.initialAvgScore = initAvg;
                aiBrain.finalAvgScore = finalAvg;

                const scoreDiff = finalAvg - initAvg;
                document.getElementById('metric-initial-score').innerText = `${initAvg} 점`;
                document.getElementById('metric-final-score').innerText = `${finalAvg} 점`;
                document.getElementById('metric-score-diff').innerText = scoreDiff >= 0 ? `+${scoreDiff}점 상승! (대폭 강화)` : `${scoreDiff}점`;
                document.getElementById('metric-score-diff').style.color = scoreDiff >= 0 ? '#00e676' : '#ff5252';

                let bestHero = heroList[0];
                let bestScoreAvg = -1;
                for (const h of heroList) {
                    const avg = aiBrain.stats[h].wins > 0 ? (aiBrain.stats[h].scoreSum / aiBrain.stats[h].wins) : 0;
                    if (avg > bestScoreAvg) {
                        bestScoreAvg = avg;
                        bestHero = h;
                    }
                }
                const winRate = Math.round((aiBrain.stats[bestHero].wins / Math.max(1, aiBrain.stats[bestHero].picks)) * 100);
                document.getElementById('metric-best-hero').innerText = getPokemonName(bestHero);
                document.getElementById('metric-best-winrate').innerText = `승률 ${winRate}% (평균 ${Math.round(bestScoreAvg)}점)`;

                updateTrainingStatsTable();

                statusText.innerText = `🎉 1,000회 강화 훈련 완료! AI가 최고 점수 전술을 완벽 습득했습니다.`;
                runBtn.disabled = false;
                runBtn.innerText = '↺ 1,000회 재훈련 (추가 강화)';
                showAlert('🧠 AI 1,000회 강화학습 완료! 인게임 AI에 전술 적용됨.');
                updateHudSkillInfo();
            }
        }

        processBatch();
    }

    function switchHero() {
        p1HeroIndex = (p1HeroIndex + 1) % heroList.length;
        initBattle();
    }

    function switchEnemyHero() {
        p2HeroIndex = (p2HeroIndex + 1) % heroList.length;
        initBattle();
    }

    function setDifficulty(diff) {
        if (!DIFFICULTY_SETTINGS[diff]) return;
        currentDifficulty = diff;
        const cfg = DIFFICULTY_SETTINGS[diff];

        document.querySelectorAll('.btn-diff').forEach(btn => {
            if (btn.getAttribute('data-diff') === diff) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        if (p2) {
            p2.isAI = true;
            if (diff === 'sandbag') {
                p2.vx = 0;
                p2.vy = 0;
                p2.state = 'idle';
                p2.stunTimer = 0;
                p2.stateTimer = 0;
                p2.isSprintToggled = false;
                p2.hp = p2.maxHp;
            }
        }

        updateHudSkillInfo();
        showAlert(`난이도 변경: ${cfg.badge}`);
    }

            document.getElementById('icon-f').innerText = '🪨';
            document.getElementById('name-f').innerText = '스톤에지';
        } else if (p1.species === 'blaziken') {
            document.getElementById('icon-attack').innerText = '🔥';
            document.getElementById('name-attack').innerText = '블레이즈킥';
            document.getElementById('icon-q').innerText = '⚡';
            document.getElementById('name-q').innerText = '무릎차기';
            document.getElementById('icon-e').innerText = '☁️';
            document.getElementById('name-e').innerText = '뛰어오르기';
            document.getElementById('icon-r').innerText = '🥊';
            document.getElementById('name-r').innerText = '인파이트';
            document.getElementById('icon-f').innerText = '🔥';

        const btnP1 = document.getElementById('btn-switch-char');
