                        const smashRadius = 90;
                        const smashDamage = 125;
                        sfx.playBoneRushSmash();
                        triggerScreenShake(12);
                        triggerHitstop(8);
                        addGroundDecal(anchorX, anchorY, 34, 'crater');
                        addGroundDecal(anchorX, anchorY, 26, 'electric');

                        for (let i = 0; i < 22; i++) {
                            const spd = Math.random() * 5.5 + 2;
                            const a = Math.random() * Math.PI * 2;
                            particles.push(new Particle(anchorX, anchorY, Math.cos(a) * spd, Math.sin(a) * spd, Math.random() < 0.6 ? '#00e5ff' : '#2979ff', Math.random() * 7 + 3, 20, 'spark'));
                        }

                        const targets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
                        for (const tgt of targets) {
                            if (!tgt || !tgt.isAlive) continue;
                            const d = Math.hypot(tgt.x - anchorX, tgt.y - anchorY);
                            if (d <= smashRadius + tgt.radius) {
                                const kbAngle = Math.atan2(tgt.y - anchorY, tgt.x - anchorX);
                                tgt.takeDamage(smashDamage, this, true, Math.cos(kbAngle) * 22, Math.sin(kbAngle) * 22);
                                tgt.applyStun(21); // 0.35초 스턴
                            }
                        }

                        this.boneRushAnchor = null;
                        this.boneRushBuffTimer = 300; // 5초간 버프 지속
                        this.cooldowns.f = this.maxCooldowns.f; // 12초 쿨다운
                        showAlert('💥 본러시 바닥 내리치기 강타 성공! (5초간 평타/신속 강화) 💥');
                    }
                }

            } else if (this.species === 'onix') {
                if (slot === 'attack') {
                    // 평타: 근접 박치기 단일 (목을 당겼다 내려찍는다)
                    this.cooldowns.attack = this.maxCooldowns.attack;
                    this.headbuttTimer = 16;
                    this.attackMotionTimer = 16;
                    if (typeof sfx !== 'undefined' && sfx.playTackle) sfx.playTackle();

                    setTimeout(() => {
                        if (!this.isAlive) return;
                        if (typeof sfx !== 'undefined' && sfx.playRockSmash) sfx.playRockSmash();
                        triggerScreenShake(5);
                        const reach = 135;
                        const hitX = this.x + Math.cos(this.aimAngle) * 65;
                        const hitY = this.y + Math.sin(this.aimAngle) * 65;
                        addGroundDecal(hitX, hitY, 32, 'crater');

                        for (let i = 0; i < 12; i++) {
                            const a = this.aimAngle + (Math.random() - 0.5) * 1.2;
                            const spd = Math.random() * 6 + 2;
                            particles.push(new Particle(hitX, hitY, Math.cos(a) * spd, Math.sin(a) * spd, '#8d6e63', Math.random() * 6 + 3, 18));
                        }

                        const targets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
                        let closest = null;
                        let minD = 99999;
                        for (const tgt of targets) {
                            if (!tgt || !tgt.isAlive) continue;
                            const d = Math.hypot(tgt.x - hitX, tgt.y - hitY);
                            if (d <= reach && d < minD) {
                                minD = d;
                                closest = tgt;
                            }
                        }
                        if (closest) {
                            const kbX = Math.cos(this.aimAngle) * 14;
                            const kbY = Math.sin(this.aimAngle) * 14;
                            closest.takeDamage(58, this, false, kbX, kbY);
                            if (typeof sfx !== 'undefined' && sfx.playHit) sfx.playHit();
                        }
                        if (typeof stoneRocks !== 'undefined') {
                            for (const rock of stoneRocks) {
                                if (!rock.isAlive) continue;
                                const d = Math.hypot(rock.x - hitX, rock.y - hitY);
                                if (d <= reach + rock.radius) rock.takeDamage(58, this);
                            }
                        }
                    }, 110);

                } else if (slot === 'q') {
                    // Q: 구멍파기 (전광석화/돌진처럼 타겟 방향으로 자동 고속 돌진, 모습 숨김, 바닥 흙더미 표시, 오직 얼굴 돌에만 대미지)
                    this.cooldowns.q = this.maxCooldowns.q;
                    this.state = 'burrowed';
                    this.burrowTimer = 55; // 약 55프레임 돌진
                    this.burrowMaxTimer = 55;
                    this.burrowHitCooldown = 0;

                    // 타겟 방향 계산 (플레이어: 마우스 방향, AI: 상대 방향)
                    const aiTarget = (this.isAI && this.aiFocusTarget && this.aiFocusTarget.isAlive) ? this.aiFocusTarget : opponent;
                    const targetX = this.isAI ? aiTarget.x : mouse.x;
                    const targetY = this.isAI ? aiTarget.y : mouse.y;
                    const digAngle = Math.atan2(targetY - this.y, targetX - this.x);
                    this.aimAngle = digAngle;

                    const digSpeed = 15.5; // 전광석화 스타일 고속 돌진 속도
                    this.burrowVx = Math.cos(digAngle) * digSpeed;
                    this.burrowVy = Math.sin(digAngle) * digSpeed;

                    if (typeof sfx !== 'undefined' && sfx.playDig) sfx.playDig();
                    triggerScreenShake(8);
                    addGroundDecal(this.x, this.y, 50, 'crater');
                    showAlert('⛏️ 롱스톤 구멍파기 돌진 (DIG DASH)!');
                    for (let i = 0; i < 20; i++) {
                        const a = Math.random() * Math.PI * 2;
                        particles.push(new Particle(this.x, this.y, Math.cos(a) * 5, Math.sin(a) * 5 - 2, '#8d6e63', Math.random() * 7 + 3, 22));
                    }

                } else if (slot === 'e') {
                    // E: 지진 2연타 ('탁... 탁!') 및 땅 갈라짐 균열 (구멍파기 상대도 맞고 대미지 2배)
                    this.cooldowns.e = this.maxCooldowns.e;
                    this.attackMotionTimer = 18;
                    this.earthquakeStep = 1;
                    this.earthquakeStepTimer = 20; // 약 0.33초 뒤 2타 발동

                    if (typeof sfx !== 'undefined' && sfx.playEarthquake) sfx.playEarthquake();
                    if (typeof sfx !== 'undefined' && sfx.playRockSmash) sfx.playRockSmash();
                    triggerScreenShake(11);

                    // 1타 발동 ("탁!")
                    addGroundFissure(this.x, this.y, 280, 5);
                    showAlert('🌋 지진 1타 강타 (탁!)');
                    groundEffects.push(new EarthquakeShockwave(this.x, this.y, this, 280, 32, 60));

                } else if (slot === 'r') {
                    // R: 조이기 (근접 공격 맞춘 상대를 감싼다, 지속피해, QTE 영어 버튼 연타 탈출, 중형 이하만 묶을 수 있음)
                    this.cooldowns.r = this.maxCooldowns.r;
                    this.attackMotionTimer = 14;
                    if (typeof sfx !== 'undefined' && sfx.playBind) sfx.playBind();

                    const reach = 135;
                    const targets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
                    let hitTarget = null;
                    let minD = 99999;
                    for (const tgt of targets) {
                        if (!tgt || !tgt.isAlive) continue;
                        const d = Math.hypot(tgt.x - this.x, tgt.y - this.y);
                        if (d <= reach + tgt.radius && d < minD) {
                            minD = d;
                            hitTarget = tgt;
                        }
                    }

                    if (hitTarget) {
                        const isLarge = (hitTarget.sizeCategory === 'large' || hitTarget.species === 'onix');
                        if (isLarge) {
                            showAlert('⚠️ 롱스톤은 너무 거대하여 조일 수 없습니다!');
                            hitTarget.takeDamage(35, this, false, Math.cos(this.aimAngle) * 8, Math.sin(this.aimAngle) * 8);
                            if (typeof sfx !== 'undefined' && sfx.playHit) sfx.playHit();
                        } else {
                            this.state = 'binding';
                            this.boundVictim = hitTarget;
                            hitTarget.state = 'bound';
                            hitTarget.boundBy = this;
                            this.bindTimer = 240;

                            const qteKeys = ['A', 'S', 'D', 'W', 'Q', 'E', 'R', 'F', 'Z', 'X', 'C'];
                            this.qteKey = qteKeys[Math.floor(Math.random() * qteKeys.length)];
                            this.qteHitsNeeded = 5;
                            this.qteHitsCurrent = 0;

                            showAlert(`🐍 조이기 성공! [${hitTarget.name}] 포박!`);
                            if (typeof sfx !== 'undefined' && sfx.playBind) sfx.playBind();
                            triggerScreenShake(6);
                        }
                    } else {
                        showAlert('조이기 빗나감!');
                    }

                } else if (slot === 'f') {
                    // F: 스톤에지 (타겟 위치에 돌기둥 솟아오름 + 돌들이 날아가 랜덤 위치에 박힘, 길을 막고 공격받으면 파괴, 체력 100, 파괴 시 주변 대미지/밀치기)
                    this.cooldowns.f = this.maxCooldowns.f;
                    this.attackMotionTimer = 16;
                    if (typeof sfx !== 'undefined' && sfx.playRockSmash) sfx.playRockSmash();
                    triggerScreenShake(12);

                    const aiTarget = (this.isAI && this.aiFocusTarget && this.aiFocusTarget.isAlive) ? this.aiFocusTarget : opponent;
                    const targetX = this.isAI ? aiTarget.x : mouse.x;
                    const targetY = this.isAI ? aiTarget.y : mouse.y;

                    addGroundDecal(targetX, targetY, 65, 'crater');
                    showAlert('🪨 스톤에지 (STONE EDGE)!');

                    const seRadius = 180;
                    const targets = [opponent, ...scytherClones.filter(c => c.owner !== this && c.isAlive)];
                    for (const tgt of targets) {
                        if (!tgt || !tgt.isAlive) continue;
                        const d = Math.hypot(tgt.x - targetX, tgt.y - targetY);
                        if (d <= seRadius + tgt.radius) {
                            const kbAng = Math.atan2(tgt.y - targetY, tgt.x - targetX);
                            tgt.takeDamage(115, this, true, Math.cos(kbAng) * 16, Math.sin(kbAng) * 16);
                        }
                    }

                    for (let i = 0; i < 26; i++) {
                        const a = Math.random() * Math.PI * 2;
                        const spd = Math.random() * 8 + 3;
                        particles.push(new Particle(
                            targetX + (Math.random() - 0.5) * 60,
                            targetY + (Math.random() - 0.5) * 60,
                            Math.cos(a) * spd,
                            Math.sin(a) * spd - 6,
                            Math.random() < 0.6 ? '#90a4ae' : '#b0bec5',
                            Math.random() * 9 + 4,
                            35,
                            'spark'
                        ));
                    }

                    // 서로 가운데를 향해 사선으로 모여있는 원형 바위 기둥 진형 (5~6개)
                    const rockCount = 5;
                    const ringRadius = 72; // 타겟 중심을 둘러싸는 반경
                    for (let i = 0; i < rockCount; i++) {
                        const angle = (i / rockCount) * Math.PI * 2;
                        let rx = targetX + Math.cos(angle) * ringRadius;
                        let ry = targetY + Math.sin(angle) * ringRadius;
                        rx = Math.max(FIELD_MIN_X + 45, Math.min(FIELD_MAX_X - 45, rx));
                        ry = Math.max(FIELD_MIN_Y + 45, Math.min(FIELD_MAX_Y - 45, ry));

                        // 중심을 향해 사선으로 기울어지는 각도 계산
                        const tiltAngle = Math.atan2(targetY - ry, targetX - rx);

                        setTimeout(() => {
                            if (typeof stoneRocks !== 'undefined') {
                                stoneRocks.push(new StoneEdgeRock(rx, ry, this, tiltAngle, 0.4));
                                addGroundDecal(rx, ry, 36, 'crater');
                                triggerScreenShake(4.5);
                            }
                        }, 100 + i * 60);
                    }
                }
            }
        }

        applySlow(amount, duration) {
            this.slowAmount = amount;
            this.slowTimer = duration;
        }

        applyStun(duration) {
            // 경직 / 스턴 (행동 불가)
            if (this.invincibleTimer > 0) return;
            if (this.state === 'solarbeam_charge' || this.state === 'solarbeam_fire') return;
            this.stunTimer = Math.max(this.stunTimer || 0, duration);
            this.state = 'stun';
            this.stateTimer = Math.max(this.stateTimer || 0, duration);
            this.vx *= 0.15;
            this.vy *= 0.15;
            damageTexts.push(new DamageText(this.x, this.y - 28, '⚡ 경직!', '#ffd700', true));
        }

        // 번치코 플레어드라이브 등에 의한 화상 (7초간 지속 피해)
        applyBurn(attacker, duration = 420, dmgPerSec = 12) {
            this.burnTimer = duration;
            this.burnAttacker = attacker;
            this.burnDmg = dmgPerSec;
            showAlert(`🔥 [${this.name}] 7초간 화상 상태이상 부여!`);
        }

        takeDamage(dmg, attacker, isCrit = false, kbX = 0, kbY = 0, isHazard = false) {
            if (this.invincibleTimer > 0) return;

            // 번치코 인파이트 패널티: 5초간 받는 피해 1.5배
            if (this.defenseDownTimer > 0) {
                dmg *= 1.5;
                damageTexts.push(new DamageText(this.x, this.y - 35, '🛡️❌ 1.5x 피해!', '#ff5252', true));
            }

            this.hp = Math.max(0, this.hp - dmg);
            damageTexts.push(new DamageText(this.x, this.y, `-${Math.round(dmg)}`, isCrit ? '#ff1744' : '#ffeb3b', isCrit));

            // 장판류(불꽃회오리, 씨뿌리기, 오물폭탄) 피해인 경우:
            // 피격 경직(hurt) 및 밀치기(넉백)를 주지 않아 매끄럽게 탈출 가능!
            if (isHazard) {
                if (this.hp <= 0) {
                    if (this !== p1 && currentDifficulty === 'sandbag') {
                        this.hp = this.maxHp;
                        showAlert('🥊 샌드백 체력 리셋 (무한 연습)!');
                        return;
                    }
                    this.isAlive = false;
                    showAlert(`${this.name} K.O.!`);
                    showGameOverModal(attacker);
                }
                return;
            }

            // 솔라빔 차징 및 발사 중에는 절대 끊기지 않음 (슈퍼아머 / 무중단!)
            if (this.state === 'solarbeam_charge' || this.state === 'solarbeam_fire') {
                triggerScreenShake(3);
                return;
            }

            // 롱스톤은 "공격에 의한 넉백을 하지 않고" 슈퍼아머 보유
            const isHeavy = (this.species === 'onix');
            if (isHeavy) {
                triggerScreenShake(3);
                this.vx = 0;
                this.vy = 0;
            } else {
                if (this.stunTimer > 0) {
                    this.state = 'stun';
                } else if (isCrit || Math.hypot(kbX, kbY) > 10) {
                    this.state = 'knockdown';
                    this.stateTimer = 18;
                } else {
                    this.state = 'hurt';
                    this.stateTimer = 8;
                }
                this.vx = kbX;
                this.vy = kbY;
            }

            if (this.hp <= 0) {
                if (this !== p1 && currentDifficulty === 'sandbag') {
                    this.hp = this.maxHp;
                    showAlert('🥊 샌드백 체력 리셋 (무한 연습)!');
                    return;
                }
                this.isAlive = false;
                showAlert(`${this.name} K.O.!`);
                showGameOverModal(attacker);
            }
        }

        updateAI(target, speed) {
            if (!target.isAlive) return;

            const diffConfig = (typeof DIFFICULTY_SETTINGS !== 'undefined' && DIFFICULTY_SETTINGS[currentDifficulty]) 
                ? DIFFICULTY_SETTINGS[currentDifficulty] 
                : { speedMult: 1.12, dodgeChance: 0.88, skillMult: 1.35, canMove: true, canAttack: true };

            if (!diffConfig.canMove && !diffConfig.canAttack) {
                // 샌드백 난이도: 완전 정지 & 피격 전용
                this.vx = 0;
                this.vy = 0;
                this.state = 'idle';
                return;
            }

            const dist = Math.hypot(target.x - this.x, target.y - this.y);
            let angleToTarget = Math.atan2(target.y - this.y, target.x - this.x);
            if (diffConfig.aimNoise) {
                angleToTarget += (Math.random() - 0.5) * diffConfig.aimNoise;
            }
            this.aimAngle = angleToTarget;

            // 이동 속도 및 회피율 난이도 배율
            const effectiveSpeed = speed * (diffConfig.speedMult || 1.0);
            let optRange = 360;
            let dodgeChance = diffConfig.dodgeChance;

            if (currentDifficulty === 'hell') {
                // 지옥 난이도: 1000회 훈련된 강화 AI 최대 회피율과 사거리 제어
                const tactic = (typeof aiBrain !== 'undefined') ? aiBrain.tactics[this.species] : null;
                if (tactic) {
                    optRange = tactic.optimalRange;
                    dodgeChance = Math.max(0.85, tactic.dodgeChance);
                }
            } else if (currentDifficulty === 'hard') {
                optRange = (this.species === 'squirtle' ? 370 : (this.species === 'bulbasaur' ? 420 : (this.species === 'scyther' ? 140 : (this.species === 'lucario' ? 220 : 310))));
            } else if (currentDifficulty === 'normal') {
                optRange = (this.species === 'scyther' ? 150 : (this.species === 'lucario' ? 240 : 340));
            } else if (currentDifficulty === 'easy') {
                optRange = 150;
            }

            let moveAngle = angleToTarget;
            if (currentDifficulty === 'easy') {
                moveAngle = (dist > 160) ? angleToTarget : angleToTarget + Math.PI / 2;
            } else {
                if (dist < optRange - 50) {
                    moveAngle = angleToTarget + Math.PI; // 거리 벌리기
                } else if (dist > optRange + 70) {
                    moveAngle = angleToTarget; // 거리 좁히기
                } else {
                    moveAngle = angleToTarget + (Math.PI / 2) * (Math.sin(this.animTick * 0.04) > 0 ? 1 : -1);
                }
            }

            // 적 투사체 회피 기동 (난이도별 회피 확률)
            if (dodgeChance > 0) {
                for (let i = 0; i < projectiles.length; i++) {
                    const proj = projectiles[i];
                    if (proj.owner === target) {
                        const dToProj = Math.hypot(proj.x - this.x, proj.y - this.y);
                        if (dToProj < 240 && Math.random() < dodgeChance) {
                            moveAngle += (Math.random() < 0.5 ? Math.PI / 2 : -Math.PI / 2);
                            break;
                        }
                    }
                }
            }

            this.vx = Math.cos(moveAngle) * effectiveSpeed;
            this.vy = Math.sin(moveAngle) * effectiveSpeed;
            this.state = 'run';
            this.walkFrame += 0.25;

            // 스킬 시전 확률 배율
            const sm = diffConfig.skillMult !== undefined ? diffConfig.skillMult : 1.0;
            if (sm <= 0) return;

            if (this.species === 'squirtle') {
                if ((target.state === 'charging' || dist < 240) && this.cooldowns.r <= 0 && Math.random() < 0.06 * sm) {
                    this.useSkill('r');
                } else if (dist < 230 && this.cooldowns.e <= 0 && Math.random() < 0.08 * sm) {
                    this.useSkill('e');
                } else if (dist >= 220 && dist <= 600 && this.cooldowns.q <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('q');
                } else if (this.cooldowns.f <= 0 && dist >= 200 && dist <= 750 && Math.random() < 0.03 * sm) {
                    this.useSkill('f'); // 200 딜 하이드로펌프
                } else if (this.cooldowns.attack <= 0 && Math.random() < 0.07 * sm) {
                    this.useSkill('attack');
                }
            } else if (this.species === 'bulbasaur') {
                if (dist < 220 && this.cooldowns.e <= 0 && Math.random() < 0.08 * sm) {
                    this.useSkill('e'); // 꽃보라
                } else if (dist >= 200 && dist <= 550 && this.cooldowns.q <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('q'); // 씨뿌리기 (25% 회복 너프)
                } else if (dist >= 240 && dist <= 600 && this.cooldowns.r <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('r'); // 오물폭탄 (슬로우 너프)
                } else if (dist >= 250 && dist <= 750 && this.cooldowns.f <= 0 && Math.random() < 0.02 * sm) {
                    this.useSkill('f'); // 솔라빔 (회전 너프)
                } else if (this.cooldowns.attack <= 0 && Math.random() < 0.07 * sm) {
                    this.useSkill('attack');
                }
            } else if (this.species === 'pikachu') {
                if (dist < 200 && this.cooldowns.e <= 0 && Math.random() < 0.08 * sm) {
                    this.useSkill('e'); // 아이언테일로 날려버림
                } else if (dist >= 200 && dist <= 650 && this.cooldowns.q <= 0 && Math.random() < 0.035 * sm) {
                    this.useSkill('q'); // 전광석화 고속 돌진
                } else if (this.cooldowns.r <= 0 && Math.random() < 0.03 * sm) {
                    this.useSkill('r'); // 일렉트릭 네트
                } else if (this.cooldowns.f <= 0 && dist >= 160 && dist <= 700 && Math.random() < 0.03 * sm) {
                    this.useSkill('f'); // 지기 궁극기형 번개 (경직 + 조금씩 전진)
                } else if (this.cooldowns.attack <= 0 && Math.random() < 0.08 * sm) {
                    this.useSkill('attack'); // 초고속 백만볼트
                }
            } else if (this.species === 'scyther') {
                if (dist <= 135 && this.cooldowns.r <= 0 && Math.random() < 0.12 * sm) {
                    this.useSkill('r'); // 시저크로스 (명중 시 1초 리셋)
                } else if (dist <= 110 && this.cooldowns.attack <= 0 && Math.random() < 0.15 * sm) {
                    this.useSkill('attack'); // 연속자르기
                } else if (dist >= 180 && dist <= 600 && this.cooldowns.q <= 0 && Math.random() < 0.05 * sm) {
                    this.useSkill('q'); // 유턴 치고 빠지기
                } else if (dist >= 200 && dist <= 650 && this.cooldowns.e <= 0 && Math.random() < 0.04 * sm) {
                    this.useSkill('e'); // 에어커터 5발
                } else if (this.cooldowns.f <= 0 && Math.random() < 0.02 * sm) {

                }
            } else if (this.species === 'lucario') {
                // 루카리오 AI 행동 패턴
                const anchorDist = this.boneRushAnchor ? Math.hypot(target.x - this.boneRushAnchor.x, target.y - this.boneRushAnchor.y) : 9999;
                if (this.boneRushAnchor && (anchorDist <= 110 || this.boneRushAnchor.life < 45) && Math.random() < 0.28 * sm) {
                    // 뼈다귀 근처에 적이 있거나 시간이 다 되어갈 때 순간이동 강타
                    this.useSkill('f');
                } else if (dist <= 130 && this.cooldowns.attack <= 0 && Math.random() < 0.18 * sm) {

                } else if (dist >= 180 && dist <= 550 && this.cooldowns.e <= 0 && Math.random() < 0.06 * sm) {
                    this.useSkill('e'); // 신속 순간이동 밀치기
                } else if (dist >= 160 && dist <= 480 && this.cooldowns.r <= 0 && Math.random() < 0.05 * sm) {
                    this.useSkill('r'); // 뼈다귀 부메랑 10연사
                } else if (this.cooldowns.f <= 0 && !this.boneRushAnchor && dist >= 180 && dist <= 650 && Math.random() < 0.04 * sm) {

                } else if (dist >= 200 && dist <= 620 && this.cooldowns.q <= 0 && Math.random() < 0.05 * sm) {
